name: Inspect public OPlay matchup data
on:
  push:
    branches: [feat-unified-meta-prep-20261009]
    paths: [.github/workflows/inspect-oplay-matchups.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Analyze streamed HTML for matchups
        run: |
          node --input-type=module <<'JS'
          const u='https://oplaytcg.com/es/meta-stats';
          const res=await fetch(u,{headers:{'user-agent':'Mozilla/5.0'}});
          const html=await res.text();
          console.log('HTML',res.status,html.length);
          for(const w of ['Emparejamientos','Matchups','matchups','matchup','OP13-004','OP17-039','__next_f','api/meta']){
            const n=html.split(w).length-1;
            const i=html.indexOf(w);
            console.log('TERM',w,n,'SAMPLE',i>=0?html.slice(Math.max(0,i-350),i+550).replace(/\\s+/g,' ').slice(0,850):'-');
          }
          console.log('TABLE_COUNT',html.split('<table').length-1);
          let from=0;const matches=[];
          while(true){const index=html.indexOf('OP13-004',from);if(index<0)break;matches.push(index);from=index+8}
          console.log('ID_POSITIONS',JSON.stringify({count:matches.length,sample:matches.slice(0,7),end:matches.slice(-7)}));
          for(const i of [matches[4],matches[24],matches[Math.floor(matches.length/2)],matches[matches.length-4]]){
            if(i!==undefined)console.log('ID_CONTEXT',i,html.slice(i-250,i+340).replace(/\\s+/g,' ').slice(0,590));
          }
          for(const term of ['opponent','opponentId','leaderId','leader_id','winRate','win_rate','wins','losses','pairings','matrix','headToHead']){
            console.log('KEY',term,'COUNT',html.split(term).length-1,'LAST',html.lastIndexOf(term));
          }

          console.log('MATCHUP_WORD_NEAR',html.substring(Math.max(0,html.indexOf('matchup')-400),html.indexOf('matchup')+1000).slice(0,1300));
          JS
