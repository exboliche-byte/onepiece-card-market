name: Backup completo MiAlbumOnePiece (instantanea)

on:
  push:
    branches:
      - backup-full-2026-10-08
    paths:
      - .github/workflows/backup-project.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify source and Git history backups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup-files
          git archive --format=zip --output=backup-files/source.zip HEAD
          git bundle create backup-files/history.bundle --all
          unzip -tq backup-files/source.zip
          git bundle verify backup-files/history.bundle
          {
            echo "Project: exboliche-byte/onepiece-card-market"
            echo "Backup branch: backup-full-2026-10-08"
            echo "Original production code SHA: 5edd35b4dc575d2655374fa41862f36be003acf8"
            echo "Backup archive HEAD: $(git rev-parse HEAD)"
            echo "Created UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Vercel project: prj_D2GiNEA7iwIbSy3vrac6KnjERajo"
            echo "Supabase: Not included (database connection unavailable)"
            echo "Secrets/env values: Not included"
          } > backup-files/manifest.txt
          du -h backup-files/*
      - name: Store backup archive privately as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiAlbumOnePiece-backup-2026-10-08
          path: backup-files/
          if-no-files-found: error
          retention-days: 90
