name: Update Cardmarket prices

on:
  schedule:
    - cron: "15 4 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/cardmarket-prices.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh Cardmarket English catalog and prices
        run: node scripts/update-cardmarket-prices.mjs
      - name: Commit updated prices
        run: |
          git config user.name "MiAlbumOnePiece Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cardmarket-prices.json
          if git diff --cached --quiet; then
            echo "No price/catalog changes"
            exit 0
          fi
          git commit -m "chore: update Cardmarket English prices"
          git push origin main
