name: Update Cardmarket prices

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - fix/cardmarket-prices-daily-20261007
    paths-ignore:
      - data/cardmarket-prices.json

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update daily Cardmarket dataset
        run: node scripts/update-cardmarket-prices.mjs

      - name: Commit updated dataset
        run: |
          if git diff --quiet -- data/cardmarket-prices.json; then
            echo "No price changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cardmarket-prices.json
          git commit -m "chore: update daily Cardmarket prices"
          git push
