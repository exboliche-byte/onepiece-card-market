name: cardmarket-prices

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"
  push:
    paths:
      - "scripts/update-cardmarket-prices.mjs"
      - ".github/workflows/cardmarket-prices.yml"
      - "data/cards.json"
      - "data/packs.json"

permissions:
  contents: write

concurrency:
  group: cardmarket-prices-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Validate updater and future-set compatibility
        run: |
          node --check scripts/update-cardmarket-prices.mjs
          node --test scripts/catalog-guard.test.cjs scripts/expansion-aliases.test.cjs

      - name: Update Cardmarket prices
        run: node scripts/update-cardmarket-prices.mjs

      - name: Commit updated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cardmarket-prices.json
          if git diff --cached --quiet; then
            echo "No price changes"
          else
            git commit -m "data: update Cardmarket prices $(date -u +%Y-%m-%d)"
            git fetch origin main
            git rebase origin/main
            git push
          fi

# Keep the updater workflow active when its matching script changes.

# Catalog-sync compatible exact-print pricing.
# Refresh uses the merged catalog committed by sync.
