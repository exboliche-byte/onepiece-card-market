name: Verify multi-source Meta and automatic decks
on:
  push:
    branches: [feat-weighted-meta-wants-20261009, main]
    paths: [index.html, meta.js, meta-report.js, api/meta.js, api/meta-unified.js, api/meta-comparison.js, tournament-prep.js, wants.js, supabase/migrations/**, scripts/**, .github/workflows/verify-metasources-autosync.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Run regression suite and validate deployment output
        run: sh scripts/vercel-build.sh
      - name: Verify live OPlay public data can be parsed
        run: |
          node --input-type=module <<'JS'
          import handler from './api/meta-comparison.js';
          const r=await handler.fetch(new Request('https://example.invalid/api/meta-comparison'));
          const d=await r.json();
          console.log('INDEPENDENT_META',JSON.stringify(d.sources.map(s=>({name:s.name,status:s.status,leaders:s.leaders?.length,error:s.error,top:s.leaders?.[0]}))));
          if(!d.sources.some(s=>s.id==='oplay'&&s.status==='ok'&&s.leaders.length>=5))
            throw Error('OPlay source not verified: parser/SSR structure changed');
          JS

      - name: Verify real Limitless tournament coverage
        run: |
          node --input-type=module <<'JS'
          import handler from './api/meta.js';
          const start=Date.now();
          const response=await handler.fetch(new Request('https://example.invalid/api/meta?days=90&format=auto'));
          const d=await response.json();
          console.log('META_COVERAGE',JSON.stringify({
            status:response.status,eligible:d.eligibleEvents,scanned:d.scannedEvents,
            included:d.includedEvents,partial:d.partial,rateLimited:d.rateLimited,
            pages:d.pagesScanned,cap:d.coverageLimit,games:d.games,elapsedSeconds:(Date.now()-start)/1000
          }));
          if(!response.ok||!Array.isArray(d.leaders)||!d.leaders.length)throw Error('Meta unavailable');
          if(d.eligibleEvents<=24&&d.includedEvents<=24)throw Error('Main competitive format filtered too many events');
          JS

      - name: Verify combined live leader and matchup metagame
        run: |
          node --input-type=module <<'JS'
          import unified from './api/meta-unified.js';
          const response=await unified.fetch(new Request('https://example.invalid/api/meta-unified?days=90&format=auto'));
          const data=await response.json();
          console.log('UNIFIED_META',JSON.stringify({status:response.status,sources:data.sourcesAvailable,
           leaders:data.leaders?.length,matchups:data.matchups?.length,
           matchupsFromSimulator:data.matchups?.filter(x=>x.simulator).length,
           totalGames:data.games,tournamentGames:data.tournamentGames,simulatorGames:data.simulatorGames,
           includedEvents:data.includedEvents,partial:data.partial}));
          if(!response.ok||data.leaders.length<15||
             !data.matchups.some(x=>x.simulator?.games>0))
            throw Error('OPlay matchup data unavailable');
          if(data.sourcesAvailable<2&&!data.partial)
            throw Error('Provider unavailability must be marked partial');
          if(data.sourcesAvailable===2&&!data.leaders.some(x=>x.sourcesCount===2))
            throw Error('Missing leaders merged from both sources');
          JS
