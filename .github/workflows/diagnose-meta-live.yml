name: Diagnose live meta APIs
on:
  push:
    branches: [fix-login-decks-meta-back-20261009]
    paths: [.github/workflows/diagnose-meta-live.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public and upstream JSON endpoints (no credentials)
        run: |
          node --input-type=module <<'JS'
          for(const url of [
            'https://onepiece-card-market.vercel.app/api/meta?days=90&format=auto',
            'https://onepiece-card-market.vercel.app/api/competitive-decks?leader=all&days=30&limit=1',
            'https://play.limitlesstcg.com/api/tournaments?game=OP&limit=10&page=1'
          ]) {
            try {
              const response=await fetch(url,{signal:AbortSignal.timeout(35000)});
              const data=await response.text();
              console.log('DIAGNOSTIC',JSON.stringify({url,status:response.status,contentType:response.headers.get('content-type'),sample:data.slice(0,650)}));
            } catch(error) { console.log('DIAGNOSTIC_ERROR',JSON.stringify({url,error:String(error)})); }
          }
          JS
