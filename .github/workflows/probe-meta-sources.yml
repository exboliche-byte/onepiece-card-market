name: Check independent meta data sources
on:
  push:
    branches: [fix-autosync-multisource-meta-20261009]
    paths: [.github/workflows/probe-meta-sources.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Fetch sources and print sample structure
        run: |
          node --input-type=module <<'JS'
          const sites=[
          'https://oplaytcg.com/es/meta-stats',
          'https://everythingoptcg.com/meta',
          'https://opmetagame.com/decks/'
          ];
          for(const url of sites){
            try {
              const response=await fetch(url,{headers:{"user-agent":"Mozilla/5.0 (compatible; MiAlbumOnePiece/1.0)","accept":"text/html"},signal:AbortSignal.timeout(14000)});
              const html=await response.text();
              const find=(x,n=250)=>{const i=html.indexOf(x);return i<0?"MISSING":html.slice(Math.max(0,i-150),i+n).replace(/\s+/g," ").slice(0,600)};
              console.log("SOURCE",JSON.stringify({url,status:response.status,size:html.length,title:find("<title",350),id:find("OP17-039",450),results:find("winrate",450),next:find("__NEXT_DATA__",120),embedded:find("__next_f",120)}));
            }catch(e){console.log("SOURCE_ERROR",url,String(e))}
          }
          JS
