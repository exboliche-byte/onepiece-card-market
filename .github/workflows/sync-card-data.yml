name: Sync One Piece card database

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Download upstream catalog
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/hugoprudente/optcgjson/main/output/AllSets.json -o /tmp/optcg-allsets.json

      - name: Normalize and validate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const raw=JSON.parse(fs.readFileSync("/tmp/optcg-allsets.json","utf8"));
          const normalizeSetCode=v=>{
            v=String(v||"").trim().toUpperCase();
            if(v==="OP14")return "OP14-EB04";
            if(v==="OP15")return "OP15-EB04";
            const m=v.match(/^(OP|EB|ST|PRB)-?(\d{2})$/);
            return m?m[1]+"-"+m[2]:v;
          };
          const cards=[],packs=[],seen=new Set();
          for(const [key,payload] of Object.entries(raw||{})){
            const d=payload?.data||payload;if(!d||!Array.isArray(d.cards))continue;
            const setCode=normalizeSetCode(d.code||key), setName=String(d.name||"").trim(), list=Array.isArray(d.cards)?d.cards:[];
            packs.push({code:setCode,name:setName,cardCount:list.length});
            for(const c of list){
              const id=String(c?.id||"").trim();
              if(!id||seen.has(id))continue;
              if(Array.isArray(c.languages)&&c.languages.length&&!c.languages.some(x=>/^English$/i.test(String(x))))continue;
              seen.add(id);
              const m=id.toUpperCase().match(/^(OP|EB|ST|PRB)(\d{2})-/);
              cards.push({...c,id,set:m?normalizeSetCode(m[1]+m[2]):setCode,set_name:setName,rarity:c.rarity==="L"?"Leader":c.rarity,category:c.cardClass==="LEADER"?"Leader":c.cardClass==="EVENT"?"Event":c.cardClass==="STAGE"?"Stage":c.cardClass==="DON"?"Don":"Character",colors:c.color||[],attributes:c.attribute||[],types:c.feature||[],image:c.imageUrl||""});
            }
          }
          if(cards.length<4500)throw new Error("optcgjson catalog unexpectedly small: "+cards.length);
          if(packs.length<40)throw new Error("optcgjson pack list unexpectedly small: "+packs.length);
          fs.writeFileSync("data/cards.json",JSON.stringify(cards,null,2)+"\n");
          fs.writeFileSync("data/packs.json",JSON.stringify(packs,null,2)+"\n");
          fs.writeFileSync("data/catalog-meta.json",JSON.stringify({updatedAt:new Date().toISOString(),cardCount:cards.length,packCount:packs.length,source:"hugoprudente/optcgjson"},null,2)+"\n");
          NODE

      - name: Commit catalog changes
        run: |
          git config user.name "MiAlbumOnePiece Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/packs.json data/catalog-meta.json
          if git diff --cached --quiet; then echo "Catalog unchanged"; exit 0; fi
          git commit -m "chore: sync One Piece card catalog"
          git push
