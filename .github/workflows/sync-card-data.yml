name: Sync One Piece card database

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-card-data.yml"
      - "scripts/augment-limitless-prints.mjs"

permissions:
  contents: write

concurrency:
  group: onepiece-card-catalog-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Download upstream catalog
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/hugoprudente/optcgjson/main/output/AllSets.json -o /tmp/optcg-allsets.json
          curl -fsSL --retry 3 https://raw.githubusercontent.com/michalkiral/optcg-data/main/data/index/cards_by_id.json -o /tmp/optcg-cards-secondary.json
          curl -fsSL --retry 3 https://raw.githubusercontent.com/michalkiral/optcg-data/main/data/packs.json -o /tmp/optcg-packs-secondary.json

      - name: Normalize and validate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const raw=JSON.parse(fs.readFileSync("/tmp/optcg-allsets.json","utf8"));
          const normalizeSetCode=v=>{
            v=String(v||"").trim().toUpperCase();
            if(v==="OP14")return "OP14-EB04";
            if(v==="OP15")return "OP15-EB04";
            if(v==="PROMOTION-CARD"||v==="PROMOTIONCARD")return "PROMOTIONCARD";
            const m=v.match(/^(OP|EB|ST|PRB)-?(\d{2})$/);
            return m?m[1]+"-"+m[2]:v;
          };
          const cards=[],packs=[],seen=new Set();
          const root=raw?.data&&typeof raw.data==="object"&&!Array.isArray(raw.data)?raw.data:(raw||{});
          for(const [key,payload] of Object.entries(root)){
            const d=payload?.data||payload;if(!d||!Array.isArray(d.cards))continue;
            const setCode=normalizeSetCode(d.code||key), setName=String(d.name||"").trim(), list=Array.isArray(d.cards)?d.cards:[];
            packs.push({code:setCode,name:setName,cardCount:list.length});
            for(const c of list){
              const id=String(c?.id||"").trim();
              if(!id||seen.has(id))continue;
              if(Array.isArray(c.languages)&&c.languages.length&&!c.languages.some(x=>/^English$/i.test(String(x))))continue;
              seen.add(id);
              const m=id.toUpperCase().match(/^(OP|EB|ST|PRB)(\d{2})-/);
              const originSet=m?normalizeSetCode(m[1]+m[2]):setCode;
              const printName=String(c.card_set||setName||setCode).trim();
              cards.push({
                ...c,
                id,
                set:setCode,
                source_set:setCode,
                origin_set:originSet,
                set_name:printName,
                pack_name:setName,
                rarity:c.rarity==="L"?"Leader":c.rarity,
                category:c.cardClass==="LEADER"?"Leader":c.cardClass==="EVENT"?"Event":c.cardClass==="STAGE"?"Stage":c.cardClass==="DON"?"Don":"Character",
                colors:c.color||[],
                attributes:c.attribute||[],
                types:c.feature||[],
                image:c.imageUrl||""
              });
            }
          }
          // Augment the primary catalog with a second official-site-derived
          // catalog that preserves exact _pN/_rN print IDs. This prevents a
          // newly published promo/reprint from disappearing just because one
          // upstream has not exposed it yet.
          const secondaryRaw=JSON.parse(fs.readFileSync("/tmp/optcg-cards-secondary.json","utf8"));
          const secondaryCards=Array.isArray(secondaryRaw)?secondaryRaw:Object.values(secondaryRaw||{});
          let secondaryAdded=0;
          for(const c of secondaryCards){
            const id=String(c?.id||"").trim();
            if(!id||seen.has(id))continue;
            if(/_jp\d+$/i.test(id))continue;
            const setCode=normalizeSetCode(c?.set||"");
            if(!setCode)continue;
            seen.add(id);
            cards.push({
              ...c,
              id,
              set:setCode,
              source_set:setCode,
              origin_set:normalizeSetCode(String(id).replace(/_(?:p|r|c)\d+$/i,"").split("-")[0]),
              set_name:String(c?.set_name||c?.pack_name||setCode),
              rarity:c?.rarity==="L"?"Leader":c?.rarity,
              category:c?.category||"Character",
              colors:Array.isArray(c?.colors)?c.colors:[],
              attributes:Array.isArray(c?.attributes)?c.attributes:[],
              types:Array.isArray(c?.types)?c.types:[],
              image:String(c?.image||c?.imageUrl||""),
              isParallel:/_(?:p|c)\d+$/i.test(id)||!!c?.isParallel
            });
            secondaryAdded++;
          }

          const secondaryPacksRaw=JSON.parse(fs.readFileSync("/tmp/optcg-packs-secondary.json","utf8"));
          const secondaryPacks=Array.isArray(secondaryPacksRaw)?secondaryPacksRaw:Object.values(secondaryPacksRaw||{});
          const packCodes=new Set(packs.map(p=>String(p.code||"").toUpperCase()));
          for(const p of secondaryPacks){
            const code=normalizeSetCode(p?.code||p?.id||"");
            if(!code||packCodes.has(code))continue;
            packs.push({code,name:String(p?.name||p?.title||code),cardCount:Number(p?.cardCount||0)});
            packCodes.add(code);
          }

          if(cards.length<4500)throw new Error("merged catalog unexpectedly small: "+cards.length);
          if(packs.length<40)throw new Error("merged pack list unexpectedly small: "+packs.length);
          console.log("Secondary exact-print cards added:",secondaryAdded);
          fs.writeFileSync("data/cards.json",JSON.stringify(cards,null,2)+"\n");
          fs.writeFileSync("data/packs.json",JSON.stringify(packs,null,2)+"\n");
          fs.writeFileSync("data/catalog-meta.json",JSON.stringify({updatedAt:new Date().toISOString(),cardCount:cards.length,packCount:packs.length,source:"hugoprudente/optcgjson"},null,2)+"\n");
          NODE

      - name: Augment exact promotional printings
        run: node scripts/augment-limitless-prints.mjs

      - name: Commit catalog changes
        run: |
          git config user.name "MiAlbumOnePiece Catalog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/packs.json data/catalog-meta.json
          if git diff --cached --quiet; then echo "Catalog unchanged"; exit 0; fi
          git commit -m "chore: sync One Piece card catalog"
          git fetch origin main
          git rebase origin/main
          git push
