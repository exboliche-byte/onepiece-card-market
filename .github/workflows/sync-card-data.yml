name: Sync One Piece card database

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest card data
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/michalkiral/optcg-data/main/data/index/cards_by_id.json -o data/cards.json
          curl -fsSL --retry 3 https://raw.githubusercontent.com/michalkiral/optcg-data/main/data/packs.json -o data/packs.json
          curl -fsSL --retry 3 https://raw.githubusercontent.com/michalkiral/optcg-data/main/data/manifest.json -o /tmp/manifest.json
          python - <<'PY'
          import json
          m=json.load(open("/tmp/manifest.json"))
          meta={"generatedAt":m.get("generatedAt"),"packCount":m.get("packCount"),"cardCount":m.get("cardCount")}
          json.dump(meta,open("data/catalog-meta.json","w"),ensure_ascii=False,separators=(",",":"))
          PY

      - name: Commit only when data changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/cards.json data/packs.json data/catalog-meta.json; then
            echo "No card-data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json data/packs.json data/catalog-meta.json
          git commit -m "Sync latest One Piece card database"
          git push
