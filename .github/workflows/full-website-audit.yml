name: Full website browser audit
on:
  push:
    paths:
      - ".github/workflows/full-website-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright@1.59.1
          npx playwright install --with-deps chromium
      - name: Smoke-test current audited preview release
        env:
          BASE_URL: https://onepiece-card-market-ljvj82a1t-exboliche-6884.vercel.app
        run: node scripts/browser-smoke.mjs
