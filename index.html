.proxy-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.9fr);gap:12px;align-items:start}

/* Compact controls for a single deck: actions and detailed numbers stay available on demand. */
.deck-compact-hero{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0;margin:6px 0 12px}
.deck-compact-title{min-width:0;flex:1}
.deck-compact-title h1{font-size:clamp(26px,6vw,38px);margin:5px 0 0;line-height:1.12;overflow-wrap:anywhere}
.deck-compact-title .linkbtn{font-size:13px}
.deck-action-menu{position:relative;flex:none}
.deck-action-menu>summary{display:flex;align-items:center;gap:6px;list-style:none;white-space:nowrap;user-select:none}
.deck-action-menu>summary::-webkit-details-marker,.deck-stats-toggle>summary::-webkit-details-marker{display:none}
.deck-action-menu[open]>summary{border-color:var(--accent);color:var(--accent)}
.deck-action-menu-panel{position:absolute;right:0;top:calc(100% + 7px);z-index:25;display:grid;gap:7px;width:min(300px,calc(100vw - 30px));padding:10px;background:#151c2a;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px #000b}
.deck-action-menu-panel .btn{width:100%;text-align:left;font-size:13px;line-height:1.25}
.deck-action-menu-panel .danger{margin-top:3px}
.deck-draft-save{margin-bottom:12px}
.deck-stats-toggle{margin:0 0 12px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
.deck-stats-toggle>summary{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;list-style:none;user-select:none}
.deck-stats-badge{padding:5px 8px;border-radius:8px;background:var(--panel2);font-size:12px;font-weight:750;white-space:nowrap}
.deck-stats-badge.valid{color:var(--ok)}
.deck-stats-badge.invalid{color:var(--danger)}
.deck-stats-expand{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.deck-stats-expand::after{content:" ▾"}
.deck-stats-toggle[open] .deck-stats-expand::after{content:" ▴"}
.deck-stats-content{padding:0 11px 11px}
.deck-stats-content .stats{margin-bottom:8px}
.deck-stats-content .validation{margin-bottom:0}
@media(max-width:500px){.deck-compact-hero{align-items:center}.deck-compact-title h1{font-size:clamp(24px,7vw,32px)}.deck-action-menu>summary{padding:9px 10px;font-size:13px}.deck-stats-badge{font-size:11px}.deck-stats-expand{font-size:11px}}

.desktop-side{display:none}

}
@media(max-width:899px){

.app{padding-left:0;padding-bottom:82px}
.nav.mobile-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}

.mobile-more svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script>
let SUPABASE_URL="";
let SUPABASE_KEY="";
const AUTH_SITE_URL="https://onepiece-card-market.vercel.app";
const AUTH_RETURN_URL=AUTH_SITE_URL+"/auth/confirm";
const PASSWORD_RESET_URL=AUTH_SITE_URL+"/auth/reset";
const DATA="/data/";
const PLAYSET=4;
const LEADER_PLAYSET=1;
const PAGE=60;
const state={
  cards:[],packs:[],groups:[],groupByKey:new Map(),prices:{},priceDate:null,importedCards:{},
  collection:{},decks:[],sharedDeck:null,publicCollection:null,tournaments:[],tournamentId:null,tournamentDraft:null,tournamentRoundDraft:null,wishlist:{},user:null,sb:null,
  tab:"catalog",set:"",query:"",detail:null,deckId:null,collectionStatsOpen:false,deckCompositionSort:"id",deckCompositionDir:"asc",
  proxyQuery:"",proxySelection:{},
  catalog:{set:"Todas",category:"Todos",color:"Todos",rarity:"Todos",type:"Todos",attribute:"Todos",ownership:"Todas",sort:"id",dir:"asc",page:1,grouped:true,minCost:"",maxCost:"",minPower:"",maxPower:"",minPrice:"",maxPrice:"",query:"",filtersOpen:false},
  owned:{},collectionReady:false,collection:{query:"",set:"Todas",category:"Todos",color:"Todos",rarity:"Todos",type:"Todos",attribute:"Todos",quantity:"Todas",playset:"Todas",sort:"id",dir:"asc",page:1,filtersOpen:false},
  album:{set:"",query:"",ownership:"Todas",sort:"id",dir:"asc",page:1},expansions:{query:"",type:"Todos",sort:"set",dir:"asc"},
  deckQuery:"",deckPage:1,deckLibrary:true,deckChoosingLeader:false,deckPreviewOrigin:"",deckPreviewScrollY:0,deckDiscover:false,deckDiscoverLeader:"",deckDiscoverLeaderQuery:"",deckDiscoverResults:[],deckDiscoverLoading:false,deckDiscoverError:"",deckDiscoverDays:90,deckDiscoverMinPlayers:32,deckDiscoverMeta:null,deckFilters:{set:"Todas",category:"Todos",color:"Todos",rarity:"Todos",type:"Todos",attribute:"Todos",ownership:"Todas",sort:"id",dir:"asc",filtersOpen:false},auth:false,authReady:false,authBusy:false,authError:"",authNotice:"",authRecovery:false,toast:"",loading:true
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const money=n=>n!==null&&n!==undefined&&n!==""&&Number.isFinite(Number(n))?Number(n).toLocaleString("es-ES",{style:"currency",currency:"EUR"}):"—";
const safeId=id=>String(id||"");
const imagePreloadCache=new Map();
const visualPrintId=c=>String(c?.importVariantId||c?.id||"").trim().replace(/_base$/i,"")||String(c?.id||"");
const officialImageUrl=c=>{
  const id=visualPrintId(c);
  if(c?.syntheticImport||c?.importVariantId)return "https://asia-en.onepiece-cardgame.com/images/cardlist/card/"+encodeURIComponent(id)+".png";
  return String(c?.image||c?.imageUrl||"").trim()||("https://en.onepiece-cardgame.com/images/cardlist/card/"+encodeURIComponent(id)+".png");
};
const imageUrl=c=>officialImageUrl(c);
const imageCdnUrl=c=>"https://optcg-api.arjunbansal-ai.workers.dev/images/"+encodeURIComponent(visualPrintId(c));
const fallbackImageUrl=c=>"https://images.weserv.nl/?url="+encodeURIComponent(officialImageUrl(c).replace("https://","").replace("http://",""));
function preloadCardImage(c){const u=imageCdnUrl(c);if(!u||imagePreloadCache.has(u))return;const im=new Image();im.src=u;imagePreloadCache.set(u,im)}
function cardImg(c,cls="cardimg"){
  const cdn=imageCdnUrl(c),official=officialImageUrl(c),fallback=fallbackImageUrl(c);
  const loading=cls.includes("detail")||cls.includes("deckleader")?"eager":"lazy";
  const priority=cls.includes("detail")?' fetchpriority="high"':cls.includes("competitive-leader-img")?' fetchpriority="auto"':"";
  return '<img class="'+cls+'" loading="'+loading+'" decoding="async"'+priority+' src="'+esc(cdn)+'" alt="'+esc(c.name||c.id)+'" data-image-official="'+esc(official)+'" data-image-fallback="'+esc(fallback)+'" onerror="if(this.dataset.imageStep!==\'1\'){this.dataset.imageStep=\'1\';this.src=this.dataset.imageOfficial}else if(this.dataset.imageStep!==\'2\'){this.dataset.imageStep=\'2\';this.src=this.dataset.imageFallback}else{this.style.visibility=\'hidden\'}">';
}
function deckOwnedImg(c,have,required){
  const total=Math.max(1,Number(required)||1),owned=Math.max(0,Math.min(total,Number(have)||0));
  if(owned>=total)return '<div class="deck-owned-image">'+cardImg(c,"cardimg")+'</div>';
  const pct=Math.max(0,Math.min(100,owned/total*100));
  return '<div class="deck-owned-image" style="--owned-pct:'+pct+'%">'+cardImg(c,"cardimg deck-owned-image-grey")+(pct>0?cardImg(c,"cardimg deck-owned-image-color"):"")+'</div>';
}
function qty(id){return Number(state.owned[id]||0)}
function playsetTarget(c){return c?.category==="Leader"?LEADER_PLAYSET:PLAYSET}
function deckCopyLimit(c){
  const text=String(c?.effect||c?.text||"");
  if(/any number of this card/i.test(text))return 50;
  const m=text.match(/up to\s+(\d+)\s+copies?\s+of this card/i);
  if(m)return Math.max(4,Math.min(50,Number(m[1])||4));
  return 4;
}
function deckCopyLimitForId(id){
  const exact=card(id);if(exact)return deckCopyLimit(exact);
  const base=baseId(id),g=state.groups.find(g=>g.versions.some(v=>norm(baseId(v.id))===norm(base)));
  return g?Math.max(...g.versions.map(deckCopyLimit)):4;
}

function isJapaneseCatalogCard(c){
  return /(?:^|[-_ ])JP(?:$|[-_ ])|\bJAPANESE\b|NON-ENGLISH|ASIA REGION LEGAL/i.test(
    String(c?.id||"")+" "+String(c?.set||"")+" "+String(c?.set_name||"")
  );
}
function card(id){return state.cards.find(c=>c.id===id)}
function baseId(id){return safeId(id).replace(/__csv_[a-z0-9]+(?:_[a-z]+)?$/i,"").replace(/_(?:p\d+|r\d+|c\d+|jp\d+)$/i,"")}
function normalizePrintSet(value){
  const raw=String(value||"").trim().toUpperCase().replace(/[\s_-]+/g,"");
  if(raw==="OP14EB04")return "OP14";
  if(raw==="OP15EB04")return "OP15";
  return raw;
}
function variantKindOf(c){
  const explicit=String(c?.importVariantKind||priceMeta(c)?.variantKind||"").toLowerCase();
  if(explicit)return explicit;
  const id=String(c?.id||"");
  if(/_r\d+$/i.test(id))return "reprint";
  if(/_(?:p|c)\d+$/i.test(id))return "parallel";
  return "base";
}
function printSetOf(c){
  const saved=state.importedCards?.[c?.id]||{};
  const imported=String(c?.importPrintSet||saved?.importPrintSet||"").trim();
  return imported||catalogPrintSetOf(c)||String(directMarketMeta(c)?.printSet||"").trim();
}
function groupKey(c){
  return norm(baseId(c?.id));
}
function rebuildCardGroups(){
  const map=new Map();
  for(const c of state.cards){
    c.search=norm([c.id,c.name,c.set,c.set_name,c.category,c.rarity,...(c.colors||[]),...(c.types||[]),...(c.attributes||[]),c.effect,c.trigger].join(" "));
    const k=groupKey(c);
    if(!map.has(k))map.set(k,{key:k,card:c,ids:[],sets:new Set()});
    const g=map.get(k);g.ids.push(c.id);g.sets.add(cardExpansionCode(c));
  }
  state.groups=[...map.values()].map(g=>({...g,sets:[...g.sets].sort(),versions:g.ids.map(id=>card(id)).filter(Boolean)}));
  state.groupByKey=map;
}
let marketDatasetCards={};
function catalogSetForMarketPrint(printSet,base){
  const wanted=normalizePrintSet(printSet);
  const exact=state.packs.find(p=>normalizePrintSet(p?.code)===wanted);
  if(exact)return exact.code;
  if(wanted==="P"){
    const promo=state.packs.find(p=>setCodeKey(p?.code)==="PROMOTIONCARD")
      ||state.packs.find(p=>expansionType(p?.code)==="PROMO"||/PROMO|PROMOTION/i.test(String(p?.code||"")+" "+String(p?.name||"")));
    if(promo)return promo.code;
  }
  const m=wanted.match(/^(OP|EB|ST|PRB)(\d{2})$/);
  if(m)return m[1]+"-"+m[2];
  return String(base?.source_set||base?.set||"");
}
function augmentCatalogWithMarketPrints(){
  if(!state.cards.length||!marketDatasetCards||typeof marketDatasetCards!=="object")return false;
  const byId=new Map(state.cards.map(c=>[norm(c.id),c]));
  let changed=false;
  for(const [rawId,entry] of Object.entries(marketDatasetCards)){
    const id=String(rawId||"").trim();
    if(!id||/_jp\d+$/i.test(id)||byId.has(norm(id)))continue;
    if(!/^(?:P-\d{3}|(?:OP|EB|ST|PRB)\d{2}-\d{3})(?:_(?:p|r|c)\d+)?$/i.test(id))continue;
    const logical=baseId(id);
    const base=state.cards.find(c=>norm(c.id)===norm(logical))||state.cards.find(c=>norm(baseId(c.id))===norm(logical));
    if(!base)continue;
    const setCode=catalogSetForMarketPrint(entry?.printSet,base)||String(base?.set||"");
    const copy={
      ...base,
      id,
      number:logical,
      set:setCode,
      source_set:setCode,
      set_name:String(entry?.expansion||base?.set_name||setCode),
      image:"",
      isParallel:String(entry?.variantKind||"").toLowerCase()==="parallel"||/_(?:p|c)\d+$/i.test(id),
      marketAugmented:true
    };
    state.cards.push(copy);
    byId.set(norm(id),copy);
    changed=true;
  }
  if(changed)rebuildCardGroups();
  return changed;
}
function logicalQty(c){
  const ids=state.groupByKey?.get(groupKey(c))?.ids||[c?.id];
  return ids.reduce((sum,id)=>sum+qty(id),0);
}
function uniqueSorted(arr){return [...new Set(arr.filter(v=>v!==null&&v!==undefined&&String(v)!==""))].sort((a,b)=>String(a).localeCompare(String(b),"es"))}
function packSortKey(code){
  const s=String(code||"").toUpperCase().replace(/\s+/g,"");
  const merged=s.match(/^OP-?([0-9]+)-EB-?[0-9]+/);
  if(merged)return [1,Number(merged[1]),"OP",s];
  const m=s.match(/^(OP|ST|EB|PRB|P|DON|PROMO)[-_]?([0-9]+)/);
  const rank={OP:1,EB:2,ST:3,PRB:4,P:5,PROMO:6,DON:7};
  if(m)return [rank[m[1]]||99,Number(m[2]),m[1],s];
  return [99,9999,s,s];
}
function comparePacks(a,b){
  const x=packSortKey(a?.code),y=packSortKey(b?.code);
  for(let i=0;i<x.length;i++){if(x[i]!==y[i])return typeof x[i]==="number"?x[i]-y[i]:String(x[i]).localeCompare(String(y[i]),"es")}
  return String(a?.code||"").localeCompare(String(b?.code||""),"es", {numeric:true});
}
function setName(code){return state.packs.find(p=>p.code===code)?.name||code}
function packLabel(p){
  const code=String(p?.code||"");
  // Presentation only; don't alter stored expansion and printing identifiers.
  if(/^OP-?14(?:-EB-?04)?$/i.test(code))return "OP-14";
  if(/^OP-?15(?:-EB-?04)?$/i.test(code))return "OP-15";
  return code;
}
function expansionFamilyKey(code){
  const s=setCodeKey(code);
  if(s==="OP14"||s==="OP-14"||s==="OP14-EB04")return "OP14";
  if(s==="OP15"||s==="OP-15"||s==="OP15-EB04")return "OP15";
  // These upstream buckets are promotional product printings, not separate
  // logical expansions. Group them in the Promos view while preserving the
  // exact source_set on every card for identity/import/pricing.
  if(["PROMOTIONCARD","PROMOTION-CARD","LIMITEDPRODUCTCARD","LIMITED-PRODUCT-CARD","OTHERPRODUCTCARD","OTHER-PRODUCT-CARD"].includes(s))return "PROMOTIONCARD";
  return s;
}
function sameExpansion(a,b){return expansionFamilyKey(a)===expansionFamilyKey(b)}
function cardExpansionCode(c){return String(c?.source_set||c?.set||"").trim()}
function cardPrintLabel(c){
  const code=cardExpansionCode(c)||String(c?.set||"").trim();
  const name=String(c?.set_name||"").trim();
  if(name&&norm(name)!==norm(setName(code)))return (code?code+" · ":"")+name;
  return code||name||"—";
}
function cardsForExpansion(code){
  const family=expansionFamilyKey(code);
  return state.cards.filter(c=>expansionFamilyKey(cardExpansionCode(c)||c?.set)===family);
}
function expansionType(code){
  const s=String(code||"").toUpperCase();
  if(/^OP-?[0-9]+(?:-EB-?04)?$/i.test(s))return "OP";
  if(/^EB-?[0-9]+$/i.test(s))return "EB";
  if(/^ST-?[0-9]+$/i.test(s))return "ST";
  if(/^PRB-?[0-9]+$/i.test(s))return "PRB";
  if(/^P(ROMO)?[-_]/i.test(s)||/PROMOTION/i.test(s)||/LIMITED.?PRODUCT.?CARD|OTHER.?PRODUCT.?CARD/i.test(s))return "PROMO";
  return "OTROS";
}
function expansionList(){
  const f=state.expansions;
  const canonicalPromoPack=state.packs.find(p=>setCodeKey(p?.code)==="PROMOTIONCARD")
    ||state.packs.find(p=>expansionFamilyKey(p?.code)==="PROMOTIONCARD");
  const visiblePacks=state.packs.filter(p=>expansionFamilyKey(p?.code)!=="PROMOTIONCARD"||p===canonicalPromoPack);
  let list=visiblePacks.map(p=>{
    const cards=cardsForExpansion(p.code);
    // The expansion overview must use the same logical-card grouping as the
    // album view. Parallel/reprint versions are one card, not extra cards to
    // complete the expansion.
    const groups=new Map();
    for(const c of cards){
      const k=groupKey(c);
      if(!groups.has(k))groups.set(k,{card:c});
    }
    const logical=[...groups.values()];
    const owned=logical.filter(g=>logicalQty(g.card)>0);
    const value=cards.filter(c=>qty(c.id)>0).reduce((sum,c)=>sum+qty(c.id)*(priceOf(c)??0),0);
    return {
      ...p,
      total:logical.length,
      owned:owned.length,
      pct:logical.length?owned.length/logical.length*100:0,
      playsets:logical.filter(g=>logicalQty(g.card)>=playsetTarget(g.card)).length,
      value
    };
  });
  const q=norm(f.query);
  if(q)list=list.filter(p=>norm([packLabel(p),p.name,p.code].join(" ")).includes(q));
  if(f.type&&f.type!=="Todos")list=list.filter(p=>expansionType(p.code)===f.type);
  const dir=f.dir==="desc"?-1:1;
  list.sort((a,b)=>{
    let d=0;
    if(f.sort==="name")d=String(a.name||"").localeCompare(String(b.name||""),"es",{numeric:true,sensitivity:"base"});
    else if(f.sort==="type")d=String(expansionType(a.code)).localeCompare(String(expansionType(b.code)),"es",{numeric:true});
    else {
      const x=packSortKey(a.code),y=packSortKey(b.code);
      for(let k=0;k<x.length&&!d;k++)d=String(x[k]).localeCompare(String(y[k]),"es",{numeric:true});
    }
    return d*dir||String(packLabel(a)).localeCompare(String(packLabel(b)),"es",{numeric:true});
  });
  return list;
}
function ensureOwnedCardsInCatalog(){
  if(!state.cards?.length)return;
  const byId=new Map(state.cards.map(c=>[c.id,c]));
  let changed=false;
  for(const [ownedId,ownedQty] of Object.entries(state.owned||{})){
    if(Number(ownedQty)<=0||byId.has(ownedId))continue;
    const saved=state.importedCards?.[ownedId];
    if(saved?.id){byId.set(ownedId,{...saved,id:ownedId,syntheticImport:true});changed=true;continue}
    const logical=baseId(ownedId);
    const base=state.cards.find(x=>!x.syntheticImport&&norm(baseId(x.id))===norm(logical));
    const kind=/_r\d+$/i.test(ownedId)?"reprint":/_(?:p|c)\d+$/i.test(ownedId)?"parallel":"base";
    if(base)byId.set(ownedId,{...base,id:ownedId,syntheticImport:true,importVariantId:ownedId,importVariantKind:kind,importResolvedCardId:base.id});
    else{
      const setCode=String(logical).split("-")[0]||"";
      byId.set(ownedId,{id:ownedId,number:logical,name:logical,set:setCode,set_name:setCode,rarity:"",category:"Character",colors:[],attributes:[],types:[],effect:"",trigger:null,image:"",syntheticImport:true,importVariantId:ownedId,importVariantKind:kind});
    }
    changed=true;
  }
  if(!changed)return;
  state.cards=[...byId.values()];
  const map=new Map();
  for(const cc of state.cards){
    cc.search=norm([cc.id,cc.name,cc.set,cc.set_name,cc.category,cc.rarity,...(cc.colors||[]),...(cc.types||[]),...(cc.attributes||[]),cc.effect,cc.trigger].join(" "));
    const k=groupKey(cc);
    if(!map.has(k))map.set(k,{key:k,card:cc,ids:[],sets:new Set()});
    const g=map.get(k);g.ids.push(cc.id);g.sets.add(cardExpansionCode(cc));
  }
  state.groups=[...map.values()].map(g=>({...g,sets:[...g.sets].sort(),versions:g.ids.map(id=>card(id))}));
  state.groupByKey=map;
}
function prepareCatalog(raw,packs){
  state.packs=(Array.isArray(packs)?packs:Object.values(packs)).filter(p=>String(p?.code||"").toUpperCase()!=="FAMILYDECKSET"&&norm(p?.name)!=="family deck set").slice().sort(comparePacks);
  const catalogCards=(Array.isArray(raw)?raw:Object.values(raw)).map(c=>({...c,id:String(c.id||"").trim(),set:String(c.set||"").trim(),set_name:c.set_name||setName(c.set||"")})).filter(c=>c.id&&!isJapaneseCatalogCard(c));
  const byId=new Map(catalogCards.map(c=>[c.id,c]));
  for(const imported of Object.values(state.importedCards||{})){
    if(!imported?.id||byId.has(imported.id))continue;
    byId.set(imported.id,{...imported,syntheticImport:true});
  }
  for(const [ownedId,ownedQty] of Object.entries(state.owned||{})){
    if(Number(ownedQty)<=0||byId.has(ownedId))continue;
    const saved=state.importedCards?.[ownedId];
    if(saved?.id){byId.set(ownedId,{...saved,id:ownedId,syntheticImport:true});continue}
    const logical=baseId(ownedId);
    const base=catalogCards.find(x=>norm(baseId(x.id))===norm(logical));
    const kind=/_r\d+$/i.test(ownedId)?"reprint":/_(?:p|c)\d+$/i.test(ownedId)?"parallel":"base";
    if(base){
      byId.set(ownedId,{...base,id:ownedId,syntheticImport:true,importVariantId:ownedId,importVariantKind:kind,importResolvedCardId:base.id});
    }else{
      const setCode=String(logical).split("-")[0]||"";
      byId.set(ownedId,{id:ownedId,number:logical,name:logical,set:setCode,set_name:setCode,rarity:"",category:"Character",colors:[],attributes:[],types:[],effect:"",trigger:null,image:"",syntheticImport:true,importVariantId:ownedId,importVariantKind:kind});
    }
  }
  state.cards=[...byId.values()];
  const map=new Map();
  for(const c of state.cards){c.search=norm([c.id,c.name,c.set,c.set_name,c.category,c.rarity,...(c.colors||[]),...(c.types||[]),...(c.attributes||[]),c.effect,c.trigger].join(" "));const k=groupKey(c);if(!map.has(k))map.set(k,{key:k,card:c,ids:[],sets:new Set()});const g=map.get(k);g.ids.push(c.id);g.sets.add(cardExpansionCode(c))}
  state.groups=[...map.values()].map(g=>({...g,sets:[...g.sets].sort(),versions:g.ids.map(id=>card(id))}));
  state.groupByKey=map;
  augmentCatalogWithMarketPrints();
  if(!state.album.set)state.album.set="";
}
let supabaseConfigPromise=null;
async function loadSupabaseConfig(){
  if(SUPABASE_URL&&SUPABASE_KEY)return {supabaseUrl:SUPABASE_URL,supabaseKey:SUPABASE_KEY};
  if(supabaseConfigPromise)return supabaseConfigPromise;
  supabaseConfigPromise=fetch("/api/config",{cache:"no-store"}).then(async r=>{
    if(!r.ok)throw Error("No se pudo cargar la configuración de cuenta");
    const cfg=await r.json();
    if(!cfg?.supabaseUrl||!cfg?.supabaseKey)throw Error("Configuración de cuenta incompleta");
    SUPABASE_URL=cfg.supabaseUrl;SUPABASE_KEY=cfg.supabaseKey;return cfg;
  }).catch(e=>{supabaseConfigPromise=null;throw e});
  return supabaseConfigPromise;
}
async function fetchJson(url,timeout=15000){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),timeout);
  try{const r=await fetch(url,{cache:"no-store",signal:ac.signal});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}
}

function collectionStats(){
  const distinct=Object.values(state.owned).filter(q=>Number(q)>0).length;
  const copies=Object.values(state.owned).reduce((a,b)=>a+Number(b||0),0);
  const playsets=state.cards.filter(c=>qty(c.id)>=playsetTarget(c)).length;
  const incomplete=state.cards.filter(c=>qty(c.id)>0&&qty(c.id)<playsetTarget(c)).length;
  const distinctTotal=state.cards.length;
  const completePct=distinctTotal?distinct/distinctTotal*100:0;
  let value=0,mostExpensive=null;
  for(const c of state.cards){
    const q=qty(c.id);
    if(q<=0)continue;
    const unit=collectionPriceOf(c);
    if(unit!==null&&Number.isFinite(unit)&&unit>=0){
      value+=q*unit;
      if(!mostExpensive||unit>mostExpensive.unit)
        mostExpensive={card:c,unit,quantity:q};
    }
  }
  return {distinct,copies,playsets,incomplete,distinctTotal,completePct,value,mostExpensive};
}

function setCodesEqual(a,b){return setCodeKey(a)===setCodeKey(b)}
function searchMatchesCard(c,q){
  const query=norm(q);
  if(!query)return true;
  const id=norm(c.id),base=norm(baseId(c.id)),set=norm(c.set),setName=norm(c.set_name);
  const looksLikeId=/^(?:op|st|eb|prb|p|ex|don)[-_]?\d+/i.test(query)||/\d{2,3}[-_]\d{3}/.test(query);
  if(looksLikeId)return id.includes(query)||base.includes(query)||set.includes(query);
  const setMatch=setName===query||set===query;
  return norm(c.name).includes(query)||norm(base).includes(query)||setMatch;
}
function filterValueMatches(value,selected){
  const target=norm(selected);
  if(!target||target==="todos"||target==="todas")return true;
  const values=Array.isArray(value)?value:[value];
  return values.some(v=>norm(v)===target);
}
function numericCardValue(value){
  if(value===null||value===undefined||value==="")return null;
  const normalized=String(value).trim().replace(",",".");
  const match=normalized.match(/-?\d+(?:\.\d+)?/);
  if(!match)return null;
  const n=Number(match[0]);
  return Number.isFinite(n)?n:null;
}
// Al editar cantidades se conservan las posiciones si la vista está ordenada por
// "Cantidad que tengo". Otros criterios y cambios explícitos de filtros se ordenan normalmente.
const quantityOrderSnapshots={catalog:null,collection:null};
function preserveQuantitySort(mode,items,getId){
  if(state[mode]?.sort!=="quantity"){
    if(Object.hasOwn(quantityOrderSnapshots,mode))quantityOrderSnapshots[mode]=null;
    return items;
  }
  const f=state[mode];
  const criteria=Object.fromEntries(Object.entries(f).filter(([key])=>key!=="page"&&key!=="filtersOpen"));
  const signature=JSON.stringify([state.user?.id||"",state.cards.length,criteria]);
  const previous=quantityOrderSnapshots[mode];
  if(!previous||previous.signature!==signature){
    quantityOrderSnapshots[mode]={signature,ids:items.map(getId)};
    return items;
  }
  const index=new Map(previous.ids.map((id,i)=>[id,i]));
  // Los elementos nuevos se añaden después sin desplazar los existentes.
  items.sort((a,b)=>{
    const ia=index.get(getId(a)),ib=index.get(getId(b));
    return ia===undefined?(ib===undefined?0:1):ib===undefined?-1:ia-ib;
  });
  quantityOrderSnapshots[mode]={signature,ids:items.map(getId)};
  return items;
}
function filteredCards(mode){
  const f=state[mode];
  let list=mode==="collection"
    ?state.cards.filter(c=>qty(c.id)>0)
    :mode==="album"&&f.set?cardsForExpansion(f.set):state.cards;
  const q=norm(f.query||(mode==="catalog"?state.query:""));
  if(q){
    // Search/filter by logical card: _p1/_r1/_c1 variants are the same card.
    // First find the matching logical groups across the full catalog, then keep
    // all versions that survive the active expansion/other filters.
    const searchGroups=new Set(state.cards.filter(c=>searchMatchesCard(c,q)).map(groupKey));
    list=list.filter(c=>searchGroups.has(groupKey(c)));
  }
  if(mode==="catalog"&&f.set&&f.set!=="Todas")list=list.filter(c=>sameExpansion(cardExpansionCode(c),f.set));
  if(f.category&&f.category!=="Todos")list=list.filter(c=>filterValueMatches(c.category,f.category));
  if(f.color&&f.color!=="Todos")list=list.filter(c=>filterValueMatches(c.colors,f.color));
  if(f.rarity&&f.rarity!=="Todos")list=list.filter(c=>filterValueMatches(c.rarity,f.rarity));
  if(f.type&&f.type!=="Todos")list=list.filter(c=>filterValueMatches(c.types,f.type));
  if(f.attribute&&f.attribute!=="Todos")list=list.filter(c=>filterValueMatches(c.attributes,f.attribute));
  if(mode==="catalog"){
    if(f.minCost!=="")list=list.filter(c=>Number(c.cost??-1)>=Number(f.minCost));
    if(f.maxCost!=="")list=list.filter(c=>Number(c.cost??9999)<=Number(f.maxCost));
    if(f.minPower!=="")list=list.filter(c=>Number(c.power??-1)>=Number(f.minPower));
    if(f.maxPower!=="")list=list.filter(c=>Number(c.power??9999)<=Number(f.maxPower));
    if(f.minPrice!=="")list=list.filter(c=>{const p=priceOf(c);return p!==null&&p>=Number(f.minPrice)});
    if(f.maxPrice!=="")list=list.filter(c=>{const p=priceOf(c);return p!==null&&p<=Number(f.maxPrice)});
    if(f.ownership==="Tengo")list=list.filter(c=>qty(c.id)>0);
    if(f.ownership==="Me faltan")list=list.filter(c=>qty(c.id)<playsetTarget(c));
  }
  if(mode==="collection"){
    if(f.set&&f.set!=="Todas")list=list.filter(c=>sameExpansion(cardExpansionCode(c),f.set));
    if(f.quantity==="1")list=list.filter(c=>qty(c.id)===1);
    if(f.quantity==="2")list=list.filter(c=>qty(c.id)===2);
    if(f.quantity==="3")list=list.filter(c=>qty(c.id)===3);
    if(f.quantity==="4+")list=list.filter(c=>qty(c.id)>=playsetTarget(c));
    if(f.playset==="Completo")list=list.filter(c=>qty(c.id)>=playsetTarget(c));
    if(f.playset==="Incompleto")list=list.filter(c=>qty(c.id)>0&&qty(c.id)<playsetTarget(c));
  }
  if(mode==="album"){
    if(f.ownership==="Tengo")list=list.filter(c=>logicalQty(c)>0);
    if(f.ownership==="No tengo")list=list.filter(c=>logicalQty(c)===0);
    if(f.ownership==="Me faltan")list=list.filter(c=>logicalQty(c)>0&&logicalQty(c)<playsetTarget(c));
  }
  const dir=f.dir==="desc"?-1:1;
  const cmp=(av,bv)=>{
    const am=av===null||av===undefined||Number.isNaN(av),bm=bv===null||bv===undefined||Number.isNaN(bv);
    if(am||bm){if(am&&bm)return 0;return am?1:-1}
    if(typeof av==="number"&&typeof bv==="number")return av-bv;
    return String(av??"").localeCompare(String(bv??""),"es",{numeric:true,sensitivity:"base"});
  };
  list.sort((a,b)=>{
    if(f.sort==="set"){
      const av=packSortKey(cardExpansionCode(a)),bv=packSortKey(cardExpansionCode(b));
      for(let i=0;i<av.length;i++){const d=cmp(av[i],bv[i]);if(d)return d*dir}
      return String(a.id).localeCompare(String(b.id),"es",{numeric:true})*dir;
    }
    let av,bv;
    switch(f.sort){case"name":av=norm(a.name);bv=norm(b.name);break;case"rarity":av=norm(a.rarity);bv=norm(b.rarity);break;case"quantity":av=qty(a.id);bv=qty(b.id);break;case"price":av=priceOf(a);bv=priceOf(b);break;case"power":av=numericCardValue(a.power);bv=numericCardValue(b.power);break;case"cost":av=numericCardValue(a.cost);bv=numericCardValue(b.cost);break;default:av=a.id;bv=b.id}
    const d=cmp(av,bv);
    return d?d*dir:String(a.id).localeCompare(String(b.id),"es",{numeric:true})*dir;
  });
  return mode==="collection"?preserveQuantitySort("collection",list,c=>c.id):list;
}
function groupCardList(arr){
  state.catalog.grouped=true;
  if(!state.catalog.grouped)return arr.map(c=>({key:c.id,card:c,versions:[c],sets:[c.set]}));
  const by=new Map();
  for(const c of arr){
    const k=groupKey(c);
    if(!by.has(k))by.set(k,{key:k,card:c,versions:[],sets:[]});
    const g=by.get(k);
    g.versions.push(c);
    if(!g.sets.includes(c.set))g.sets.push(c.set);
  }
  return [...by.values()];
}
function groupPriceStats(g){
  const prices=g.versions.map(priceOf).filter(v=>typeof v==="number"&&Number.isFinite(v)&&v>0);
  if(!prices.length)return {min:null,max:null,sort:null};
  const min=Math.min(...prices),max=Math.max(...prices);
  return {min,max,sort:min};
}
function groupFiltered(){
  const groups=groupCardList(filteredCards("catalog"));
  const dir=state.catalog.dir==="desc"?-1:1;
  const groupNumber=(g,key)=>{
    const values=g.versions.map(c=>numericCardValue(c?.[key])).filter(v=>v!==null);
    return values.length?Math.min(...values):null;
  };
  const compareNullable=(av,bv)=>{
    const am=av===null||av===undefined||Number.isNaN(av),bm=bv===null||bv===undefined||Number.isNaN(bv);
    if(am||bm){if(am&&bm)return 0;return am?1:-1}
    if(typeof av==="number"&&typeof bv==="number")return (av-bv)*dir;
    return String(av).localeCompare(String(bv),"es",{numeric:true,sensitivity:"base"})*dir;
  };
  const groupValue=g=>{
    switch(state.catalog.sort){
      case"name":return norm(g.card?.name);
      case"rarity":return norm(g.card?.rarity);
      case"quantity":return logicalQty(g.card);
      case"price":return priceOf(catalogCoverCard(g));
      case"cost":return groupNumber(g,"cost");
      case"power":return groupNumber(g,"power");
      case"set":return packSortKey(g.card?.set);
      default:return g.card?.id;
    }
  };
  groups.sort((a,b)=>{
    const av=groupValue(a),bv=groupValue(b);
    if(state.catalog.sort==="set"){
      for(let i=0;i<Math.max(av.length,bv.length);i++){
        const d=compareNullable(av[i],bv[i]);
        if(d)return d;
      }
    }else{
      const d=compareNullable(av,bv);
      if(d)return d;
    }
    return String(a.card?.id||"").localeCompare(String(b.card?.id||""),"es",{numeric:true})*dir;
  });
  return preserveQuantitySort("catalog",groups,g=>g.key);
}
function cmpPrice(a,b){
  const am=a===null||a===undefined,bm=b===null||b===undefined;
  if(am||bm){if(am&&bm)return 0;return am?1:-1}
  const d=Number(a)-Number(b);
  return d*(state.catalog.dir==="desc"?-1:1);
}
let priceDatasetPromise=null;
const PRICE_CACHE_VERSION=18;
const MARKET_DATA_URL="/data/cardmarket-prices.json";
function priceOf(c){
  const key=c?.id;
  const meta=directMarketMeta(c);
  const candidates=[
    state.prices?.[key],
    state.prices?.[norm(key)],
    meta.eur,
    meta.trend,
    meta.avg,
    meta.avg5,
    meta.low
  ];
  for(const raw of candidates){
    const n=Number(raw);
    if(Number.isFinite(n)&&n>0)return n;
  }

  // Never borrow a price from another printing and never use CSV unit_price
  // as the current market price. If the exact print cannot be priced, show —.
  return null;
}
function selectPrimaryMarketEntry(id,entry){
  // The data generator is authoritative for the exact print. Do not remap
  // price/link/expansion from the informational collections list here.
  return entry;
}

function mergePriceDataset(d){
  marketDatasetCards=d?.cards||{};
  state.prices={};state.collectionPrices={};state.marketMeta={};state.priceDate=d?.updatedAt||null;
  for(const [id,rawEntry] of Object.entries(d?.cards||{})){
    const entry=selectPrimaryMarketEntry(id,rawEntry);
    const n=Number(entry?.eur);
    if(Number.isFinite(n)&&n>0){state.prices[id]=n;state.prices[norm(id)]=n;}
    const meta={
      url:String(entry?.url||""),
      cardmarketId:entry?.cardmarketId||null,
      version:Number(entry?.version||1),
      printSet:String(entry?.printSet||""),
      expansion:String(entry?.expansion||""),
      variantKind:String(entry?.variantKind||""),
      stalePrice:!!entry?.stalePrice,
      launchPrice:Number.isFinite(Number(entry?.launchPrice))?Number(entry.launchPrice):null,
      launchPriceDate:entry?.launchPriceDate||null,
      trend:Number.isFinite(Number(entry?.trend))?Number(entry.trend):null,
      avg:Number.isFinite(Number(entry?.avg))?Number(entry.avg):null,
      avg5:Number.isFinite(Number(entry?.avg5))?Number(entry.avg5):null,
      low:Number.isFinite(Number(entry?.low))?Number(entry.low):null,
      collections:Array.isArray(entry?.collections)?entry.collections.map(collection=>({
        expansion:String(collection?.expansion||"").trim(),
        expansionId:Number.isFinite(Number(collection?.expansionId))?Number(collection?.expansionId):null,
        setCode:String(collection?.setCode||""),
        cardmarketId:Number.isFinite(Number(collection?.cardmarketId))?Number(collection?.cardmarketId):null,
        version:Number.isFinite(Number(collection?.version))?Number(collection?.version):1,
        eur:Number.isFinite(Number(collection?.eur))?Number(collection?.eur):null,
        url:String(collection?.url||"")
      })).filter(collection=>collection.expansion||collection.cardmarketId):[]
    };
    state.marketMeta[id]=meta;state.marketMeta[norm(id)]=meta;
  }
  augmentCatalogWithMarketPrints();
}
async function loadMarketPrices({refresh=false}={}){
  if(!refresh&&priceDatasetPromise)return priceDatasetPromise;
  priceDatasetPromise=(async()=>{
    try{
      const d=await fetchJson(MARKET_DATA_URL,30000);
      if(!d?.cards||d?.schemaVersion===undefined)throw Error("Invalid Cardmarket dataset");
      mergePriceDataset(d);
      // QuotaExceededError must never make a successfully downloaded price feed fail.
      try{localStorage.setItem("mialbumonepiece_prices",JSON.stringify({version:PRICE_CACHE_VERSION,prices:state.prices,meta:state.marketMeta,updatedAt:state.priceDate}))}
      catch(storageError){console.warn("Caché local de precios llena",storageError)}
      return d;
    }catch(error){
      try{
        const cached=JSON.parse(localStorage.getItem("mialbumonepiece_prices")||"null");
        if(cached?.version===PRICE_CACHE_VERSION&&cached?.prices){
          state.prices=cached.prices||{};state.collectionPrices=cached.prices||{};state.marketMeta=cached.meta||{};state.priceDate=cached.updatedAt||null;return cached;
        }
      }catch{}
      throw error;
    }
  })().catch(error=>{priceDatasetPromise=null;throw error});
  return priceDatasetPromise;
}
async function fillMissingExactPrices(cards=state.cards){
  const ids=[...new Set((cards||[]).map(c=>String(typeof c==="string"?c:c?.id||"").trim()).filter(Boolean))]
    .filter(id=>![state.prices?.[id],state.prices?.[norm(id)]].some(value=>Number.isFinite(Number(value))&&Number(value)>0));
  for(let i=0;i<ids.length;i+=500){
    const batch=ids.slice(i,i+500);
    try{
      const r=await fetch("/api/cardmarket?ids="+encodeURIComponent(batch.join(",")),{cache:"no-store"});
      if(!r.ok)continue;
      const d=await r.json();
      for(const [id,raw] of Object.entries(d?.prices||{})){
        const n=Number(raw);
        if(Number.isFinite(n)&&n>0){
          state.prices[id]=n;
          state.prices[norm(id)]=n;
        }
      }
    }catch(e){console.warn("exact price fallback",e)}
  }
}
async function ensurePrices(cards=state.cards){
  await loadMarketPrices();
  await fillMissingExactPrices(cards);
}
function loadCachedPrices(){
  try{
    const d=JSON.parse(localStorage.getItem("mialbumonepiece_prices")||"null");
    if(d?.version===PRICE_CACHE_VERSION&&d?.prices){
      state.prices=d.prices||{};state.collectionPrices=d.prices||{};state.marketMeta=d.meta||{};state.priceDate=d.updatedAt||null;
    }else localStorage.removeItem("mialbumonepiece_prices");

// The catalog cover is the cheapest standard printing from the original
// expansion, not whichever parallel/reprint happens to occur first.
// This changes presentation only; prices and quantities remain per exact ID.
function catalogCoverCard(g){
  const versions=(g?.versions||[]).filter(Boolean);
  if(!versions.length)return g?.card||null;
  const standard=versions.filter(c=>!c.isParallel&&
    !/_(?:p|c)\d+$/i.test(String(c.id||""))&&
    variantKindOf(c)!=="parallel");
  const original=standard.filter(c=>{
    const root=baseId(c.id).match(/^(OP|ST|EB|PRB)\d{2}/i)?.[0];
    return root&&normalizePrintSet(cardExpansionCode(c))===normalizePrintSet(root);
  });
  const candidates=original.length?original:standard.length?standard:versions;
  const basePrints=candidates.filter(c=>variantKindOf(c)==="base");
  const pool=basePrints.length?basePrints:candidates;
  return pool.slice().sort((a,b)=>{
    const ap=priceOf(a),bp=priceOf(b);
    if(ap!==null&&bp!==null&&ap!==bp)return ap-bp;
    if(ap===null&&bp!==null)return 1;
    if(ap!==null&&bp===null)return -1;
    const aa=a.id===baseId(a.id)?0:1,bb=b.id===baseId(b.id)?0:1;
    return aa-bb||String(a.id).localeCompare(String(b.id),"es",{numeric:true});
  })[0];
}
// An expansion cover uses only printings from the selected expansion:
// standard versions first, then the cheapest one with an exact price.
function albumCoverCard(g){
  const versions=(g?.versions||[]).filter(c=>sameExpansion(cardExpansionCode(c),state.album.set));
  if(!versions.length)return g?.card||null;
  const standard=versions.filter(c=>!c.isParallel&&
    !/_(?:p|c)\d+$/i.test(String(c.id||""))&&
    !/parallel|alternate|alt.?art|special|manga/i.test(variantKindOf(c)));
  const candidates=standard.length?standard:versions;
  return candidates.slice().sort((a,b)=>{
    const ap=priceOf(a),bp=priceOf(b);
    if(ap!==null&&bp!==null&&ap!==bp)return ap-bp;
    if(ap===null&&bp!==null)return 1;
    if(ap!==null&&bp===null)return -1;
    const aa=a.id===baseId(a.id)?0:1,bb=b.id===baseId(b.id)?0:1;
    return aa-bb||String(a.id).localeCompare(String(b.id),"es",{numeric:true});
  })[0];
}

// Match playability by printed card number, not by the print suffix.
function deckPrintedCode(input){
 const raw=typeof input==="string"?input:input?.id;
 const id=String(raw||"").trim().toUpperCase();
 const match=id.match(/^((?:OP|ST|EB|PRB)\d{2}-\d{3}|P-\d{3}|DON-?\d{3})(?=$|[_-])/);
 return match?match[1]:baseId(id).toUpperCase();
}
function deckOwnedCopies(c){
  if(!state.user||!state.collectionReady)return 0;
  const code=deckPrintedCode(c);
  return Object.entries(state.owned).reduce((total,[id,n])=>
    total+(deckPrintedCode(id)===code?Math.max(0,Number(n)||0):0),0);
}
// When adapting an external decklist, prefer the exact owned printings
// from Supabase. Never add or change collection quantities here.
function ownedDeckPrintings(c){
  if(!c||!state.user||!state.collectionReady)return [];
  const code=deckPrintedCode(c);
  return Object.keys(state.owned).filter(id=>qty(id)>0&&deckPrintedCode(id)===code)
    .map(id=>card(id)).filter(Boolean)
    .sort((a,b)=>qty(b.id)-qty(a.id)||(a.id===c.id?-1:b.id===c.id?1:String(a.id).localeCompare(String(b.id),"es",{numeric:true})));
}
function preferredOwnedDeckPrinting(c){
  if(!c)return null;
  return qty(c.id)>0?c:ownedDeckPrintings(c)[0]||c;
}
// The game treats all printings of one card number as interchangeable.
// Spend available copies once across deck rows; never modify the collection.
function deckAvailableByPrinting(d){
  const allocated={},used=new Map();
  // Attribute copies to an exact owned printing first. Any remaining
  // printing can use the rest of the shared playset, without double counting.
  for(const [id,raw] of Object.entries(d?.cards||{}).sort(([a],[b])=>
    qty(b)-qty(a)||String(a).localeCompare(String(b),"es",{numeric:true}))){
    const need=Math.max(0,Number(raw)||0),code=deckPrintedCode(id);
    const available=Math.max(0,deckOwnedCopies(code)-(used.get(code)||0));
    const have=Math.min(need,available);
    allocated[id]=have;
    used.set(code,(used.get(code)||0)+have);
  }
  return allocated;
}
function competitiveDeckPreviewCards(result){
  const cards={},groupCounts=new Map();
  let unresolved=0;
  for(const [id,qRaw] of Object.entries(result?.cards||{})){
    const requested=Math.max(0,Math.floor(Number(qRaw)||0));
    if(!requested)continue;
    const cc=resolveDeckImportCard(id);
    if(!cc||cc.category==="Leader"){unresolved+=requested;continue}
    const group=deckPrintedCode(cc),limit=deckCopyLimit(cc);
    const allowed=Math.max(0,Math.min(requested,limit-(groupCounts.get(group)||0)));
    groupCounts.set(group,(groupCounts.get(group)||0)+allowed);
    if(!allowed)continue;
    let remaining=allowed;
    for(const ownedCard of ownedDeckPrintings(cc)){
      const count=Math.min(remaining,Math.max(0,qty(ownedCard.id)-(cards[ownedCard.id]||0)));
      if(count){cards[ownedCard.id]=(cards[ownedCard.id]||0)+count;remaining-=count}
      if(!remaining)break;
    }
    // Keep any unowned remainder under the original external card ID.
    // This makes only genuinely missing copies appear in grey.
    if(remaining)cards[cc.id]=(cards[cc.id]||0)+remaining;
  }
  return {cards,unresolved};
}
function competitiveDeckOwnedStats(result){
  let owned=0,missing=0,cost=0,total=1;
  const leader=resolveDeckImportCard(result?.leaderId);
  if(leader){
    const got=Math.min(1,deckOwnedCopies(leader));owned+=got;missing+=1-got;
    if(!got)cost+=Number(priceOf(leader)||0);
  }else missing++;
  const allocation=deckAvailableByPrinting(result);
  for(const [id,qRaw] of Object.entries(result?.cards||{})){
    const need=Math.max(0,Number(qRaw)||0),cc=resolveDeckImportCard(id);
    const got=Math.min(need,Number(allocation[id]||0));
    total+=need;owned+=got;missing+=need-got;
    if(cc&&need>got)cost+=(need-got)*Number(priceOf(cc)||0);
  }
  return {owned,missing,cost,total};
}

// A playable card appears once in the deck even if several exact printings
// are listed. Keep saved deck print IDs untouched: this groups presentation only.
function deckCompositionGroups(d){
  const groups=new Map();
  for(const [id,raw] of Object.entries(d?.cards||{})){
    const count=Number(raw)||0;
    if(count<=0)continue;
    const code=deckPrintedCode(id);
    if(!groups.has(code))groups.set(code,{code,count:0,entries:[]});
    const g=groups.get(code);
    g.count+=count;g.entries.push({id,count});
  }
  const criterion=state.deckCompositionSort||"id",direction=state.deckCompositionDir==="desc"?-1:1;
  const source=g=>g.entries.map(e=>card(e.id)).find(Boolean);
  const attribute=g=>{
    const c=source(g);
    if(criterion==="id")return g.code;
    if(criterion==="category")return c?.category||"";
    if(criterion==="cost")return numericCardValue(c?.cost);
    if(criterion==="power")return numericCardValue(c?.power);
    if(criterion==="name")return c?.name||g.code;
    if(criterion==="quantity")return g.count;
    if(criterion==="price")return c?priceOf(c):null;
    return g.code;
  };
  return [...groups.values()].sort((a,b)=>{
    const x=attribute(a),y=attribute(b),missingX=x===null||x===undefined||x==="",missingY=y===null||y===undefined||y==="";
    if(missingX||missingY){if(missingX!==missingY)return missingX?1:-1}
    else {
      const delta=(typeof x==="number"&&typeof y==="number")?x-y:String(x).localeCompare(String(y),"es",{numeric:true,sensitivity:"base"});
      if(delta)return delta*direction;
    }
    return a.code.localeCompare(b.code,"es",{numeric:true});
  });
}
function deckRows(d){
  const r=[];
  if(d.leader){
    const l=card(d.leader);
    if(l){
      const display=preferredOwnedDeckPrinting(l),lp=priceOf(l),have=Math.min(1,deckOwnedCopies(l)),missing=have<1;
      r.push('<article class="card deck-owned-card '+(missing?"deckcard-missing":"")+'"><span class="tag">Líder</span><button class="linkbtn" data-detail="'+esc(display.id)+'" style="display:block;width:100%;padding:0">'+deckOwnedImg(display,have,1)+'</button><div class="cardbody"><div class="name">'+esc(l.name||l.id)+'</div><div class="small">'+esc(display.id)+' · '+esc(l.colors?.join("/")||"—")+'</div><div class="small deck-owned-status">'+(lp!==null?money(lp)+' · ':"")+(missing?"te falta 1":"en colección")+'</div>'+(state.user&&state.collectionReady&&qty(display.id)<99?'<button type="button" class="secondary btn" style="width:100%;margin:6px 0 3px;font-size:11px;padding:7px 3px" data-deck-collect="'+esc(display.id)+'">＋1 a colección</button>':'')+'<button class="danger btn" style="width:100%;margin-top:6px" data-removeleader>Quitar líder</button></div></article>');

    const amounts=g.entries.map(e=>{const c=card(e.id);return c?priceOf(c):null});
    const total=amounts.every(p=>p!==null)?g.entries.reduce((sum,e,i)=>sum+e.count*amounts[i],0):null;
    const info=total===null?"Precio —":money(total);
    const ownership=need?'Tienes '+have+'/'+n+' · faltan '+need:'Tienes '+have+'/'+n;

    r.push('<article class="card deck-owned-card '+(need?"deckcard-missing":"")+'"><span class="tag">×'+n+'</span><button class="linkbtn" data-detail="'+esc(display.id)+'" style="display:block;width:100%;padding:0">'+deckOwnedImg(display,have,n)+'</button><div class="cardbody"><div class="name">'+esc(source.name||source.id)+'</div><div class="small">'+esc(g.code)+' · '+esc(display.set||"—")+printInfo+'</div><div class="small deck-owned-status">'+info+'<br>'+ownership+'</div>'+(state.user&&state.collectionReady&&qty(display.id)<99?'<button type="button" class="secondary btn" style="width:100%;margin:6px 0 3px;font-size:11px;padding:7px 3px" data-deck-collect="'+esc(display.id)+'">＋1 a colección</button>':'')+'<div class="quick"><button class="secondary" data-deckqtygroup="'+esc(g.code)+'" data-d="-1">−</button><div class="qty">'+n+'</div><button class="primary" data-deckqtygroup="'+esc(g.code)+'" data-d="1">+</button></div></div></article>');
  }

}

// Cardmarket accepts: quantity + English card name + printed card number, one per line.
// Wants are for playable card identities, so owned parallel/reprint copies count.
function deckMissingCardmarketText(d){
  const wants=[];
  if(d?.leader&&deckOwnedCopies(d.leader)<1){
    const leader=card(d.leader);
    if(!leader||!String(leader.name||"").trim())throw Error("No se encuentra el nombre del líder");
    wants.push({c:leader,code:deckPrintedCode(d.leader),count:1});
  }
  for(const group of deckCompositionGroups(d)){
    const missing=Math.max(0,group.count-deckOwnedCopies(group.code));

function validateDeckBackup(raw){
  if(!raw||raw.format!==ALL_DECKS_BACKUP_FORMAT||raw.version!==1||!Array.isArray(raw.decks))
    throw Error("Archivo no compatible. Selecciona un JSON exportado desde «Todos los mazos».");
  if(raw.decks.length>500)throw Error("El archivo contiene demasiados mazos.");
  return raw.decks.map((d,i)=>{
    if(!d||typeof d!=="object"||Array.isArray(d))throw Error("Mazo "+(i+1)+" inválido.");
    const {name,description="",leader="",colors=[],cards={}}=d;
    if(typeof name!=="string"||!name.trim()||name.length>120||
      typeof description!=="string"||description.length>2000||
      typeof leader!=="string"||leader.length>128||
      !Array.isArray(colors)||colors.length>8||colors.some(c=>typeof c!=="string"||c.length>60)||
      !cards||typeof cards!=="object"||Array.isArray(cards))
      throw Error("Datos incorrectos en el mazo "+(i+1)+".");
    const rows=Object.entries(cards),copyCounts=Object.create(null);
    if(rows.length>50)throw Error("Demasiadas cartas distintas en el mazo "+(i+1)+".");
    let total=0;
    for(const [id,q] of rows){
      if(!id||id.length>128||["__proto__","prototype","constructor"].includes(id)||
        !Number.isSafeInteger(q)||q<=0||q>50)
        throw Error("Carta o cantidad incorrecta en el mazo "+(i+1)+".");
      copyCounts[id]=q;total+=q;
    }
    if(total>50)throw Error("El mazo "+(i+1)+" supera las 50 cartas.");
    return {name:name.trim(),description,leader,colors:colors.slice(),cards:copyCounts};
  });
}

function parseDeckListLine(line){

function deckCardAllowedByLeader(cc,leader){
  if(!cc||!leader||cc.category==="Leader")return false;
  const leaderColors=new Set((leader.colors||[]).map(norm).filter(Boolean));
  const cardColors=(cc.colors||[]).map(norm).filter(Boolean);
  return cardColors.length>0&&cardColors.every(color=>leaderColors.has(color));
}
function deckValidate(d){
  const total=Object.values(d.cards||{}).reduce((s,n)=>s+Number(n||0),0),messages=[],leader=card(d.leader);
  const banned=new Set(["OP06-047","OP03-040","OP06-086","ST10-001","OP06-116"]);
  const pairs=[["OP07-115","EB04-058"],["OP11-040","OP11-067"],["OP11-040","OP08-069"]];
  let illegal=0;if(!leader)messages.push("Líder no seleccionado");if(total!==50)messages.push(total+"/50 cartas no líder");
  const ids=Object.entries(d.cards||{}),baseCounts=new Map();
  for(const [id,n] of ids){
    const c=card(id),base=baseId(id),limit=deckCopyLimitForId(id);
    baseCounts.set(base,(baseCounts.get(base)||0)+Number(n||0));
    if(!c){illegal++;continue}
    if(c.category==="Leader"){illegal++;continue}
    if(Number(n)>limit){illegal++;messages.push(c.id+">"+limit+" copias")}
    if(banned.has(base)){illegal++;messages.push(base+" prohibida")}
    if(leader&&!deckCardAllowedByLeader(c,leader)){illegal++;messages.push(c.id+" color no compatible")}
  }
  for(const [base,count] of baseCounts){
    const limit=deckCopyLimitForId(base);
    if(count>limit){illegal++;messages.push(base+">"+limit+" copias totales entre versiones")}
  }
  for(const [a,b] of pairs){if(ids.some(([id,n])=>baseId(id)===a&&Number(n)>0)&&ids.some(([id,n])=>baseId(id)===b&&Number(n)>0)){illegal++;messages.push("pareja prohibida "+a+" + "+b)}}
  if(illegal)messages.push(illegal+" carta(s) ilegales");
  return {total,illegal,valid:!!leader&&total===50&&illegal===0,messages};
}

  const groupNum=(g,key)=>{const a=g.versions.map(c=>numericCardValue(c?.[key])).filter(v=>v!==null);return a.length?Math.min(...a):null};
  const value=g=>{switch(f.sort){case"name":return norm(g.card?.name);case"set":return packSortKey(g.card?.set);case"rarity":return norm(g.card?.rarity);case"cost":return groupNum(g,"cost");case"power":return groupNum(g,"power");case"price":return groupPriceStats(g).sort;case"quantity":return deckOwnedCopies(g.card);default:return g.card?.id}};
  const cmp=(a,b)=>{const am=a===null||a===undefined||Number.isNaN(a),bm=b===null||b===undefined||Number.isNaN(b);if(am||bm){if(am&&bm)return 0;return am?1:-1}if(Array.isArray(a)&&Array.isArray(b)){for(let i=0;i<Math.max(a.length,b.length);i++){const dd=cmp(a[i],b[i]);if(dd)return dd}return 0}if(typeof a==="number"&&typeof b==="number")return(a-b)*dir;return String(a).localeCompare(String(b),"es",{numeric:true,sensitivity:"base"})*dir};
  groups.sort((a,b)=>cmp(value(a),value(b))||String(a.card?.id||"").localeCompare(String(b.card?.id||""),"es",{numeric:true})*dir);
  const page=Math.max(1,state.deckPage),start=(page-1)*PAGE,vis=groups.slice(start,start+PAGE);
  const msg=choosingLeader?"Elige tu líder. Toca una carta para escoger su versión exacta.":"Añade cartas con +. Toca una carta para cambiar a otra versión exacta.";
  host.innerHTML='<div class="notice">'+msg+' · '+groups.length.toLocaleString("es-ES")+' resultados.</div><div class="grid deck-card-grid">'+vis.map(deckGroupedTile).join("")+'</div>'+pagination(groups.length,page,"deck");
  bindResultEvents(host);
  ensurePrices(vis.flatMap(g=>g.versions).map(cc=>cc.id)).catch(()=>{});
}

async function clearCollection(){
  if(!collectionRequireLogin())return;
  if(!confirm("¿Borrar TODA tu colección personal?\n\nSe eliminarán permanentemente todas las cartas de tu cuenta en Supabase. Esto no elimina el catálogo general ni tus mazos.\n\nEsta acción no se puede deshacer."))return;
  if(prompt("Para confirmar la eliminación definitiva, escribe BORRAR:")!=="BORRAR"){notify("Borrado cancelado");return}
  collectionBulkBusy=true;
  const userId=state.user.id;
  try{
    await Promise.all([...collectionWrites.values()]);
    if(state.user?.id!==userId)return;
    const deleted=await state.sb.rpc("collection_clear_atomic");
    if(deleted.error)throw deleted.error;
    const checked=await state.sb.from("collection_items").select("card_id").eq("user_id",userId).limit(1);
    if(checked.error)throw checked.error;
    if(checked.data?.length)throw Error("Todavía quedan cartas en Supabase");
    if(state.user?.id!==userId)return;
    state.owned={};
    state.collection.page=1;
    renderShell();
    notify("Colección eliminada de tu cuenta");
  }catch(e){
    console.warn("Error eliminando colección",e);
    notify("No se pudo completar el borrado. Recargando desde Supabase.");
    if(state.user?.id===userId)await loadCollectionFromCloud(userId);
    if(state.user?.id===userId)renderShell();
  }finally{collectionBulkBusy=false}
}
function setQty(id,n){return writeCollection(id,n)}
// An explicit CSV import may replace a signed-in user's collection, but never from
// browser cache. The server is read back after all writes; no optimistic local import.
async function replaceCollectionFromCSV(imported){
  if(!collectionRequireLogin())return false;
  const userId=state.user.id;
  collectionBulkBusy=true;
  const wanted=Object.fromEntries([...imported.entries()].filter(([,q])=>Number(q)>0)
    .map(([id,q])=>[id,Math.min(99,Math.round(Number(q)))]));
  try{
    await Promise.all([...collectionWrites.values()]);
    if(state.user?.id!==userId)throw Error("Has cambiado de cuenta durante la importación");
    // A single Supabase transaction validates all print IDs and replaces the whole collection.
    // A rejected RPC changes zero rows.
    const saved=await state.sb.rpc("collection_replace_atomic",{p_cards:wanted});
    if(saved.error)throw saved.error;
    if(state.user?.id!==userId)return false;
    if(!await loadCollectionFromCloud(userId))throw Error("Importación completada, pero no se pudo comprobar la colección");
    if(Object.keys(state.owned).length!==Object.keys(wanted).length||
      Object.entries(wanted).some(([id,q])=>qty(id)!==q))
      throw Error("La colección leída no coincide con el CSV. Revisa antes de reintentar.");
    return true;
  }catch(error){
    console.warn("Falló la importación transaccional",error);
    if(state.user?.id===userId){
      await loadCollectionFromCloud(userId);
      notify("No se completó la importación. Comprueba tu colección.");
    }
    return false;
  }finally{
    collectionBulkBusy=false;
    if(state.user?.id===userId)renderShell();
  }
}


function deckCardTotal(d){return Object.values(d?.cards||{}).reduce((s,n)=>s+Number(n||0),0)}
function addDeckCardToCollection(id){
  const d=state.decks.find(x=>x.id===state.deckId);
  if(!d)return;
  const code=deckPrintedCode(id);
  const shown=d.leader&&deckPrintedCode(d.leader)===code||
    Object.entries(d.cards||{}).some(([printId,n])=>Number(n)>0&&deckPrintedCode(printId)===code);
  if(!shown)return;
  if(!collectionRequireLogin())return;
  if(!card(id)||qty(id)>=99)return notify("No se pueden añadir más copias de esta impresión.");
  return changeQty(id,1);
}
function changeDeckGroupQty(code,delta){
  const d=state.decks.find(x=>x.id===state.deckId);if(!d)return;
  const entries=Object.entries(d.cards||{}).filter(([id,n])=>Number(n)>0&&deckPrintedCode(id)===code);
  if(!entries.length)return;
  // Removing first from an unowned printing keeps available copies visible;
  // adding first to an already-owned printing is intuitive.
  entries.sort(([a],[b])=>qty(a)-qty(b)||a.localeCompare(b,"es",{numeric:true}));
  const chosen=Number(delta)<0?entries[0][0]:entries[entries.length-1][0];
  changeDeckQty(chosen,delta);
}
function changeDeckQty(id,delta){
  const d=state.decks.find(x=>x.id===state.deckId);if(!d)return;
  const cc=card(id);if(!cc||cc.category==="Leader")return;
  const limit=deckCopyLimitForId(id);
  const used=Object.entries(d.cards||{}).filter(([x])=>deckPrintedCode(x)===deckPrintedCode(id)).reduce((sum,[,q])=>sum+Number(q||0),0);
  if(Number(delta)>0){
    const leader=card(d.leader);if(!leader)return notify("Elige primero un líder");
    if(!deckCardAllowedByLeader(cc,leader))return notify("Esa carta no coincide con el color o colores del líder");
    if(deckCardTotal(d)>=50)return notify("El mazo ya tiene 50 cartas");
    if(used>=limit)return notify(limit===50?"Esta carta ya ocupa todas las plazas disponibles":"Máximo "+limit+" copias de ese número de carta");
  }
  const current=Number(d.cards[id]||0),other=Math.max(0,used-current);
  const next=Math.max(0,Math.min(Math.max(0,limit-other),current+Number(delta||0)));
  if(next===0)delete d.cards[id];else d.cards[id]=next;
  if(d.draftCompetitive)d.draftDirty=true;
  d.updatedAt=new Date().toISOString();saveLocal();syncDeck(d);renderShell();
}
function beginLeaderChange(){state.deckChoosingLeader=true;state.deckQuery="";state.deckPage=1;renderShell()}
function setLeader(id){
  const d=state.decks.find(x=>x.id===state.deckId),cc=card(id);if(!d||!cc||cc.category!=="Leader")return;
  const incompatible=Object.entries(d.cards||{}).filter(([,q])=>Number(q)>0).map(([cardId])=>card(cardId)).filter(x=>x&&!deckCardAllowedByLeader(x,cc));
  if(incompatible.length)return notify("Ese líder no es compatible con "+incompatible.length+" carta(s) que ya hay en el mazo");
  d.leader=id;d.colors=cc.colors||[];if(d.draftCompetitive)d.draftDirty=true;d.updatedAt=new Date().toISOString();state.deckChoosingLeader=false;
  state.deckQuery="";state.deckPage=1;Object.assign(state.deckFilters,{category:"Todos",color:"Todos"});
  saveLocal();syncDeck(d);renderShell();notify("Líder seleccionado");
}
function removeLeader(){
  const d=state.decks.find(x=>x.id===state.deckId);if(!d)return;
  if(deckCardTotal(d)>0)return notify("Quita primero las cartas del mazo o cambia a un líder compatible");
  d.leader="";d.colors=[];if(d.draftCompetitive)d.draftDirty=true;d.updatedAt=new Date().toISOString();state.deckChoosingLeader=false;state.deckQuery="";state.deckPage=1;saveLocal();syncDeck(d);renderShell();notify("Líder quitado");
}

  const d=state.decks.find(x=>x.id===state.deckId);if(!d)return;

}

function proxySearchResults(){
  const query=norm(state.proxyQuery.trim());
  if(!query)return '<div class="notice">Busca una carta por nombre, número o expansión para añadirla a la hoja.</div>';
  const matches=state.cards.filter(c=>norm(c.id).includes(query)||c.search?.includes(query)||
    norm(cardPrintLabel(c)).includes(query));
  matches.sort((a,b)=>{
    const rank=c=>norm(c.id)===query?0:norm(c.id).startsWith(query)?1:norm(c.name).startsWith(query)?2:3;
    return rank(a)-rank(b)||a.id.localeCompare(b.id,"es",{numeric:true});
  });

function readReloadView(){
  // A new visit or an external shared/auth URL must not reuse an old tab.
  if(performance.getEntriesByType?.("navigation")?.[0]?.type!=="reload")return null;
  if(location.pathname==="/deck-completion"||location.pathname.startsWith("/auth/")||location.pathname.startsWith("/deck/")||location.pathname.startsWith("/card/"))return null;
  try{
    const raw=sessionStorage.getItem(RELOAD_VIEW_KEY);
    sessionStorage.removeItem(RELOAD_VIEW_KEY);
    const saved=JSON.parse(raw||"null");
    return saved&&typeof saved==="object"&&saved.view&&typeof saved.view==="object"?saved:null;
  }catch{return null}
}
function restoreReloadView(saved){
  if(!saved||state.shared||state.authRecovery)return;
  const {view}=saved;
  if(!RELOAD_ALLOWED_TABS.has(view.tab))return;
  const restoreFields=(target,data)=>{
    if(!data||typeof data!=="object"||Array.isArray(data))return;
    for(const key of Object.keys(target)){
      if(Object.hasOwn(data,key)&&typeof data[key]===typeof target[key])target[key]=data[key];
    }
  };
  restoreFields(state.catalog,saved.catalog);
  restoreFields(state.collection,saved.collection);
  restoreFields(state.album,saved.album);
  restoreFields(state.expansions,saved.expansions);
  restoreFields(state.deckFilters,saved.deckFilters);
  state.tab=view.tab;
  state.collectionStatsOpen=state.tab==="collection"&&!!view.collectionStatsOpen;
  state.album.set=String(view.albumSet||"");
  state.deckLibrary=view.deckLibrary!==false;
  state.deckId=state.user&&state.decks.some(d=>d.id===view.deckId)?view.deckId:null;
  if(state.tab==="decks"&&!state.deckId)state.deckLibrary=true;
  state.tournamentId=state.user&&state.tournaments.some(t=>t.id===view.tournamentId)?view.tournamentId:null;
  state.tournamentStats=saved.tournamentStats==="all"?"all":state.tournamentId&&saved.tournamentStats===state.tournamentId?state.tournamentId:null;
  state.deckQuery=typeof saved.deckQuery==="string"?saved.deckQuery:"";
  state.deckPage=Math.max(1,Number(saved.deckPage)||1);
  state.deckChoosingLeader=!!saved.deckChoosingLeader;
  state.deckDiscover=!!saved.deckDiscover;
  state.deckPreviewOrigin=saved.deckPreviewOrigin==="deck-completion"?"deck-completion":"";
  state.proxyQuery=typeof saved.proxyQuery==="string"?saved.proxyQuery:"";
  if(saved.proxySelection&&typeof saved.proxySelection==="object"&&!Array.isArray(saved.proxySelection)){
    state.proxySelection=Object.fromEntries(Object.entries(saved.proxySelection)
      .filter(([id,n])=>typeof id==="string"&&Number.isSafeInteger(n)&&n>0&&n<=9999&&card(id)));
  }
  state.detail=saved.detailId?card(saved.detailId)||null:null;
  detailHistoryActive=!!state.detail&&!!history.state?.mialbumDetail;
  renderShell();
  // Restore only after catalog, session and results have finished their first render.
  const y=Math.max(0,Number(saved.scrollY)||0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo({top:y,behavior:"instant"})));
  // Guard against the late results/cloud repaint that can reset scroll on mobile.
  setTimeout(()=>{if(state.tab===view.tab)window.scrollTo({top:y,behavior:"instant"})},160);
}

function loginFrom(e,p){loginUser($(e)?.value,$(p)?.value)}
function registerFrom(u,e,p,p2){registerUser($(u)?.value,$(e)?.value,$(p)?.value,$(p2)?.value)}
function accountDisplayName(user=state.user){
  return String(user?.user_metadata?.username||user?.email||"");
}
function normalizeUsername(value){
  return String(value||"").trim().toLowerCase().normalize("NFKC");
}
function authMessage(err){return String(err?.message||err||"Error de autenticación")}
async function accountAuthRequest(payload){
  const r=await fetch("/api/auth",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(data?.error||"Error de autenticación");
  return data;
}
async function loginUser(identifier,password){
  identifier=String(identifier||"").trim();password=String(password||"");
  if(!identifier||!password)return notify("Introduce usuario o email y contraseña");
  state.authBusy=true;state.authError="";state.authNotice="";renderShell();
  try{
    const sb=state.sb||await initSupabase();if(!sb)throw Error("No se pudo conectar con Supabase");
    const data=await accountAuthRequest({action:"login",identifier,password});
    const access=data?.session?.access_token,refresh=data?.session?.refresh_token;
    if(!access||!refresh)throw Error("No se pudo iniciar la sesión");
    const s=await sb.auth.setSession({access_token:access,refresh_token:refresh});if(s.error)throw s.error;
    state.user=s.data.user;state.authError="";loadAccountLocal({migrateLegacy:true});await syncCloud();state.tab="decks";state.deckLibrary=true;state.auth=false;notify("Sesión iniciada");
  }catch(e){state.authError=authMessage(e);notify(state.authError)}
  finally{state.authBusy=false;renderShell()}
}
async function registerUser(username,email,password,repeat){
  username=normalizeUsername(username);email=String(email||"").trim().toLowerCase();password=String(password||"");repeat=String(repeat||"");
  if(!username||!email||!password||!repeat)return notify("Completa usuario, email y las dos contraseñas");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return notify("Introduce un email válido");
  if(password.length<6)return notify("La contraseña debe tener al menos 6 caracteres");
  if(password!==repeat)return notify("Las contraseñas no coinciden");
  state.authBusy=true;state.authError="";state.authNotice="";renderShell();
  try{
    const sb=state.sb||await initSupabase();if(!sb)throw Error("No se pudo conectar con Supabase");
    const data=await accountAuthRequest({action:"signup",username,email,password});
    const access=data?.session?.access_token,refresh=data?.session?.refresh_token;
    if(!access||!refresh)throw Error("La cuenta se creó, pero no se pudo iniciar sesión");
    const s=await sb.auth.setSession({access_token:access,refresh_token:refresh});if(s.error)throw s.error;
    state.user=s.data.user;state.authError="";loadAccountLocal({migrateLegacy:true});await syncCloud();state.tab="decks";state.deckLibrary=true;state.auth=false;notify("Cuenta creada");
  }catch(e){state.authError=authMessage(e);notify(state.authError)}
  finally{state.authBusy=false;renderShell()}
}
async function forgotPasswordPrompt(){
  const email=prompt("Introduce el email de tu cuenta para recuperar la contraseña:");
  if(email===null)return;
  await forgotPassword(email);
}
async function forgotPassword(email){
  email=String(email||"").trim().toLowerCase();
  if(!email)return notify("Introduce tu email");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return notify("Introduce un email válido");
  state.authBusy=true;state.authError="";state.authNotice="";renderShell();
  try{
    const sb=state.sb||await initSupabase();if(!sb)throw Error("No se pudo conectar con Supabase");
    const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:PASSWORD_RESET_URL});if(r.error)throw r.error;
    state.authNotice="Te hemos enviado un correo para cambiar la contraseña.";
    notify("Correo de recuperación enviado");
  }catch(e){state.authError=authMessage(e);notify(state.authError)}
  finally{state.authBusy=false;renderShell()}
}
async function changePassword(password,repeat,{recovery=false}={}){
  password=String(password||"");repeat=String(repeat||"");
  if(password.length<6)return notify("La contraseña debe tener al menos 6 caracteres");
  if(password!==repeat)return notify("Las contraseñas no coinciden");
  state.authBusy=true;state.authError="";renderShell();
  try{
    const sb=state.sb||await initSupabase();if(!sb)throw Error("No se pudo conectar con Supabase");
    const r=await sb.auth.updateUser({password});if(r.error)throw r.error;
    state.authRecovery=false;state.authNotice=recovery?"Contraseña cambiada correctamente. Ya puedes iniciar sesión con la nueva contraseña.":"Contraseña actualizada correctamente.";
    if(location.pathname.startsWith("/auth/")||location.hash||location.search)history.replaceState(null,"","/");
    notify(recovery?"Contraseña recuperada":"Contraseña actualizada");
  }catch(e){state.authError=authMessage(e);notify(state.authError)}
  finally{state.authBusy=false;renderShell()}
}
async function changeRecoveryEmail(email,confirmation){
  if(!state.user?.id)return notify("Inicia sesión para cambiar el correo.");
  if(state.authBusy)return;
  email=String(email||"").trim().toLowerCase();
  confirmation=String(confirmation||"").trim().toLowerCase();
  if(!email||!confirmation)return notify("Introduce el nuevo correo dos veces.");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return notify("Introduce un correo válido.");
  if(email!==confirmation)return notify("Los correos no coinciden.");
  if(email===String(state.user.email||"").toLowerCase())return notify("Ya tienes ese correo registrado.");
  const userId=state.user.id;
  state.authBusy=true;state.authError="";state.authNotice="";
  openAccountPanels.add("security");
  renderShell();
  try{
    const sb=state.sb||await initSupabase();
    if(!sb)throw Error("No se pudo conectar con Supabase.");
    if(state.user?.id!==userId)throw Error("La sesión ha cambiado.");
    const r=await sb.auth.updateUser({email},{emailRedirectTo:AUTH_RETURN_URL});
    if(r.error)throw r.error;
    if(state.user?.id!==userId)return;
    state.authNotice="Cambio solicitado. Comprueba el nuevo correo y, si se solicita, también el anterior. El cambio debe confirmarse mediante los enlaces recibidos.";
    notify("Confirma el cambio desde tu correo.");
  }catch(e){
    if(state.user?.id===userId){
      state.authError="No se pudo solicitar el cambio: "+authMessage(e);
      notify(state.authError);
    }
  }finally{
    state.authBusy=false;
    if(state.user?.id===userId)renderShell();
  }
}

async function deleteAccount(){
  if(!state.user)return;
  const first=confirm("¿Eliminar tu cuenta? Se borrarán permanentemente la colección y los mazos sincronizados.");
  if(!first)return;
  const typed=prompt('Para confirmar, escribe ELIMINAR');

function writeCollection(id,nextValue){

    if(!collectionAvailable()||state.user?.id!==userId)return false;

    const old=qty(id);

      // A stale browser cannot overwrite another device's newer copy count.
      const result=await state.sb.rpc("collection_write_atomic",{
        p_id:id,p_expected:old,p_next:n
      });
      if(result.error)throw result.error;
      if(Number(result.data)!==n)throw Error("La cantidad confirmada no coincide");
      if(state.user?.id!==userId)return false;
      if(n===0)delete state.owned[id];else state.owned[id]=n;
      // Notify the open scanner only after an exact-print write is confirmed.
      window.dispatchEvent(new CustomEvent("mialbum:collection-updated",{
        detail:{userId,id,quantity:n}
      }));

          await loadCollectionFromCloud(userId);
          window.dispatchEvent(new CustomEvent("mialbum:collection-updated",{
            detail:{userId,id,quantity:qty(id)}

        }else notify("No se pudo guardar en Supabase. Tu colección no se ha modificado.");
      }

    }

const deckSyncWrites=new Map();

function scheduleAutomaticDeckRetry(){

function syncDeck(d,{automatic=false}={}){

    .filter(([,value])=>Number(value)>0));

    p_deck_id:id,p_name:String(d.name||"Mi mazo").slice(0,120),
    p_leader:d.leader||"",p_description:String(d.description||"").slice(0,2000),
    p_colors:d.colors||[],p_cards:cards,

// Server state is authoritative for untouched cards; pending local edits always win.
// In particular a deleted card must NEVER return from an older remote/legacy snapshot.
let collectionLoadId=0;
async function loadCollectionFromCloud(userId){
  const requestId=++collectionLoadId;
  state.collectionReady=false;
  if(state.user?.id!==userId||!state.sb)return false;
  const result={};
  try{
    // Paginate: the default Supabase response limit can omit cards.
    for(let start=0;start<20000;start+=500){
      const page=await state.sb.from("collection_items")
        .select("card_id,quantity").eq("user_id",userId)
        .order("card_id",{ascending:true}).range(start,start+499);
      if(page.error)throw page.error;
      const rows=page.data||[];
      for(const row of rows){
        const q=Math.max(0,Number(row.quantity)||0);
        if(q>0)result[row.card_id]=q;
      }
      if(rows.length<500)break;
      if(start===19500)throw Error("La colección excede el límite de lectura");
    }
    if(requestId!==collectionLoadId||state.user?.id!==userId)return false;
    state.owned=result;
    state.collectionReady=true;
    ensureOwnedCardsInCatalog();
    return true;
  }catch(e){
    console.warn("Fallo al leer la colección desde Supabase",e);
    if(requestId===collectionLoadId&&state.user?.id===userId){
      state.owned={};state.collectionReady=false;
      state.authError="No se pudo cargar tu colección desde Supabase. Inténtalo de nuevo.";
    }
    return false;
  }
}
let cloudSyncQueue=Promise.resolve();
const cloudSyncInFlight=new Map();
function syncCloud(){
  if(!state.sb||!state.user)return Promise.resolve(false);

  const operation=cloudSyncQueue.catch(()=>{}).then(()=>syncCloudInternal(userId))
    .finally(()=>cloudSyncInFlight.delete(userId));

async function syncCloudInternal(userId){

  await window.tournamentsSyncForAccount?.(userId);

    const ds=await state.sb.from("decks").select("*").eq("user_id",state.user.id);if(ds.error)throw ds.error;
    const remoteIds=(ds.data||[]).map(d=>d.id);

  }catch(e){

let supabaseInitPromise=null;
async function handleAuthCallback(sb){
  const url=new URL(location.href),params=url.searchParams;
  const hashParams=new URLSearchParams(location.hash.replace(/^#/,""));
  const errorDescription=params.get("error_description")||hashParams.get("error_description");
  const rawType=String(params.get("type")||hashParams.get("type")||"").toLowerCase();
  const isRecovery=rawType==="recovery"||location.pathname==="/auth/reset";

  if(errorDescription){
    state.authError=decodeURIComponent(errorDescription.replace(/\+/g," "));
    state.authNotice="";state.authRecovery=false;state.tab="account";
    return {handled:true,error:true};
  }

  // Token-hash links used by customized Supabase email templates.
  const tokenHash=params.get("token_hash");
  if(tokenHash){
    const type=rawType==="signup"?"email":rawType;
    const allowed=new Set(["email","recovery","invite","magiclink","email_change"]);
    if(!allowed.has(type)){
      state.authError="Enlace de autenticación no válido.";
      state.authNotice="";state.authRecovery=false;state.tab="account";
      return {handled:true,error:true};
    }
    const r=await sb.auth.verifyOtp({token_hash:tokenHash,type});
    if(r.error){
      state.authError="No se pudo validar el enlace: "+authMessage(r.error);
      state.authNotice="";state.authRecovery=false;state.tab="account";
      return {handled:true,error:true};
    }
    state.user=r.data.user||r.data.session?.user||null;
    state.authError="";state.tab="account";
    if(type==="recovery"){
      state.authRecovery=true;
      state.authNotice="Enlace válido. Elige una nueva contraseña.";
      history.replaceState(null,"","/");
    }else{
      state.authRecovery=false;
      state.authNotice=type==="email_change"?"Correo de recuperación confirmado correctamente.":"Correo confirmado correctamente. Tu cuenta ya está activa.";
      history.replaceState(null,"","/");
    }
    return {handled:true,error:false};
  }

  // PKCE links return a ?code=... parameter.
  const code=params.get("code");
  if(code){
    const r=await sb.auth.exchangeCodeForSession(code);
    if(r.error){
      state.authError="No se pudo abrir el enlace de recuperación: "+authMessage(r.error);
      state.authNotice="";state.authRecovery=false;state.tab="account";
      return {handled:true,error:true};
    }
    state.user=r.data.user||r.data.session?.user||null;
    state.authError="";state.tab="account";
    state.authRecovery=isRecovery||rawType==="recovery";
    state.authNotice=state.authRecovery?"Enlace válido. Elige una nueva contraseña.":"Cuenta verificada correctamente.";
    history.replaceState(null,"","/");
    return {handled:true,error:false};
  }

  // Implicit-flow recovery links return access/refresh tokens in the URL hash.
  const accessToken=hashParams.get("access_token"),refreshToken=hashParams.get("refresh_token");
  if(accessToken&&refreshToken){
    const r=await sb.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
    if(r.error){
      state.authError="No se pudo abrir el enlace de recuperación: "+authMessage(r.error);
      state.authNotice="";state.authRecovery=false;state.tab="account";
      return {handled:true,error:true};
    }
    state.user=r.data.user||r.data.session?.user||null;
    state.authError="";state.tab="account";
    state.authRecovery=isRecovery||rawType==="recovery";
    state.authNotice=state.authRecovery?"Enlace válido. Elige una nueva contraseña.":"Sesión iniciada.";
    history.replaceState(null,"","/");
    return {handled:true,error:false};
  }

  // Supabase may already have consumed the URL automatically. Preserve recovery mode
  // whenever the returned URL explicitly says type=recovery.
  if(isRecovery){
    state.authRecovery=true;state.authError="";state.authNotice="Enlace de recuperación abierto. Elige una nueva contraseña.";state.tab="account";
    return {handled:true,error:false};
  }
  return {handled:false};
}
async function initSupabase(){
  if(state.sb)return state.sb;
  if(supabaseInitPromise)return supabaseInitPromise;
  supabaseInitPromise=(async()=>{
    try{
      await loadSupabaseConfig();
      let api=window.supabase;
      if(!api?.createClient)api=await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm");
      state.sb=api.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const callback=await handleAuthCallback(state.sb);
      const s=await state.sb.auth.getSession();if(s.error)throw s.error;
      state.user=s.data.session?.user||null;
      if(location.pathname==="/auth/reset"){state.authRecovery=true;state.tab="account"}
      if(state.user){loadAccountLocal({migrateLegacy:true});await syncCloud()}
      else loadAccountLocal();
      state.authReady=true;if(!state.authError)state.authError="";
      void window.OnePieceTools?.loadCloud?.();renderShell();
      state.sb.auth.onAuthStateChange((event,session)=>setTimeout(async()=>{
        const previous=state.user?.id||null;state.user=session?.user||null;
        const returnedType=new URLSearchParams(location.hash.replace(/^#/,"")).get("type")||new URL(location.href).searchParams.get("type");
        if(event==="PASSWORD_RECOVERY"||returnedType==="recovery"||location.pathname==="/auth/reset"){state.authRecovery=true;state.authNotice="Enlace válido. Elige una nueva contraseña.";state.tab="account"}

          // account's server rows may populate the collection.

          else{state.deckId=null;state.deckLibrary=true;loadAccountLocal()}
        }else if(next&&!state.collectionReady){
          await syncCloud();
        }
