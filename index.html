<title>One Piece Card Market</title>
<style>

*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#1c2540 0,#090b12 42%);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;padding-bottom:78px}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#090b12e8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.brand b{display:block;letter-spacing:.12em}.brand span{font-size:10px;color:var(--muted);letter-spacing:.2em}.account{background:var(--panel2);color:var(--txt);border:1px solid var(--line);padding:8px 11px;border-radius:999px}.wrap{max-width:1200px;margin:auto;padding:18px 16px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:8px 0 18px}.hero h1{font-size:clamp(27px,7vw,48px);margin:0 0 5px}.hero p{margin:0;color:var(--muted)}.search{display:flex;gap:8px;margin-bottom:12px}.search input,.filters select,.modal input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:13px;padding:12px}.btn{padding:11px 14px;border-radius:12px;font-weight:700}.primary{background:var(--accent);color:#16120a}.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.card{background:linear-gradient(180deg,#151a28,#0f131e);border:1px solid var(--line);border-radius:16px;overflow:hidden}.card img{display:block;width:100%;aspect-ratio:63/88;object-fit:cover;background:#080a0f}.card .body{padding:10px}.name{font-weight:750;line-height:1.2}.muted{color:var(--muted);font-size:12px}.pills{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0}.pill{font-size:10px;padding:3px 6px;border:1px solid var(--line);border-radius:999px;color:#cdd5e5}.row{display:flex;justify-content:space-between;align-items:center;gap:7px}.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1;font-size:12px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);padding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));background:#0d111bdF;border-top:1px solid var(--line);backdrop-filter:blur(18px)}.nav button{background:transparent;color:var(--muted);padding:8px 4px}.nav button.active{color:var(--accent);font-weight:700}.nav span{display:block;font-size:11px;margin-top:2px}.section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.section h2{margin:0 0 10px}.list{display:grid;gap:8px}.listrow{display:flex;align-items:center;gap:10px;padding:9px;background:var(--panel2);border-radius:12px}.listrow img{width:46px;height:64px;object-fit:cover;border-radius:6px}.modalback{position:fixed;inset:0;z-index:20;background:#000b;display:grid;place-items:end center}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px}.modaltop{display:flex;justify-content:space-between}.detail{display:grid;grid-template-columns:180px 1fr;gap:18px}.detail img{width:100%;border-radius:10px}.close{background:var(--panel2);color:var(--txt);border-radius:50%;width:36px;height:36px}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.toast{position:fixed;z-index:30;left:50%;bottom:88px;transform:translateX(-50%);background:#f7f8fb;color:#111;padding:10px 14px;border-radius:999px;font-weight:700}.error{color:var(--danger);margin-top:8px}.ok{color:var(--ok)}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.detail{grid-template-columns:120px 1fr}.grid{grid-template-columns:repeat(2,1fr)}.actions{flex-direction:column}}
</style></head><body><div id="app"><div class="empty">Cargando One Piece Card Market…</div></div><script>
window.addEventListener("error",function(e){console.error(e.error||e.message);var a=document.getElementById("app");if(a)a.innerHTML="<div class=\"empty\"><h2>No se pudo iniciar la app</h2><p>Recarga la página. Si el problema persiste, abre el navegador actualizado.</p></div>";});

const SB_URL="https://zawzbdbdbcshljhlvgjx.supabase.co",SB_KEY="sb_publishable_TGSNNhx2wvUGteg_pdPg_zkyVP4s-";
const BASE="https://raw.githubusercontent.com/Kuroro1990/OPTCG/main/english",IMG=id=>"https://en.onepiece-cardgame.com/images/cardlist/card/"+encodeURIComponent(id)+".png";
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c])), norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
let sb=null,cards=[],packs={},prices=new Map(),collection=JSON.parse(localStorage.optcg_collection||"{}"),decks=JSON.parse(localStorage.optcg_decks||"[]"),user=null;
let tab="catalog",q="",filters={cat:"Todos",color:"Todos",rarity:"Todos",set:"Todos",own:"all"},detail=null,auth=false,toast="",activeDeck=null;
const $=s=>document.querySelector(s), qty=id=>+collection[id]||0;
function save(){localStorage.optcg_collection=JSON.stringify(collection);localStorage.optcg_decks=JSON.stringify(decks)}
function euro(n){return Number.isFinite(+n)?(+n).toFixed(2).replace(".",",")+" €":"—"}
function colors(){return["Todos","Red","Green","Blue","Purple","Black","Yellow"]}
function categories(){return["Todos","Leader","Character","Event","Stage","Don"]}
function select(id,vals,val){return '<select data-f="'+id+'">'+vals.map(x=>'<option '+(x===val?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select>'}
function filtered(){return cards.filter(c=>{if(filters.cat!=="Todos"&&String(c.category||"").toLowerCase()!==filters.cat.toLowerCase())return false;if(filters.color!=="Todos"&&!Array.isArray(c.colors)||filters.color!=="Todos"&&!(c.colors||[]).some(x=>norm(x)===norm(filters.color)))return false;if(filters.rarity!=="Todos"&&c.rarity!==filters.rarity)return false;if(filters.set!=="Todos"&&c.pack_id!==filters.set)return false;if(filters.own==="owned"&&!qty(c.id))return false;if(filters.own==="missing"&&qty(c.id))return false;if(q&&!norm([c.id,c.name,c.rarity,c.pack_id,...(c.colors||[])].join(" ")).includes(norm(q)))return false;return true})}
function card(c){return '<article class="card"><img loading="lazy" src="'+IMG(c.id)+'" alt="'+esc(c.name)+'"><div class="body"><div class="name">'+esc(c.name)+'</div><div class="muted">'+esc(c.id)+' · '+esc(c.rarity||"—")+'</div><div class="pills">'+(c.colors||[]).map(x=>'<span class="pill">'+esc(x)+'</span>').join("")+'</div><div class="row"><b>'+(prices.get(c.id)?euro(prices.get(c.id)):"Cardmarket")+'</b><span class="muted">'+(qty(c.id)?"×"+qty(c.id):"—")+'</span></div><div class="actions"><button class="secondary btn" data-detail="'+esc(c.id)+'">Ver</button><button class="primary btn" data-add="'+esc(c.id)+'">+ Colección</button></div></div></article>'}
function catalog(){let list=filtered().slice(0,240);return '<div class="wrap"><div class="hero"><div><h1>Catálogo</h1><p>'+cards.length.toLocaleString("es-ES")+' cartas · búsqueda y filtros rápidos.</p></div></div><div class="search"><input id="q" value="'+esc(q)+'" placeholder="Busca Luffy, OP17-093, Zoro…"><button class="primary btn" id="search">Buscar</button></div><div class="filters">'+select("cat",categories(),filters.cat)+select("color",colors(),filters.color)+select("rarity",["Todos",...new Set(cards.map(c=>c.rarity).filter(Boolean))],filters.rarity)+select("set",["Todos",...Object.keys(packs).sort((a,b)=>(packs[a]||a).localeCompare(packs[b]||b))],filters.set)+'</div><div class="filters">'+select("own",["all","owned","missing"],filters.own)+'</div><div class="grid">'+(list.length?list.map(card).join(""):'<div class="empty">No hay resultados con estos filtros.</div>')+'</div></div>'}
function collectionView(){let owned=Object.entries(collection).filter(([,v])=>+v>0),total=owned.reduce((s,[,v])=>s+v,0);return '<div class="wrap"><div class="hero"><div><h1>Mi colección</h1><p>'+owned.length+' cartas distintas · '+total+' copias.</p></div></div><div class="section"><div class="row"><b>Valor visible de referencia</b><strong>'+euro(owned.reduce((s,[id,v])=>s+(prices.get(id)||0)*+v,0))+'</strong></div><p class="muted">Cardmarket: precio de referencia, actualizado según la disponibilidad de la fuente pública; no es tiempo real.</p></div><div class="grid">'+owned.map(([id])=>{let c=cards.find(x=>x.id===id);return c?card(c):""}).join("")+'</div></div>'}
function decksView(){let d=decks.find(x=>x.id===activeDeck)||decks[0];if(d)activeDeck=d.id;return '<div class="wrap"><div class="hero"><div><h1>Mazos</h1><p>Construye con líder + hasta 50 cartas no líder y máximo 4 copias.</p></div><button class="primary btn" id="newdeck">+ Nuevo</button></div><div class="section">'+(decks.length?decks.map(x=>'<div class="listrow"><div style="flex:1"><b>'+esc(x.name)+'</b><div class="muted">'+Object.values(x.cards||{}).reduce((a,b)=>a+ +b,0)+'/50 · '+(x.leader||"sin líder")+'</div></div><button class="secondary btn" data-deck="'+x.id+'">Abrir</button></div>').join(""):'<div class="empty">Todavía no tienes mazos.</div>')+'</div>'+(d?deckEditor(d):"")+'</div>'}
function deckEditor(d){let total=Object.values(d.cards||{}).reduce((a,b)=>a+ +b,0),leader=cards.find(c=>c.id===d.leader);return '<div class="section"><div class="row"><h2 style="margin:0">'+esc(d.name)+'</h2><button class="secondary btn" id="deleteDeck">Eliminar</button></div><p class="muted">Líder: '+esc(leader?.name||d.leader||"elige un líder")+' · '+total+'/50</p><input id="deckq" placeholder="Añadir carta al mazo…"><div id="deckresults"></div><div class="list">'+Object.entries(d.cards||{}).map(([id,n])=>{let c=cards.find(x=>x.id===id);return c?'<div class="listrow"><img src="'+IMG(id)+'"><div style="flex:1"><b>'+esc(c.id)+'</b><div>'+esc(c.name)+'</div></div><button class="secondary btn" data-minusdeck="'+id+'">−</button><b>'+n+'</b><button class="primary btn" data-plusdeck="'+id+'">+</button></div>':""}).join("")+'</div></div>'}
function authView(){return '<div class="modalback"><div class="modal"><div class="modaltop"><h2>Cuenta</h2><button class="close" id="closeauth">×</button></div><p class="muted">Sin cuenta: demo local. Con cuenta: colección y mazos sincronizados con Supabase.</p><input id="email" placeholder="Email" type="email"><br><br><input id="pass" placeholder="Contraseña" type="password"><div class="actions"><button class="primary btn" id="login">Entrar</button><button class="secondary btn" id="register">Crear cuenta</button></div>'+(user?'<button class="secondary btn" id="logout">Cerrar sesión</button>':"")+'</div></div>'}
function detailView(){let c=detail;return '<div class="modalback"><div class="modal"><div class="modaltop"><h2>'+esc(c.name)+'</h2><button class="close" id="closedetail">×</button></div><div class="detail"><img src="'+IMG(c.id)+'"><div><div class="muted">'+esc(c.id)+' · '+esc(c.rarity||"—")+'</div><div class="pills">'+(c.colors||[]).map(x=>'<span class="pill">'+esc(x)+'</span>').join("")+'</div><p>'+esc(String(c.effect||"Sin texto de efecto.").replace(/<br\s*\/?/?>/gi,"\n").replace(/<[^>]+>/g,""))+'</p><p class="muted">Tipo: '+esc(c.category||"—")+' · Coste: '+esc(c.cost??"—")+' · Poder: '+esc(c.power??"—")+'</p><button class="primary btn" data-add="'+esc(c.id)+'">+ Añadir a colección</button><a class="secondary btn" style="display:inline-block;margin-top:8px" target="_blank" rel="noopener" href="https://www.cardmarket.com/es/OnePiece/Products/Singles?mode=list&searchString='+encodeURIComponent(c.id)+'">Cardmarket ↗</a></div></div></div></div>'}
function render(){document.querySelector("#app").innerHTML='<div class="app"><header class="top"><div class="brand"><b>ONE PIECE</b><span>CARD MARKET</span></div><button class="account" id="account">'+(user?esc(user.email.split("@")[0]):"Entrar")+'</button></header>'+ (tab==="catalog"?catalog():tab==="collection"?collectionView():decksView())+'<nav class="nav"><button class="'+(tab==="catalog"?"active":"")+'" data-tab="catalog">⌕<span>Catálogo</span></button><button class="'+(tab==="collection"?"active":"")+'" data-tab="collection">▦<span>Colección</span></button><button class="'+(tab==="decks"?"active":"")+'" data-tab="decks">♟<span>Mazos</span></button><button data-account>◉<span>Cuenta</span></button></nav>'+(auth?authView():"")+(detail?detailView():"")+(toast?'<div class="toast">'+esc(toast)+'</div>':"")+'</div>';wire()}
function notice(x){toast=x;render();setTimeout(()=>{toast="";render()},1500)}
function add(id){collection[id]=qty(id)+1;save();syncCollection();notice("Añadida a tu colección")}
function deckAdd(id,delta){let d=decks.find(x=>x.id===activeDeck)||decks[0];if(!d)return;if(!d.cards)d.cards={};let c=cards.find(x=>x.id===id);if(c?.category==="Leader"){d.leader=id}else{let n=+d.cards[id]||0,total=Object.values(d.cards).reduce((a,b)=>a+ +b,0);if(delta>0&&n<4&&total<50)d.cards[id]=n+1;else if(delta<0&&n>0){d.cards[id]=n-1;if(!d.cards[id])delete d.cards[id]}}save();syncDeck(d);render()}
function wire(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector("[data-account]")?.addEventListener("click",()=>{auth=true;render()});$("#account")?.addEventListener("click",()=>{auth=true;render()});$("#closeauth")?.addEventListener("click",()=>{auth=false;render()});$("#closedetail")?.addEventListener("click",()=>{detail=null;render()});$("#search")?.addEventListener("click",()=>{q=$("#q").value.trim();render()});$("#q")?.addEventListener("keydown",e=>{if(e.key==="Enter"){q=e.target.value.trim();render()}});document.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>{filters[x.dataset.f]=x.value;render()});document.querySelectorAll("[data-add]").forEach(x=>x.onclick=()=>add(x.dataset.add));document.querySelectorAll("[data-detail]").forEach(x=>x.onclick=()=>{detail=cards.find(c=>c.id===x.dataset.detail);render()});$("#deleteDeck")?.addEventListener("click",async()=>{const d=decks.find(x=>x.id===activeDeck);if(!d||!confirm("¿Eliminar este mazo?"))return;decks=decks.filter(x=>x.id!==d.id);activeDeck=decks[0]?.id||null;save();if(sb&&user)await sb.from("decks").delete().eq("id",d.id);render()});$("#newdeck")?.addEventListener("click",()=>{let n=prompt("Nombre del mazo","Mi mazo");if(n){const d={id:crypto.randomUUID(),name:n,leader:"",cards:{}};decks.unshift(d);activeDeck=d.id;save();syncDeck(d);render()}});document.querySelectorAll("[data-plusdeck]").forEach(x=>x.onclick=()=>deckAdd(x.dataset.plusdeck,1));document.querySelectorAll("[data-minusdeck]").forEach(x=>x.onclick=()=>deckAdd(x.dataset.minusdeck,-1));document.querySelectorAll("[data-deck]").forEach(x=>x.onclick=()=>{activeDeck=x.dataset.deck;render()});$("#deckq")?.addEventListener("input",()=>{let s=norm($("#deckq").value),el=$("#deckresults");if(!s){el.innerHTML="";return}el.innerHTML=cards.filter(c=>norm(c.id+" "+c.name).includes(s)).slice(0,8).map(c=>'<button class="secondary btn" style="width:100%;margin-top:5px;text-align:left" data-deckadd="'+c.id+'">'+esc(c.id)+" · "+esc(c.name)+"</button>").join("");el.querySelectorAll("[data-deckadd]").forEach(b=>b.onclick=()=>deckAdd(b.dataset.deckadd,1))});$("#login")?.addEventListener("click",login);$("#register")?.addEventListener("click",register);$("#logout")?.addEventListener("click",logout)}
async function initSB(){try{const m=await import("https://esm.sh/@supabase/supabase-js@2");sb=m.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const s=await sb.auth.getSession();user=s.data.session?.user||null;sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;loadCloud();render()});loadCloud();render()}catch(e){}}
async function login(){try{if(!sb)throw new Error("La conexión de cuenta todavía está cargando. Inténtalo de nuevo en unos segundos.");let {data,error}=await sb.auth.signInWithPassword({email:$("#email").value,password:$("#pass").value});if(error)throw error;user=data.user;auth=false;loadCloud();render()}catch(e){alert(e.message)}}
async function register(){try{if(!sb)throw new Error("La conexión de cuenta todavía está cargando. Inténtalo de nuevo en unos segundos.");let {error}=await sb.auth.signUp({email:$("#email").value,password:$("#pass").value});if(error)throw error;alert("Cuenta creada. Revisa tu email si la confirmación está activada.")}catch(e){alert(e.message)}}
async function logout(){await sb?.auth.signOut();user=null;auth=false;render()}
async function loadCloud(){if(!sb||!user)return;try{let {data:ci}=await sb.from("collection_items").select("card_id,quantity").eq("user_id",user.id);collection={};(ci||[]).forEach(x=>collection[x.card_id]=+x.quantity);let {data:ds}=await sb.from("decks").select("id,name,leader_card_id,created_at").eq("user_id",user.id).order("created_at",{ascending:false});decks=[];for(const d of ds||[]){let {data:dc}=await sb.from("deck_cards").select("card_id,quantity").eq("deck_id",d.id);let m={};(dc||[]).forEach(x=>m[x.card_id]=+x.quantity);decks.push({id:d.id,name:d.name,leader:d.leader_card_id||"",cards:m})}save();render()}catch(e){}}
async function syncCollection(){if(!sb||!user)return;try{const {data:rows}=await sb.from("collection_items").select("card_id").eq("user_id",user.id);const keep=new Set(Object.keys(collection));for(const r of rows||[]){if(!keep.has(String(r.card_id)))await sb.from("collection_items").delete().eq("user_id",user.id).eq("card_id",r.card_id)}for(const [id,n] of Object.entries(collection))await sb.from("collection_items").upsert({user_id:user.id,card_id:id,quantity:+n,updated_at:new Date().toISOString()},{onConflict:"user_id,card_id"})}catch(e){console.warn(e)}}
async function syncDeck(d){if(!sb||!user)return;await sb.from("decks").upsert({id:d.id,user_id:user.id,name:d.name,leader_card_id:d.leader||null,updated_at:new Date().toISOString()});await sb.from("deck_cards").delete().eq("deck_id",d.id);let rows=Object.entries(d.cards||{}).map(([card_id,quantity])=>({deck_id:d.id,card_id,quantity:+quantity}));if(rows.length)await sb.from("deck_cards").insert(rows)}
async function load(){try{let [a,b]=await Promise.all([fetch(BASE+"/index/cards_by_id.json"),fetch(BASE+"/packs.json")]);let raw=await a.json();cards=Array.isArray(raw)?raw:Object.values(raw);cards=cards.map(c=>({...c,id:String(c.id||""),pack_id:String(c.pack_id||"")})).filter(c=>c.id);let ps=await b.json();(Array.isArray(ps)?ps:Object.values(ps)).forEach(p=>packs[String(p.id||p.pack_id||"")]=String(p.raw_title||p.title||p.name||p.id||""));render();loadCardmarketPrices();}catch(e){document.querySelector("#app").innerHTML='<div class="empty">No se pudo cargar el catálogo. Comprueba tu conexión e inténtalo de nuevo.</div>'}}
render();load();initSB();
async function loadCardmarketPrices(){
  try{
    const [productsRes,pricesRes]=await Promise.all([
      fetch("https://downloads.s3.cardmarket.com/productCatalog/productList/products_singles_18.json",{cache:"no-store"}),
      fetch("https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_18.json",{cache:"no-store"})
    ]);
    if(!productsRes.ok||!pricesRes.ok) return;
    const products=await productsRes.json(), guide=await pricesRes.json();
    const rows=x=>Array.isArray(x)?x:(x&&typeof x==="object"?Object.values(x):[]);
    const guideRows=rows(guide), productRows=rows(products);
    const byProduct=new Map();
    for(const p of guideRows){
      const id=p?.idProduct??p?.productId??p?.id;
      if(id!=null) byProduct.set(String(id),p);
    }
    const wanted=new Map(cards.map(c=>[String(c.id).toUpperCase(),c.id]));
    for(const p of productRows){
      const candidates=[p?.number,p?.cardNumber,p?.idCard,p?.enName,p?.name].flatMap(v=>String(v??"").match(/[A-Z]{2,6}-\d{1,4}/gi)||[]);
      for(const n of candidates){
        const cid=wanted.get(n.toUpperCase()), gid=p?.idProduct??p?.productId??p?.id;
        const row=gid!=null?byProduct.get(String(gid)):null;
        const value=Number(String(row?.priceTrend??row?.price_trend??row?.trend??row?.avg30??row?.lowPrice??row?.average??"").replace(",","."));
        if(cid&&Number.isFinite(value)){prices.set(cid,value);break;}
      }
    }
    render();
  }catch(e){console.warn("Cardmarket feed unavailable",e);}
}
window.addEventListener("load",()=>{if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});});
