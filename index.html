<style>
:root{--bg:#080a10;--panel:#101521;--panel2:#171d2b;--panel3:#1d2536;--line:#283247;--text:#f7f9fc;--muted:#9aa5b8;--accent:#ffd447;--accent2:#7ee2c1;--danger:#ff6b7c}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 20% -10%,#1c2744 0,#080a10 44%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:84px}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;background:#080a10ee;border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}.brand b{display:block;letter-spacing:.14em}.brand span{display:block;font-size:10px;letter-spacing:.2em;color:var(--muted);margin-top:2px}.account{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:8px 12px}.wrap{max-width:1250px;margin:auto;padding:17px 15px}.hero{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:6px 0 18px}.hero h1{font-size:clamp(28px,8vw,46px);margin:0 0 5px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px}.stat b{display:block;font-size:20px}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:8px}.toolbar2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:15px}.field{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:750}.primary{background:var(--accent);color:#17130a}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.danger{background:#3a1920;border:1px solid #71313d;color:#ffd7dc}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:11px}.card{background:linear-gradient(180deg,#151b29,#0d1119);border:1px solid var(--line);border-radius:15px;overflow:hidden;position:relative}.cardimg{display:block;width:100%;aspect-ratio:0.716;object-fit:cover;background:#0b0d13}.cardbody{padding:9px}.name{font-weight:800;line-height:1.16;min-height:33px}.muted{color:var(--muted);font-size:11px}.chips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.chip{font-size:9px;border:1px solid var(--line);padding:3px 6px;border-radius:99px;color:#cdd5e4}.row{display:flex;align-items:center;justify-content:space-between;gap:7px}.quick{display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:5px;margin-top:8px}.quick button{width:38px;height:34px;border-radius:9px}.qty{background:var(--panel2);border:1px solid var(--line);height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800}.ownedtag{position:absolute;top:7px;left:7px;background:#0b111ccc;border:1px solid var(--accent2);color:var(--accent2);border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}.missingtag{position:absolute;top:7px;right:7px;background:#120e10d9;color:#ffd0d7;border:1px solid #61323a;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}.section{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;margin-bottom:12px}.section h2{margin:0 0 10px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:grid;gap:8px}.listrow{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:9px}.thumb{width:46px;height:64px;object-fit:cover;border-radius:6px;background:#0a0c12}.grow{flex:1;min-width:0}.inline-actions{display:flex;gap:6px;flex-wrap:wrap}.pillnum{background:var(--panel3);padding:4px 7px;border-radius:99px;font-size:11px}.progress{height:7px;background:#0b0e15;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}.expgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.exp{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:11px}.exp b{display:block;margin-bottom:5px}.modalback{position:fixed;inset:0;z-index:30;background:#000b;display:grid;place-items:end center}.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:17px}.modaltop{display:flex;justify-content:space-between;align-items:center;gap:8px}.close{border:0;background:var(--panel2);color:var(--text);width:35px;height:35px;border-radius:50%}.detail{display:grid;grid-template-columns:190px 1fr;gap:18px}.detail img{width:100%;border-radius:10px;background:#0b0d13}.empty{text-align:center;color:var(--muted);padding:45px 12px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px max(7px,env(safe-area-inset-bottom));background:#0b0f18ee;border-top:1px solid var(--line);backdrop-filter:blur(18px)}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 4px}.nav button.active{color:var(--accent)}.nav span{display:block;font-size:10px;margin-top:3px}.toast{position:fixed;z-index:40;left:50%;bottom:90px;transform:translateX(-50%);background:#f6f8fb;color:#111;padding:10px 14px;border-radius:999px;font-weight:800}.small{font-size:12px}.right{text-align:right}.ok{color:var(--accent2)}.dangerText{color:var(--danger)}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(max-width:800px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.toolbar,.toolbar2,.two,.three{grid-template-columns:1fr}.detail{grid-template-columns:120px 1fr}.hero{align-items:start;flex-direction:column}.expgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="empty">Cargando MiAlbumOnePiece…</div></div>
<script>
let booted=false;
const DATA="./data";
const SUPABASE_URL="https://zawzbdbdbcshljhlvgjx.supabase.co";
const SUPABASE_KEY="sb_publishable_TGSNNhx2wvUGteg_pdPg_zkyVP4s-";
const officialImage=id=>"https://en.onepiece-cardgame.com/images/cardlist/card/"+encodeURIComponent(id)+".png";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"");
const money=n=>Number.isFinite(+n)?Number(n).toFixed(2).replace(".",",")+" €":"—";
const safeObj=x=>x&&typeof x==="object"?x:{};

let cards=[],packs=[],prices={},collection={},decks=[];
let tab="catalog",query="",detail=null,authOpen=false,toast="",activeDeckId=null,sharedDeck=null;
let catalogFilters={set:"Todos",category:"Todos",color:"Todos",rarity:"Todos",ownership:"Todas",sort:"id"};
let collectionFilters={set:"Todos",category:"Todos",rarity:"Todos",sort:"id"};
let catalogLimit=120,collectionLimit=120,user=null,sb=null;

try{collection=JSON.parse(localStorage.mialbum_collection||"{}")}catch(e){collection={}}
try{decks=JSON.parse(localStorage.mialbum_decks||"[]")}catch(e){decks=[]}

function saveLocal(){localStorage.mialbum_collection=JSON.stringify(collection);localStorage.mialbum_decks=JSON.stringify(decks)}
function qty(id){return Number(collection[id]||0)}
function setName(code){const p=packs.find(x=>x.code===code);return p?p.name:code}
function cardImage(c){
  const src=c.image||c.img_full_url||c.img_url||officialImage(c.id);
  return '<img class="cardimg" loading="lazy" src="'+esc(src)+'" alt="'+esc(c.name)+'" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src=\''+officialImage(c.id)+'\';this.onerror=function(){this.style.display=\'none\';this.nextElementSibling.style.display=\'grid\'}">';
}
function imageFallback(id){return '<div style="display:none;aspect-ratio:.716;place-items:center;background:#0b0d13;color:#687389;font-size:11px;text-align:center;padding:10px">'+esc(id)+'</div>'}
function sortCards(list,mode){
  const a=list.slice();
  a.sort((x,y)=>{
    let av,bv;
    if(mode==="name"){av=norm(x.name);bv=norm(y.name)}
    else if(mode==="set"){av=(x.set||"")+" "+norm(x.name);bv=(y.set||"")+" "+norm(y.name)}
    else if(mode==="rarity"){av=norm(x.rarity);bv=norm(y.rarity)}
    else if(mode==="quantity"){av=qty(x.id);bv=qty(y.id);if(av===bv){av=x.id;bv=y.id}}
    else if(mode==="price"){av=Number(prices[x.id]||0);bv=Number(prices[y.id]||0);if(av===bv){av=x.id;bv=y.id}}
    else if(mode==="value"){av=qty(x.id)*Number(prices[x.id]||0);bv=qty(y.id)*Number(prices[y.id]||0)}
    else {av=x.id;bv=y.id}
    return av< bv?-1:av>bv?1:0;
  });
  return a;
}
function uniqueVals(key){return [...new Set(cards.map(c=>c[key]).filter(Boolean))].sort()}
function filterCatalog(){
  let list=cards.filter(c=>{
    if(catalogFilters.set!=="Todos"&&c.set!==catalogFilters.set)return false;
    if(catalogFilters.category!=="Todos"&&c.category!==catalogFilters.category)return false;
    if(catalogFilters.color!=="Todos"&&!(c.colors||[]).includes(catalogFilters.color))return false;
    if(catalogFilters.rarity!=="Todos"&&c.rarity!==catalogFilters.rarity)return false;
    if(catalogFilters.ownership==="Tengo"&&!qty(c.id))return false;
    if(catalogFilters.ownership==="Me faltan"&&qty(c.id))return false;
    if(query&&!norm([c.id,c.name,c.set,c.set_name,c.rarity,...(c.colors||[]),...(c.types||[])].join(" ")).includes(norm(query)))return false;
    return true;
  });
  return sortCards(list,catalogFilters.sort)
}
function filterCollection(){
  let list=cards.filter(c=>{
    if(!qty(c.id))return false;
    if(collectionFilters.set!=="Todos"&&c.set!==collectionFilters.set)return false;
    if(collectionFilters.category!=="Todos"&&c.category!==collectionFilters.category)return false;
    if(collectionFilters.rarity!=="Todos"&&c.rarity!==collectionFilters.rarity)return false;
    if(query&&!norm([c.id,c.name,c.set,c.set_name,c.rarity,...(c.colors||[])].join(" ")).includes(norm(query)))return false;
    return true;
  });
  return sortCards(list,collectionFilters.sort).reverse();
}
function selectHtml(id,values,value){
  return '<select class="field" data-filter="'+id+'">'+values.map(v=>'<option value="'+esc(v)+'" '+(v===value?"selected":"")+'>'+esc(v)+'</option>').join("")+'</select>';
}
function cardHtml(c,mode){
  const q=qty(c.id), p=prices[c.id], need=Math.max(0,4-q);
  return '<article class="card">'+(q?'<span class="ownedtag">Tengo ×'+q+'</span>':'<span class="missingtag">Me faltan</span>')+
    cardImage(c)+imageFallback(c.id)+
    '<div class="cardbody"><div class="name">'+esc(c.name)+'</div><div class="muted">'+esc(c.id)+' · '+esc(c.set||"")+' · '+esc(c.rarity||"—")+'</div>'+
    '<div class="chips">'+(c.colors||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div>'+
    '<div class="row"><b>'+(p?money(p):"Precio —")+'</b><span class="muted">'+(q<4?("Playset −"+need):"Playset ✓")+'</span></div>'+
    '<div class="quick"><button class="secondary" data-qty="'+esc(c.id)+'" data-delta="-1">−</button><div class="qty">'+q+'</div><button class="primary" data-qty="'+esc(c.id)+'" data-delta="1">+</button></div>'+
    '<button class="secondary btn" style="width:100%;margin-top:7px" data-detail="'+esc(c.id)+'">Ver carta</button>'+
    '</div></article>';
}
function catalogView(){
  const filtered=filterCatalog(), visible=filtered.slice(0,catalogLimit);
  return '<div class="wrap"><div class="hero"><div><h1>Catálogo</h1><p>'+cards.length.toLocaleString("es-ES")+' cartas · '+packs.length+' expansiones.</p></div></div>'+
    '<div class="stats"><div class="stat"><b>'+cards.length.toLocaleString("es-ES")+'</b><span>Cartas en catálogo</span></div><div class="stat"><b>'+Object.keys(collection).length+'</b><span>Cartas distintas que tengo</span></div><div class="stat"><b>'+Object.values(collection).reduce((a,b)=>a+Number(b||0),0)+'</b><span>Copias en colección</span></div><div class="stat"><b>'+Math.max(0,cards.filter(c=>qty(c.id)<4).reduce((a,c)=>a+(4-qty(c.id)),0)).toLocaleString("es-ES")+'</b><span>Copias para completar playsets</span></div></div>'+
    '<div class="toolbar"><input class="field" id="searchInput" value="'+esc(query)+'" placeholder="Busca carta, ID, expansión, personaje…">'+
    selectHtml("set",["Todos",...packs.map(p=>p.code)],catalogFilters.set)+
    selectHtml("category",["Todos","Leader","Character","Event","Stage","Don"],catalogFilters.category)+
    selectHtml("color",["Todos","Red","Green","Blue","Purple","Black","Yellow"],catalogFilters.color)+'</div>'+
    '<div class="toolbar2">'+selectHtml("rarity",["Todos",...uniqueVals("rarity")],catalogFilters.rarity)+
    selectHtml("ownership",["Todas","Tengo","Me faltan"],catalogFilters.ownership)+
    selectHtml("sort",["id","name","set","rarity","quantity","price"],catalogFilters.sort)+'</div>'+
    '<div class="small muted" style="margin-bottom:10px">'+filtered.length.toLocaleString("es-ES")+' resultados · mostrando '+Math.min(catalogLimit,filtered.length).toLocaleString("es-ES")+'</div>'+
    '<div class="grid">'+(visible.length?visible.map(c=>cardHtml(c,"catalog")).join(""):'<div class="empty">No hay cartas con esos filtros.</div>')+'</div>'+
    (catalogLimit<filtered.length?'<div style="display:flex;justify-content:center;margin:18px 0"><button class="primary btn" id="moreCatalog">Cargar 120 más</button></div>':"")+
    '</div>';
}
function collectionStats(){
  let distinct=0,copies=0,missing=0,playsetMissing=0,value=0,playsetCards=0;
  for(const c of cards){const q=qty(c.id);if(q){distinct++;copies+=q;value+=q*Number(prices[c.id]||0)}else missing++;if(q>=4)playsetCards++;playsetMissing+=Math.max(0,4-q)}
  return {distinct,copies,missing,playsetMissing,value,playsetCards};
}
function expansionStats(){
  return packs.map(p=>{
    const list=cards.filter(c=>c.set===p.code), owned=list.filter(c=>qty(c.id)>0), copies=owned.reduce((a,c)=>a+qty(c.id),0), missing=list.length-owned.length, ps=list.reduce((a,c)=>a+Math.max(0,4-qty(c.id)),0);
    return {p,total:list.length,owned:owned.length,missing,copies,ps,pct:list.length?Math.round(owned.length/list.length*100):0};
  });
}
function collectionView(){
  const s=collectionStats(), filtered=filterCollection(), visible=filtered.slice(0,collectionLimit);
  return '<div class="wrap"><div class="hero"><div><h1>Mi colección</h1><p>Filtra, ordena, importa y exporta toda tu colección.</p></div><div class="inline-actions"><button class="secondary btn" id="importCsvBtn">Importar CSV</button><button class="primary btn" id="exportCsvBtn">Exportar CSV</button><input id="csvFile" type="file" accept=".csv,text/csv" style="display:none"></div></div>'+
    '<div class="stats"><div class="stat"><b>'+s.distinct.toLocaleString("es-ES")+'</b><span>Cartas distintas</span></div><div class="stat"><b>'+s.copies.toLocaleString("es-ES")+'</b><span>Copias totales</span></div><div class="stat"><b>'+s.missing.toLocaleString("es-ES")+'</b><span>Cartas que me faltan</span></div><div class="stat"><b>'+s.playsetMissing.toLocaleString("es-ES")+'</b><span>Copias para todos los playsets</span></div></div>'+
    '<div class="section"><div class="sectionhead"><h2>Resumen de expansiones</h2><span class="pillnum">'+s.playsetCards.toLocaleString("es-ES")+' playsets completos</span></div><div class="expgrid">'+expansionStats().map(x=>'<div class="exp"><b>'+esc(x.p.code)+' · '+esc(x.p.name)+'</b><div class="small">'+x.owned+'/'+x.total+' cartas distintas · '+x.copies+' copias</div><div class="small muted">Me faltan '+x.missing+' cartas · '+x.ps+' copias para playsets</div><div class="progress"><i style="width:'+x.pct+'%"></i></div><div class="small muted" style="margin-top:4px">'+x.pct+'% completado</div></div>').join("")+'</div></div>'+
    '<div class="toolbar"><input class="field" id="searchInput" value="'+esc(query)+'" placeholder="Buscar en mi colección…">'+selectHtml("set",["Todos",...packs.map(p=>p.code)],collectionFilters.set)+selectHtml("category",["Todos","Leader","Character","Event","Stage","Don"],collectionFilters.category)+selectHtml("rarity",["Todos",...uniqueVals("rarity")],collectionFilters.rarity)+'</div>'+
    '<div class="toolbar2"><div></div><div></div>'+selectHtml("sort",["id","name","set","rarity","quantity","price","value"],collectionFilters.sort)+'</div>'+
    '<div class="small muted" style="margin-bottom:10px">'+filtered.length.toLocaleString("es-ES")+' cartas de mi colección</div>'+
    '<div class="grid">'+(visible.length?visible.map(c=>cardHtml(c,"collection")).join(""):'<div class="empty">No tienes cartas que coincidan con los filtros.</div>')+'</div>'+
    (collectionLimit<filtered.length?'<div style="display:flex;justify-content:center;margin:18px 0"><button class="primary btn" id="moreCollection">Cargar 120 más</button></div>':"")+
    '</div>';
}
function deckStats(d){
  let total=0,missing=0,cost=0,ownedValue=0;
  for(const [id,n] of Object.entries(d.cards||{})){const need=Number(n);const have=qty(id);const m=Math.max(0,need-have);total+=need;missing+=m;cost+=m*Number(prices[id]||0);ownedValue+=Math.min(need,have)*Number(prices[id]||0)}
  return {total,missing,cost,ownedValue};
}
function deckRows(d){
  return Object.entries(d.cards||{}).map(([id,n])=>{
    const c=cards.find(x=>x.id===id), have=qty(id), missing=Math.max(0,Number(n)-have);
    if(!c)return "";
    return '<div class="listrow">'+cardImage(c)+imageFallback(c.id)+'<div class="grow"><b>'+esc(c.id)+' · '+esc(c.name)+'</b><div class="muted">'+esc(c.set)+' · '+have+'/'+n+' en colección · '+(missing?'faltan '+missing:'completa')+'</div></div><button class="secondary btn" data-deckqty="'+esc(id)+'" data-delta="-1">−</button><strong>'+n+'</strong><button class="primary btn" data-deckqty="'+esc(id)+'" data-delta="1">+</button></div>';
  }).join("");
}
function deckEditor(d){
  const st=deckStats(d),leader=cards.find(c=>c.id===d.leader);
  return '<div class="section"><div class="sectionhead"><div><h2>'+esc(d.name)+'</h2><div class="muted">Líder: '+esc(leader?leader.name:(d.leader||"Sin líder"))+'</div></div><div class="inline-actions"><button class="secondary btn" id="shareDeck">Compartir</button><button class="danger btn" id="deleteDeck">Eliminar</button></div></div>'+
    '<div class="stats" style="margin-top:10px"><div class="stat"><b>'+st.total+'/50</b><span>Cartas no líder</span></div><div class="stat"><b>'+st.missing+'</b><span>Copias que me faltan</span></div><div class="stat"><b>'+money(st.cost)+'</b><span>Dinero para completar</span></div><div class="stat"><b>'+((leader?"Sí":"No"))+'</b><span>Líder seleccionado</span></div></div>'+
    '<div class="two"><button class="secondary btn" id="chooseLeader">Elegir / cambiar líder</button><button class="primary btn" id="renameDeck">Renombrar mazo</button></div>'+
    '<input class="field" id="deckSearch" placeholder="Añadir carta: nombre o ID…"><div id="deckResults"></div>'+
    '<div class="list" style="margin-top:10px">'+(st.total?deckRows(d):'<div class="empty">Mazo vacío. Busca una carta arriba.</div>')+'</div>'+
    '<div style="margin-top:12px" class="small muted">Las cartas muestran cuánto tienes en tu colección. El coste de completar usa el precio de referencia disponible; cuando no hay precio, esa carta no suma al importe.</div>'+
    '</div>';
}
function decksView(){
  const d=decks.find(x=>x.id===activeDeckId)||decks[0];
  if(d)activeDeckId=d.id;
  return '<div class="wrap"><div class="hero"><div><h1>Mazos</h1><p>Crea, ajusta y comparte tus mazos.</p></div><button class="primary btn" id="newDeck">+ Nuevo mazo</button></div>'+
    '<div class="section"><div class="list">'+(decks.length?decks.map(x=>{const st=deckStats(x);return '<div class="listrow"><div class="grow"><b>'+esc(x.name)+'</b><div class="muted">'+st.total+'/50 · '+st.missing+' copias faltantes · '+(x.leader||"sin líder")+'</div></div><button class="secondary btn" data-open-deck="'+esc(x.id)+'">Abrir</button><button class="secondary btn" data-share-deck="'+esc(x.id)+'">↗</button></div>'}).join(""):'<div class="empty">Todavía no tienes mazos.</div>')+'</div></div>'+
    (d?deckEditor(d):"")+'</div>';
}
function deckSearchResults(term){
  if(!term)return "";
  const list=cards.filter(c=>norm(c.id+" "+c.name).includes(norm(term))).slice(0,12);
  const d=decks.find(x=>x.id===activeDeckId)||decks[0];
  if(!d)return "";
  return list.map(c=>'<div class="listrow"><img class="thumb" src="'+esc(c.image||officialImage(c.id))+'" onerror="this.onerror=null;this.src=\''+officialImage(c.id)+'\'"><div class="grow"><b>'+esc(c.id)+' · '+esc(c.name)+'</b><div class="muted">'+esc(c.set)+' · Tengo '+qty(c.id)+'</div></div><button class="primary btn" data-add-deck="'+esc(c.id)+'">Añadir</button></div>').join("");
}
function authView(){
  return '<div class="modalback"><div class="modal"><div class="modaltop"><h2>Cuenta</h2><button class="close" id="closeAuth">×</button></div><p class="muted">Con cuenta: colección y mazos sincronizados. Sin cuenta: funciona localmente en este dispositivo.</p><input class="field" id="email" type="email" placeholder="Email"><br><br><input class="field" id="password" type="password" placeholder="Contraseña"><div class="two" style="margin-top:10px"><button class="primary btn" id="login">Entrar</button><button class="secondary btn" id="register">Crear cuenta</button></div>'+(user?'<button class="secondary btn" style="width:100%;margin-top:10px" id="logout">Cerrar sesión</button>':"")+'</div></div>';
}
function cardDetail(){
  const c=detail;
  if(!c)return "";
  const effect=String(c.effect||"Sin texto de efecto.").replace(/<br\s*\/?>/gi,"\\n").replace(/<[^>]+>/g,"");
  return '<div class="modalback"><div class="modal"><div class="modaltop"><div><h2 style="margin:0">'+esc(c.name)+'</h2><div class="muted">'+esc(c.id)+' · '+esc(c.set)+' · '+esc(c.rarity||"—")+'</div></div><button class="close" id="closeDetail">×</button></div><div class="detail" style="margin-top:14px"><div>'+cardImage(c)+imageFallback(c.id)+'</div><div><div class="chips">'+(c.colors||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div><p style="white-space:pre-wrap">'+esc(effect)+'</p><div class="small muted">Coste '+esc(c.cost??"—")+' · Poder '+esc(c.power??"—")+' · Counter '+esc(c.counter??"—")+'</div><div class="small muted" style="margin-top:8px">Tipo: '+esc((c.types||[]).join(", ")||"—")+'</div><div class="row" style="margin-top:12px"><b>En colección: ×'+qty(c.id)+'</b><b>'+(prices[c.id]?money(prices[c.id]):"Precio —")+'</b></div><div class="quick"><button class="secondary" data-qty="'+esc(c.id)+'" data-delta="-1">−</button><div class="qty">'+qty(c.id)+'</div><button class="primary" data-qty="'+esc(c.id)+'" data-delta="1">+</button></div><a class="secondary btn" style="display:block;text-align:center;margin-top:9px;text-decoration:none" target="_blank" rel="noopener" href="https://www.cardmarket.com/es/OnePiece/Products/Singles?mode=list&searchString='+encodeURIComponent(c.id)+'">Buscar en Cardmarket ↗</a></div></div></div></div>';
}
function sharedDeckView(){
  const d=sharedDeck, st=deckStats(d), leader=cards.find(c=>c.id===d.leader);
  return '<div class="wrap"><div class="hero"><div><h1>Mazo compartido</h1><p>'+esc(d.name)+' · '+st.total+'/50 cartas no líder.</p></div><button class="primary btn" id="importShared">Guardar una copia</button></div><div class="section"><div class="sectionhead"><div><h2>'+esc(d.name)+'</h2><div class="muted">Líder: '+esc(leader?leader.name:(d.leader||"Sin líder"))+'</div></div><div><b>'+money(st.cost)+'</b><div class="muted">para completar con mi colección</div></div></div></div><div class="list">'+Object.entries(d.cards||{}).map(([id,n])=>{const c=cards.find(x=>x.id===id),have=qty(id),missing=Math.max(0,Number(n)-have);return c?'<div class="listrow"><img class="thumb" src="'+esc(c.image||officialImage(id))+'" onerror="this.onerror=null;this.src=\''+officialImage(id)+'\'"><div class="grow"><b>'+esc(c.id)+' · '+esc(c.name)+'</b><div class="muted">Necesarias '+n+' · Tengo '+have+' · '+(missing?'Faltan '+missing:'Completa')+'</div></div></div>':""}).join("")+'</div></div>';
}
function render(){
  let main=sharedDeck?sharedDeckView():(tab==="catalog"?catalogView():tab==="collection"?collectionView():decksView());
  document.querySelector("#app").innerHTML='<div class="app"><header class="top"><div class="brand"><b>ONE PIECE</b><span>MiAlbumOnePiece</span></div><button class="account" id="accountBtn">'+(user?esc(user.email.split("@")[0]):"Cuenta")+'</button></header>'+main+
    '<nav class="nav"><button class="'+(tab==="catalog"&&!sharedDeck?"active":"")+'" data-tab="catalog">⌕<span>Catálogo</span></button><button class="'+(tab==="collection"&&!sharedDeck?"active":"")+'" data-tab="collection">▦<span>Colección</span></button><button class="'+(tab==="decks"&&!sharedDeck?"active":"")+'" data-tab="decks">♟<span>Mazos</span></button><button data-account>◉<span>Cuenta</span></button></nav>'+
    (authOpen?authView():"")+(detail?cardDetail():"")+(toast?'<div class="toast">'+esc(toast)+'</div>':"")+'</div>';
  wire();
}
function notice(msg){toast=msg;render();setTimeout(()=>{toast="";render()},1400)}
function changeCollection(id,delta){const n=Math.max(0,Math.min(99,qty(id)+delta));if(n===0)delete collection[id];else collection[id]=n;saveLocal();syncCollection();render()}
function addDeckCard(id,delta){
  const d=decks.find(x=>x.id===activeDeckId)||decks[0];if(!d)return;
  if(!d.cards)d.cards={};
  const c=cards.find(x=>x.id===id);if(!c)return;
  if(c.category==="Leader"){if(delta>0){d.leader=id;saveLocal();syncDeck(d);render()}return}
  const cur=Number(d.cards[id]||0), total=Object.values(d.cards).reduce((a,b)=>a+Number(b||0),0);
  const n=Math.max(0,Math.min(4,cur+delta));
  if(delta>0&&total>=50&&!cur)return;
  if(n===0)delete d.cards[id];else d.cards[id]=n;
  saveLocal();syncDeck(d);render();
}
function newDeck(){const name=prompt("Nombre del mazo","Mi mazo");if(!name)return;const d={id:crypto.randomUUID(),name:name.trim(),leader:"",cards:{}};decks.unshift(d);activeDeckId=d.id;saveLocal();syncDeck(d);render()}
function deleteDeck(){const d=decks.find(x=>x.id===activeDeckId);if(!d||!confirm("¿Eliminar "+d.name+"?"))return;decks=decks.filter(x=>x.id!==d.id);activeDeckId=decks[0]?.id||null;saveLocal();syncDeckDelete(d.id);render()}
function renameDeck(){const d=decks.find(x=>x.id===activeDeckId);if(!d)return;const n=prompt("Nuevo nombre",d.name);if(!n)return;d.name=n.trim();saveLocal();syncDeck(d);render()}
function chooseLeader(){const d=decks.find(x=>x.id===activeDeckId);if(!d)return;const q=prompt("Escribe el ID del líder (por ejemplo OP01-001)");if(!q)return;const c=cards.find(x=>x.id.toLowerCase()===q.trim().toLowerCase());if(!c||c.category!=="Leader"){alert("Ese ID no corresponde a un líder.");return}d.leader=c.id;saveLocal();syncDeck(d);render()}
function shareDeck(d){
  const payload={v:1,name:d.name,leader:d.leader||"",cards:d.cards||{}};
  const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\\+/g,"-").replace(/\\//g,"_").replace(/=+$/,"");
  const url=location.origin+location.pathname+"?deckshare="+encoded;
  if(navigator.share){navigator.share({title:"MiAlbumOnePiece · "+d.name,text:"Mazo de One Piece Card Game",url}).catch(()=>{})}
  else navigator.clipboard?.writeText(url).then(()=>notice("Enlace copiado")).catch(()=>prompt("Copia este enlace",url));
}
function loadShared(){
  const raw=new URLSearchParams(location.search).get("deckshare");if(!raw)return;
  try{let b=raw.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";sharedDeck=JSON.parse(decodeURIComponent(escape(atob(b))))}catch(e){sharedDeck=null}
}
function importShared(){
  if(!sharedDeck)return;
  const d={id:crypto.randomUUID(),name:sharedDeck.name+" (copia)",leader:sharedDeck.leader||"",cards:safeObj(sharedDeck.cards)};
  decks.unshift(d);activeDeckId=d.id;sharedDeck=null;history.replaceState({}, "", location.pathname);saveLocal();syncDeck(d);render();notice("Mazo guardado");
}
function exportCSV(){
  const rows=[["card_id","name","set","set_name","quantity"]];
  for(const c of cards){const q=qty(c.id);if(q>0)rows.push([c.id,c.name,c.set,c.set_name,q])}
  const csv="\\ufeff"+rows.map(r=>r.map(v=>{const s=String(v??"");return /[;"\\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(";")).join("\\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="MiAlbumOnePiece_coleccion.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function parseCSV(text){
  const first=text.split(/\\r?\\n/)[0]||"";const delim=first.includes(";")?";":",";
  const rows=[];let row=[],cell="",quote=false;
  for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(ch==='"'&&quote&&next==='"'){cell+='"';i++;continue}if(ch==='"'){quote=!quote;continue}if(ch===delim&&!quote){row.push(cell);cell="";continue}if((ch==="\\n"||ch==="\\r")&&!quote){if(ch==="\\r"&&next==="\\n")i++;row.push(cell);rows.push(row);row=[];cell="";continue}cell+=ch}
  if(cell.length||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
function importCSVText(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error("CSV vacío");
  const headers=rows[0].map(h=>norm(h).replace(/\\s+/g,"_"));
  const idI=Math.max(headers.indexOf("card_id"),headers.indexOf("id"),headers.indexOf("numero"),headers.indexOf("number"));
  const qtyI=Math.max(headers.indexOf("quantity"),headers.indexOf("cantidad"),headers.indexOf("qty"),headers.indexOf("copias"));
  if(idI<0||qtyI<0)throw new Error("El CSV debe tener columnas card_id/id y quantity/cantidad.");
  let imported=0;
  for(const r of rows.slice(1)){const id=String(r[idI]||"").trim();const n=Math.max(0,Math.min(99,parseInt(String(r[qtyI]||"0").replace(",", "."),10)||0));if(!id||!cards.some(c=>c.id===id))continue;if(n===0)delete collection[id];else collection[id]=n;imported++}
  saveLocal();syncCollection();render();notice(imported+" filas importadas");
}
function wire(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{sharedDeck=null;tab=b.dataset.tab;query="";catalogLimit=120;collectionLimit=120;render()});
  $("[data-account]")?.addEventListener("click",()=>{authOpen=true;render()});$("#accountBtn")?.addEventListener("click",()=>{authOpen=true;render()});
  $("#closeAuth")?.addEventListener("click",()=>{authOpen=false;render()});$("#closeDetail")?.addEventListener("click",()=>{detail=null;render()});
  $("#searchInput")?.addEventListener("input",e=>{query=e.target.value;catalogLimit=120;collectionLimit=120;render()});
  document.querySelectorAll("[data-filter]").forEach(x=>x.onchange=()=>{const key=x.dataset.filter;if(tab==="catalog")catalogFilters[key]=x.value;else collectionFilters[key]=x.value;catalogLimit=120;collectionLimit=120;render()});
  document.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>changeCollection(b.dataset.qty,Number(b.dataset.delta)));
  document.querySelectorAll("[data-detail]").forEach(b=>b.onclick=()=>{detail=cards.find(c=>c.id===b.dataset.detail)||null;render()});
  $("#moreCatalog")?.addEventListener("click",()=>{catalogLimit+=120;render()});$("#moreCollection")?.addEventListener("click",()=>{collectionLimit+=120;render()});
  $("#newDeck")?.addEventListener("click",newDeck);$("#deleteDeck")?.addEventListener("click",deleteDeck);$("#renameDeck")?.addEventListener("click",renameDeck);$("#chooseLeader")?.addEventListener("click",chooseLeader);
  document.querySelectorAll("[data-open-deck]").forEach(b=>b.onclick=()=>{activeDeckId=b.dataset.openDeck;render()});
  document.querySelectorAll("[data-share-deck]").forEach(b=>b.onclick=()=>{const d=decks.find(x=>x.id===b.dataset.shareDeck);if(d)shareDeck(d)});
  $("#shareDeck")?.addEventListener("click",()=>{const d=decks.find(x=>x.id===activeDeckId)||decks[0];if(d)shareDeck(d)});
  document.querySelectorAll("[data-deckqty]").forEach(b=>b.onclick=()=>addDeckCard(b.dataset.deckqty,Number(b.dataset.delta)));
  document.querySelectorAll("[data-add-deck]").forEach(b=>b.onclick=()=>addDeckCard(b.dataset.addDeck,1));
  $("#deckSearch")?.addEventListener("input",e=>{$("#deckResults").innerHTML=deckSearchResults(e.target.value)});
  $("#importShared")?.addEventListener("click",importShared);
  $("#exportCsvBtn")?.addEventListener("click",exportCSV);$("#importCsvBtn")?.addEventListener("click",()=>$("#csvFile").click());
  $("#csvFile")?.addEventListener("change",e=>{const f=e.target.files?.[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{importCSVText(String(fr.result||""))}catch(err){alert(err.message||"No se pudo importar el CSV")}};fr.readAsText(f,"utf-8")});
  $("#login")?.addEventListener("click",login);$("#register")?.addEventListener("click",register);$("#logout")?.addEventListener("click",logout);
}
async function fetchJson(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
  try{const r=await fetch(url,{cache:"no-store",signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}
}
async function initSupabase(){
  try{
    const m=await import("https://esm.sh/@supabase/supabase-js@2");
    sb=m.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const s=await sb.auth.getSession();user=s.data.session?.user||null;
    sb.auth.onAuthStateChange(()=>{loadCloud();render()});loadCloud();
  }catch(e){console.warn("Supabase no disponible",e)}
}
async function login(){
  try{if(!sb)throw new Error("La conexión de cuenta todavía está cargando.");const r=await sb.auth.signInWithPassword({email:$("#email").value,password:$("#password").value});if(r.error)throw r.error;user=r.data.user;authOpen=false;await loadCloud();render()}catch(e){alert(e.message)}
}
async function register(){
  try{if(!sb)throw new Error("La conexión de cuenta todavía está cargando.");const r=await sb.auth.signUp({email:$("#email").value,password:$("#password").value});if(r.error)throw r.error;alert("Cuenta creada. Revisa tu email si se solicita confirmación.")}catch(e){alert(e.message)}
}
async function logout(){await sb?.auth.signOut();user=null;render()}
async function loadCloud(){
  if(!sb||!user)return;
  try{
    const ci=await sb.from("collection_items").select("card_id,quantity").eq("user_id",user.id);
    if(ci.error)throw ci.error;collection={};(ci.data||[]).forEach(x=>collection[x.card_id]=Number(x.quantity||0));
    const ds=await sb.from("decks").select("id,name,leader_card_id,created_at").eq("user_id",user.id).order("created_at",{ascending:false});
    if(ds.error)throw ds.error;decks=[];
    for(const d of ds.data||[]){const dc=await sb.from("deck_cards").select("card_id,quantity").eq("deck_id",d.id);const map={};(dc.data||[]).forEach(x=>map[x.card_id]=Number(x.quantity||0));decks.push({id:d.id,name:d.name,leader:d.leader_card_id||"",cards:map})}
    if(decks.length&&!activeDeckId)activeDeckId=decks[0].id;saveLocal();render();
  }catch(e){console.warn("Cloud sync failed",e)}
}
async function syncCollection(){
  if(!sb||!user)return;
  try{
    const old=await sb.from("collection_items").select("card_id").eq("user_id",user.id);
    for(const r of old.data||[])if(!(r.card_id in collection))await sb.from("collection_items").delete().eq("user_id",user.id).eq("card_id",r.card_id);
    for(const [id,n] of Object.entries(collection))await sb.from("collection_items").upsert({user_id:user.id,card_id:id,quantity:Number(n),updated_at:new Date().toISOString()},{onConflict:"user_id,card_id"});
  }catch(e){console.warn(e)}
}
async function syncDeck(d){
  if(!sb||!user)return;
  try{
    await sb.from("decks").upsert({id:d.id,user_id:user.id,name:d.name,leader_card_id:d.leader||null,updated_at:new Date().toISOString()},{onConflict:"id"});
    await sb.from("deck_cards").delete().eq("deck_id",d.id);
    const rows=Object.entries(d.cards||{}).map(([card_id,quantity])=>({deck_id:d.id,card_id,quantity:Number(quantity)}));
    if(rows.length)await sb.from("deck_cards").insert(rows);
  }catch(e){console.warn(e)}
}
async function syncDeckDelete(id){if(!sb||!user)return;try{await sb.from("decks").delete().eq("id",id)}catch(e){console.warn(e)}}
async function loadPrices(){
  try{
    const ids=cards.map(c=>c.id).join(",");
    const r=await fetch("/api/cardmarket?ids="+encodeURIComponent(ids),{cache:"no-store"});if(!r.ok)return;
    const data=await r.json();prices=data.prices||{};render();
  }catch(e){console.warn("Precios no disponibles",e)}
}
async function loadCatalog(){
  try{
    const raw=await fetchJson(DATA+"/cards.json"), p=await fetchJson(DATA+"/packs.json");
    cards=(Array.isArray(raw)?raw:Object.values(raw)).map(c=>({...c,id:String(c.id||c.card_id||""),set:String(c.set||c.pack_id||""),set_name:String(c.set_name||c.setName||setName(c.set||""))})).filter(c=>c.id);
    packs=Array.isArray(p)?p:Object.values(p);
    if(cards.length<4500)throw new Error("Catálogo incompleto: "+cards.length);
    booted=true;render();setTimeout(loadPrices,900);
  }catch(e){
    console.error(e);document.querySelector("#app").innerHTML='<div class="empty"><h2>No se pudo cargar MiAlbumOnePiece</h2><p>'+esc(e.message||"Error cargando el catálogo")+'</p><button class="primary btn" onclick="location.reload()">Reintentar</button></div>';
  }
}
window.addEventListener("error",e=>{console.error(e.error||e.message);if(!booted)document.querySelector("#app").innerHTML='<div class="empty"><h2>Error iniciando MiAlbumOnePiece</h2><p>Se ha detectado un error de JavaScript.</p></div>'});
loadShared();render();loadCatalog();initSupabase();
</script>
