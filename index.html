        void window.OnePieceTools?.loadCloud?.();renderShell();
      },0));
      return state.sb;
    }catch(e){state.authReady=true;state.authError="No se pudo conectar con la cuenta: "+authMessage(e);console.warn("supabase",e);renderShell();return null}
  })();
  return supabaseInitPromise;
}


async function preparePublicDeckShare(deck){
  if(!state.user?.id||!state.sb)throw Error("Inicia sesión para crear un enlace público del mazo.");
  if(!deck?.id||deck?.draftCompetitive)throw Error("Guarda primero el mazo en tu cuenta.");
  const userId=state.user.id;
  // Existing decks are already in Supabase. Do not rewrite their saved cards
  // just to share a JPG; only wait for the initial save if it has not landed.
  const check=await state.sb.from("decks").select("id").eq("id",deck.id).eq("user_id",userId).maybeSingle();
  if(check.error)throw Error("No se pudo comprobar el mazo.");
  if(!check.data){
    const synced=await syncDeck(deck);
    if(!synced)throw Error("No se pudo guardar el mazo antes de compartirlo.");
  }
  if(state.user?.id!==userId)throw Error("La sesión ha cambiado.");
  const payload={name:String(deck.name||"Mi mazo").slice(0,120),description:String(deck.description||"").slice(0,2000),
    leader:deck.leader||"",cards:Object.fromEntries(Object.entries(deck.cards||{})
      .filter(([id,n])=>card(id)&&Number.isSafeInteger(Number(n))&&Number(n)>0).map(([id,n])=>[id,Number(n)]))};
  const existing=await state.sb.from("deck_shares").select("share_slug").eq("deck_id",deck.id).order("created_at",{ascending:true}).limit(1);
  if(existing.error)throw Error("No se pudo consultar el enlace del mazo.");
  if(state.user?.id!==userId)throw Error("La sesión ha cambiado.");
  let slug=existing.data?.[0]?.share_slug||"";
  if(slug){
    const saved=await state.sb.from("deck_shares").update({payload,updated_at:new Date().toISOString()})
      .eq("deck_id",deck.id).eq("share_slug",slug).select("share_slug");
    if(saved.error||!saved.data?.length)throw Error("No se pudo actualizar el enlace del mazo.");
  }else{
    slug=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");
    const saved=await state.sb.from("deck_shares").insert({deck_id:deck.id,share_slug:slug,payload}).select("share_slug").single();
    if(saved.error||!saved.data?.share_slug)throw Error("No se pudo publicar la lista de este mazo.");
  }
  if(state.user?.id!==userId)throw Error("La sesión ha cambiado.");
  return AUTH_SITE_URL+"/deck/"+slug;
}
window.preparePublicDeckShare=preparePublicDeckShare;

// The owner must explicitly opt in to make the exact card quantities public.
async function openCollectionShare(){
  if(!state.user?.id||!state.collectionReady||!state.sb)return notify("Inicia sesión y carga tu colección.");
  document.querySelector(".collection-share-modal")?.remove();
  const ownerId=state.user.id;
  const modal=document.createElement("div");modal.className="modalback collection-share-modal";
  modal.innerHTML='<div class="modal"><div class="sectionhead"><h2>Compartir mi colección</h2><button type="button" class="close" data-close-share aria-label="Cerrar">×</button></div>'+
    '<p class="small">Solo quien tenga el enlace verá tus cartas, impresiones y cantidades actuales. No podrá añadir, borrar ni cambiar nada. El enlace es revocable.</p>'+
    '<div id="collectionShareControls"><p class="notice">Consultando el estado del enlace…</p></div></div>';
  document.body.appendChild(modal);
  const close=()=>modal.remove();
  modal.querySelector("[data-close-share]").onclick=close;
  modal.addEventListener("click",e=>{if(e.target===modal)close()});
  const area=modal.querySelector("#collectionShareControls");
  const shareError=e=>{
    console.warn("No se pudo compartir la colección",e);
    const message=String(e?.message||e||"Error desconocido"),code=String(e?.code||"");
    if(code==="42P01"||code==="PGRST205"||/collection_share_links|schema cache|public_collection_snapshot/i.test(message)){
      return "Compartir colección todavía no está habilitado en la base de datos. Contacta con el administrador para activar los enlaces públicos.";
    }
    if(code==="42501"||/permission denied|row-level security/i.test(message)){
      return "Tu cuenta no tiene permiso para gestionar enlaces públicos. Contacta con el administrador.";
    }
    return message;
  };
  const showError=msg=>{
    if(!modal.isConnected)return;
    area.innerHTML='<p class="notice" role="alert">'+esc(msg)+'</p><button type="button" class="secondary btn" id="retryCollectionShare">Reintentar</button>';
    area.querySelector("#retryCollectionShare").addEventListener("click",refresh);
  };
  const setBusy=msg=>{if(modal.isConnected)area.innerHTML='<p class="notice">'+esc(msg)+'</p>'};
  const refresh=async()=>{
    if(state.user?.id!==ownerId)return close();
    try{
      const {data,error}=await state.sb.from("collection_share_links").select("share_slug").eq("user_id",ownerId).maybeSingle();
      if(error)throw error;
      if(!modal.isConnected||state.user?.id!==ownerId)return;
      if(!data){
        area.innerHTML='<p class="small">Tu colección es privada. Pulsa el botón para crear un enlace público de solo lectura.</p>'+
          '<button type="button" class="primary btn" id="enableCollectionSharing">Crear enlace público</button>';
        area.querySelector("#enableCollectionSharing").onclick=async()=>{
          if(!confirm("¿Permitir que cualquier persona con el enlace vea todas las cartas y cantidades de tu colección, incluidos cambios futuros?"))return;
          if(state.user?.id!==ownerId)return close();
          setBusy("Creando enlace…");
          try{
            const slug=Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,"0")).join("");
            const result=await state.sb.from("collection_share_links").insert({user_id:ownerId,share_slug:slug}).select("share_slug").single();
            if(result.error)throw result.error;
            await refresh();
          }catch(e){showError("No se pudo activar el enlace: "+shareError(e))}
        };
        return;
      }
      const url=AUTH_SITE_URL+"/collection/"+data.share_slug;
      area.innerHTML='<label class="filter-label" for="collectionPublicUrl">Enlace público (solo lectura)</label>'+
        '<input id="collectionPublicUrl" class="field" readonly value="'+esc(url)+'" style="width:100%;margin:8px 0">'+
        '<div class="inline-actions"><button type="button" class="primary btn" id="copyCollectionUrl">Copiar enlace</button>'+
        '<button type="button" class="secondary btn" id="sendCollectionUrl">Compartir</button>'+
        '<button type="button" class="danger btn" id="revokeCollectionUrl">Desactivar enlace</button></div>'+
        '<p class="small" style="margin-top:10px">La vista pública reflejará los cambios de tu colección. Desactivarlo hace que ese enlace deje de funcionar.</p>';
      const copyCollectionUrl=async()=>{
        try{
          if(!navigator.clipboard?.writeText)throw Error("Clipboard API unavailable");
          await navigator.clipboard.writeText(url);
          notify("Enlace copiado");
        }catch{
          const input=area.querySelector("#collectionPublicUrl");
          if(!input)return;
          input.focus();input.select();
          let copied=false;
          try{copied=document.execCommand?.("copy")===true}catch{}
          notify(copied?"Enlace copiado":"Enlace seleccionado. Cópialo manualmente.");
        }
      };
      area.querySelector("#copyCollectionUrl").onclick=copyCollectionUrl;
      area.querySelector("#sendCollectionUrl").onclick=async()=>{
        if(navigator.share){
          try{await navigator.share({title:"Mi colección One Piece",url});return}
          catch(e){if(e?.name==="AbortError")return;console.warn("Compartir enlace",e)}
        }
        await copyCollectionUrl();
      };
      area.querySelector("#revokeCollectionUrl").onclick=async()=>{
        if(!confirm("¿Desactivar el enlace público? Quienes lo tengan dejarán de ver tu colección."))return;
        if(state.user?.id!==ownerId)return close();
        setBusy("Desactivando enlace…");
        try{
          const removed=await state.sb.from("collection_share_links").delete()
            .eq("user_id",ownerId).eq("share_slug",data.share_slug).select("share_slug");
          if(removed.error||!removed.data?.length)throw Error("No se pudo confirmar la desactivación");
          await refresh();
        }catch(e){showError("No se pudo desactivar el enlace: "+shareError(e))}
      };
    }catch(e){showError("No se pudo consultar el enlace: "+shareError(e))}
  };
  await refresh();
}

function bindPublicCollection(){
  const data=state.publicCollection;if(!data||data.error)return;
  const search=$("#publicCollectionSearch"),sets=$("#publicCollectionSet"),sort=$("#publicCollectionSort"),dir=$("#publicCollectionDir");
  const cardsById=new Map(state.cards.map(c=>[c.id,c]));
  const rows=data.cards.map(item=>({id:item.id,quantity:item.quantity,c:cardsById.get(item.id)}));
  const distinct=rows.length,copies=rows.reduce((sum,x)=>sum+x.quantity,0);
  $("#publicCollectionSummary").innerHTML='<div class="stat"><b>'+distinct.toLocaleString("es-ES")+'</b><span>Versiones distintas</span></div>'+
    '<div class="stat"><b>'+copies.toLocaleString("es-ES")+'</b><span>Copias totales</span></div>';
  const packs=[...new Set(rows.map(x=>x.c?.set||"").filter(Boolean))].sort((a,b)=>a.localeCompare(b,"es",{numeric:true}));
  sets.innerHTML='<option value="">Todas las expansiones</option>'+packs.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join("");
  let page=1,term="";
  const render=()=>{
    const q=norm(term.trim()),selected=sets.value;
    const visible=rows.filter(row=>(!selected||row.c?.set===selected)&&
      (!q||norm([row.id,row.c?.name,row.c?.set].join(" ")).includes(q)));
    const attr=row=>sort.value==="quantity"?row.quantity:sort.value==="price"?(row.c?priceOf(row.c):null):sort.value==="name"?(row.c?.name||row.id):row.id;
    visible.sort((a,b)=>{
      const x=attr(a),y=attr(b),missingX=x==null,missingY=y==null;
      if(missingX!==missingY)return missingX?1:-1;
      const result=typeof x==="number"&&typeof y==="number"?x-y:String(x??"").localeCompare(String(y??""),"es",{numeric:true,sensitivity:"base"});
      return result*(dir.value==="desc"?-1:1)||a.id.localeCompare(b.id,"es",{numeric:true});
    });
    const maxPages=Math.max(1,Math.ceil(visible.length/PAGE));page=Math.min(page,maxPages);
    const current=visible.slice((page-1)*PAGE,page*PAGE);
    $("#publicCollectionResults").innerHTML='<p class="notice">'+visible.length.toLocaleString("es-ES")+' versiones encontradas · no editable</p>'+
      '<div class="grid">'+current.map(item=>'<article class="card">'+
         (item.c?cardImg(item.c,"cardimg"):'<div class="cardimg" style="display:grid;place-items:center">Sin imagen</div>')+
         '<div class="cardbody"><div class="name">'+esc(item.c?.name||item.id)+'</div>'+
         '<div class="small">'+esc(item.id)+' · '+esc(item.c?.set||"Impresión no catalogada")+'</div>'+
         '<div class="small"><b>×'+item.quantity+' copias</b> · '+(item.c&&priceOf(item.c)!==null?money(priceOf(item.c))+" por copia":"Precio —")+'</div></div></article>').join("")+'</div>'+
      (maxPages>1?'<div class="inline-actions" style="justify-content:center;margin:15px 0">'+
        '<button type="button" class="secondary btn" id="publicPrevPage" '+(page===1?"disabled":"")+'>← Anterior</button>'+
        '<span class="small" style="align-self:center">Página '+page+' / '+maxPages+'</span>'+
        '<button type="button" class="secondary btn" id="publicNextPage" '+(page===maxPages?"disabled":"")+'>Siguiente →</button></div>':"");
    $("#publicPrevPage")?.addEventListener("click",()=>{page--;render();window.scrollTo({top:0,behavior:"smooth"})});
    $("#publicNextPage")?.addEventListener("click",()=>{page++;render();window.scrollTo({top:0,behavior:"smooth"})});
  };
  search.addEventListener("input",()=>{term=search.value;page=1;render()});
  [sets,sort,dir].forEach(input=>input.addEventListener("change",()=>{page=1;render()}));
  render();
}

async function loadShared(){
  const collectionPath=location.pathname.match(/^\/collection\/([^/]+)\/?$/);
  if(collectionPath){
    state.publicCollection={slug:collectionPath[1],cards:[],error:true};
    try{
      await loadSupabaseConfig();
      if(!/^[a-f0-9]{32}$/.test(collectionPath[1]))return;
      const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/public_collection_snapshot",{
        method:"POST",headers:{apikey:SUPABASE_KEY,"content-type":"application/json"},
        body:JSON.stringify({p_slug:collectionPath[1]}),cache:"no-store"
      });
      if(!r.ok)throw Error("HTTP "+r.status);
      const snapshot=await r.json();
      if(!snapshot||!Array.isArray(snapshot.cards))return;
      const cards=snapshot.cards.filter(x=>x&&typeof x.id==="string"&&x.id.length<=128&&
        Number.isSafeInteger(Number(x.quantity))&&Number(x.quantity)>0&&Number(x.quantity)<=99)
        .map(x=>({id:x.id,quantity:Number(x.quantity)})).slice(0,20000);
      state.publicCollection={slug:collectionPath[1],cards,error:false};
    }catch(e){console.warn("No se pudo abrir la colección compartida",e)}
    return;
  }
  const slug=location.pathname.match(/^\/deck\/([^/]+)\/?$/)?.[1]||new URLSearchParams(location.search).get("deckshare");
  if(!slug)return;
  try{
    await loadSupabaseConfig();
    let p;
    if(location.pathname.startsWith("/deck/")){
      if(!/^[a-f0-9]{32}$/.test(slug))return;
      const url=SUPABASE_URL+"/rest/v1/deck_shares?select=payload&share_slug=eq."+encodeURIComponent(slug)+"&limit=1";
      const r=await fetch(url,{headers:{apikey:SUPABASE_KEY},cache:"no-store"});
      if(!r.ok)throw Error("HTTP "+r.status);
      const rows=await r.json();p=rows?.[0]?.payload;
    }else{
      let b=slug.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";
      p=JSON.parse(decodeURIComponent(escape(atob(b))));
    }
    if(p&&p.cards&&typeof p.cards==="object"&&!Array.isArray(p.cards)){
      const fake={id:"shared",name:String(p.name||"Mazo compartido").slice(0,120),
        leader:String(p.leader||"").slice(0,128),cards:p.cards,description:String(p.description||"").slice(0,2000)};
      state.tab="decks";state.sharedDeck=fake;state.shared=true;
    }
  }catch(e){console.warn("No se pudo abrir el mazo compartido",e)}
}

function csvEscape(v){
  const s=String(v??"");
  return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function csvDownload(rows,filename){
  const csv="\uFEFF"+rows.map(r=>r.map(csvEscape).join(",")).join("\r\n")+"\r\n";
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function csvRarity(c){
  const r=String(c?.rarity||"").trim();
  return r==="Leader"?"L":r==="Common"?"C":r==="Uncommon"?"UC":r==="Rare"?"R":r==="Super Rare"?"SR":r==="Secret Rare"?"SEC":r==="Special"?"SP":r||"";
}
function csvVariant(c){
  const saved=c?.importVariantId?c:(state.importedCards?.[c?.id]||{});
  const kind=String(saved?.importVariantKind||variantKindOf(c)||"base").toLowerCase();
  const printSet=String(saved?.importPrintSet||printSetOf(c)||"").trim();
  if(saved?.importVariantId){
    return {variant_id:String(saved.importVariantId),variant_kind:kind,print_set:printSet};
  }
  const id=String(c?.id||"");
  if(kind==="base")return {variant_id:id+"_base",variant_kind:"base",print_set:printSet};
  return {variant_id:id,variant_kind:kind,print_set:printSet};
}
function exportCollectionCSV(){
  if(!collectionRequireLogin())return;
  const headers=["card_id","name","set_code","set_name","rarity","variant_id","variant_kind","print_set","condition","language","quantity","unit_price","total_price","currency","price_source"];
  const rows=[headers];
  for(const c of state.cards){
    const q=qty(c.id);if(q<=0)continue;
    const variant=csvVariant(c),price=priceOf(c),unit=price===null?"":Number(price.toFixed(2));
    rows.push([
      baseId(c.id),c.name,c.set,c.set_name||setName(c.set),csvRarity(c),variant.variant_id,variant.variant_kind,variant.print_set,
      "NM","EN",q,unit,unit===""?"":Number((unit*q).toFixed(2)),"EUR","Cardmarket"
    ]);
  }
  csvDownload(rows,"mialbumonepiece-collection-"+new Date().toISOString().slice(0,10)+".csv");
  notify("CSV exportado");
}
function parseCSV(text){
  text=String(text??"").replace(/^(?:\uFEFF|ï»¿)/,"");
  const rows=[];let row=[],cell="",quote=false;
  const firstLine=(text.split(/\r?\n/,1)[0]||"").replace(/^(?:\uFEFF|ï»¿)/,"");
  const delim=firstLine.includes(",")?",":";";
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(ch==='"'&&quote&&nx==='"'){cell+='"';i++;continue}
    if(ch==='"'){quote=!quote;continue}
    if(ch===delim&&!quote){row.push(cell);cell="";continue}
    if((ch==="\n"||ch==="\r")&&!quote){
      if(ch==="\r"&&nx==="\n")i++;
      row.push(cell);rows.push(row);row=[];cell="";continue;
    }
    cell+=ch;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
function csvRarityToApp(value){
  const r=String(value||"").trim().toUpperCase();
  return r==="L"?"Leader":r==="C"?"Common":r==="UC"?"Uncommon":r==="R"?"Rare":r==="SR"?"Super Rare":r==="SEC"?"Secret Rare":r==="SP"?"Special":String(value||"");
}
function internalSetCode(value){
  const raw=String(value||"").trim().toUpperCase().replace(/[\s_-]+/g,"");
  const m=raw.match(/^(OP|EB|ST|PRB)(\d{2})$/);
  return m?m[1]+"-"+m[2]:raw||"P";
}
function normalizeCSVHeader(value){
  return norm(String(value||"").replace(/^(?:\uFEFF|ï»¿)/,"")).replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
}
function printSetCodeFromText(value){
  const raw=String(value||"").trim();
  if(!raw)return "";
  const upper=raw.toUpperCase();
  const bracket=[...upper.matchAll(/\[((?:OP|EB|ST|PRB)-?\d{2})\]/g)];
  if(bracket.length)return normalizePrintSet(bracket[bracket.length-1][1]);
  const direct=upper.match(/\b(PRB|OP|EB|ST)[-_\s]?(\d{2})\b/);
  if(direct)return normalizePrintSet(direct[1]+direct[2]);
  if(/PROMOTION\s*CARD|\bPROMO(?:TION)?\b/.test(upper)||upper==="P")return "P";
  return "";
}
function csvSetNameKey(value){
  return norm(value).replace(/[^a-z0-9]+/g,"");
}
function marketExpansionKey(value){
  return norm(value)
    .replace(/\b(?:op|eb|st|prb)\s*0*\d+\b/g," ")
    .replace(/\b(?:starter deck|ultra deck|ultimate deck|extra booster|booster pack|premium booster)\b/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function marketCollectionMatchesSet(collection,wantedSet){
  const wanted=normalizePrintSet(wantedSet);
  if(!wanted)return false;
  if(normalizePrintSet(collection?.setCode)===wanted)return true;

  const target=marketExpansionKey(collection?.expansion);
  if(!target)return false;
  const names=state.packs
    .filter(p=>normalizePrintSet(p?.code)===wanted)
    .map(p=>marketExpansionKey(p?.name))
    .filter(Boolean);
  return names.some(name=>name===target||name.includes(target)||target.includes(name));
}
function exactMarketSetOf(c){
  const meta=directMarketMeta(c);
  const productId=Number(meta?.cardmarketId);
  if(!Number.isFinite(productId))return "";
  const exact=(meta?.collections||[]).find(x=>
    Number(x?.cardmarketId)===productId&&normalizePrintSet(x?.setCode)
  );
  return normalizePrintSet(exact?.setCode);
}
function catalogPrintSetOf(c){
  const imported=normalizePrintSet(c?.importPrintSet);
  if(imported)return imported;

  const sourceCode=printSetCodeFromText(c?.source_set)||normalizePrintSet(c?.source_set);
  if(sourceCode&&sourceCode!=="LIMITEDPRODUCTCARD"&&sourceCode!=="FAMILYDECKSET")return sourceCode;

  // El nombre exacto de la impresión/producto es más específico que el número lógico.
  const nameCode=printSetCodeFromText(c?.set_name);
  if(nameCode==="P")return "P";

  // Para casos como EB04 dentro de OP14, usar el set del MISMO producto
  // Cardmarket. No usar toda la lista collections: contiene otras reimpresiones.
  const exactMarketSet=exactMarketSetOf(c);
  if(exactMarketSet)return exactMarketSet;
  if(nameCode)return nameCode;

  const metaSet=normalizePrintSet(directMarketMeta(c)?.printSet);
  if(metaSet)return metaSet;
  return variantKindOf(c)==="base"
    ?(printSetCodeFromText(c?.set)||normalizePrintSet(c?.set))
    :"";
}
function csvPrintSetMatches(c,value){
  const raw=String(value||"").trim();
  if(!raw)return false;
  const wantedCode=printSetCodeFromText(raw)||normalizePrintSet(raw);
  const candidateCode=catalogPrintSetOf(c);
  if(wantedCode&&candidateCode&&wantedCode===candidateCode)return true;

  // Solo comparar la identidad propia de esta impresión. La lista histórica
  // collections nunca debe convertir otra versión de la carta en candidata.
  const wantedName=csvSetNameKey(raw),candidateName=csvSetNameKey(c?.set_name);
  return wantedName.length>=5&&candidateName.includes(wantedName);
}
function importMarketSource(logicalId,kind,printSet,rawVariant=""){
  const logical=String(logicalId||"").trim().toUpperCase();
  const wantedKind=String(kind||"").trim().toLowerCase()||"base";
  const wantedSet=String(printSet||"").trim();
  if(!logical||!wantedSet)return null;

  const candidates=state.cards.filter(c=>
    !c?.syntheticImport&&
    norm(baseId(c?.id))===norm(logical)&&
    variantKindOf(c)===wantedKind&&
    csvPrintSetMatches(c,wantedSet)
  );
  const normalizedVariant=String(rawVariant||"").trim().replace(/_base$/i,"");
  const exact=candidates.find(c=>norm(c.id)===norm(normalizedVariant));
  if(exact)return exact;

  // If the CSV variant suffix does not identify an exact catalog printing,
  // do not silently replace it with another printing just because the logical
  // card, kind and set look similar. Keep it synthetic and preserve variant_id.
  if(normalizedVariant)return null;
  if(candidates.length===1)return candidates[0];

  return null;
}
function importedSourceCard(c){
  if(!c?.syntheticImport&&!c?.importVariantId)return null;
  const wantedSet=String(c?.importPrintSet||"").trim();
  const explicit=String(c?.importResolvedCardId||"").trim();
  if(explicit){
    const source=state.cards.find(x=>!x?.syntheticImport&&norm(x.id)===norm(explicit));
    if(source&&(!wantedSet||csvPrintSetMatches(source,wantedSet)))return source;
  }
  return importMarketSource(
    baseId(c?.id||c?.importVariantId),
    c?.importVariantKind||"base",
    wantedSet,
    c?.importVariantId||""
  );
}
function resolveCSVPrint(logicalId,rawVariant,kind,printSet){
  const logical=String(logicalId||"").trim().toUpperCase();
  const wantedKind=String(kind||"").trim().toLowerCase()||"base";
  const wantedSet=String(printSet||"").trim();
  const normalizedVariant=String(rawVariant||"").trim().replace(/_base$/i,"");
  const candidates=state.cards.filter(c=>norm(baseId(c.id))===norm(logical));
  const compatible=candidates.filter(c=>variantKindOf(c)===wantedKind);

  // variant_id is authoritative. If that exact catalog ID exists, import it.
  // print_set is useful metadata/disambiguation, but must never turn a supplied
  // variant_id into a synthetic/wrong card because catalog set metadata differs.
  const exact=compatible.find(c=>norm(c.id)===norm(normalizedVariant));
  if(exact)return exact;

  // Only when the CSV does not provide a usable variant suffix may print_set
  // disambiguate a single catalog printing.
  if(wantedSet&&!/_((?:p|r|c)\d+)$/i.test(String(rawVariant||""))){
    const bySet=compatible.filter(c=>csvPrintSetMatches(c,wantedSet));
    if(bySet.length===1)return bySet[0];
  }

  if(wantedKind==="base")return candidates.find(c=>norm(c.id)===norm(logical))||null;
  return null;
}
function syntheticCSVCard(row,logicalId,variantId,kind,printSet){
  const logical=String(logicalId||"").trim().toUpperCase();
  const originalVariant=String(variantId||"").trim()||logical+"_base";
  let id=originalVariant.replace(/_base$/i,"")||logical;
  const base=state.cards.find(c=>norm(c.id)===norm(logical))||state.cards.find(c=>norm(baseId(c.id))===norm(logical))||null;
  const wantedSet=normalizePrintSet(printSet);
  const marketSource=importMarketSource(logical,kind,printSet,originalVariant);

  // Una misma carta base puede existir en otra expansión con el mismo variant_id.
  // Usamos una clave interna distinta para no mezclar cantidades, pero el
  // variant_id original del CSV se conserva intacto para la siguiente exportación.
  const existing=state.cards.find(c=>norm(c.id)===norm(id));
  if(existing&&wantedSet&&!csvPrintSetMatches(existing,printSet)){
    id=logical+"__csv_"+wantedSet.toLowerCase()+"_"+String(kind||"base").toLowerCase();
  }

  const setCode=printSet?internalSetCode(printSet):String(base?.set||internalSetCode(row.set_code||logical.split("-")[0]));
  return {
    ...(base||{}),
    id,
    number:logical,
    name:String(row.name||base?.name||logical),
    set:setCode,
    set_name:String(printSet||row.set_name||base?.set_name||setCode),
    rarity:csvRarityToApp(row.rarity||base?.rarity||""),
    category:base?.category||"Character",
    colors:Array.isArray(base?.colors)?base.colors:[],
    attributes:Array.isArray(base?.attributes)?base.attributes:[],
    types:Array.isArray(base?.types)?base.types:[],
    image:(()=>{
      const visualId=originalVariant.replace(/_base$/i,"")||logical;
      return "https://asia-en.onepiece-cardgame.com/images/cardlist/card/"+encodeURIComponent(visualId)+".png";
    })(),
    isParallel:kind==="parallel",
    syntheticImport:true,
    importVariantId:originalVariant,
    importPrintSet:String(printSet||""),
    importVariantKind:String(kind||"base"),
    importResolvedCardId:String(marketSource?.id||"")
  };
}
async function previewImport(text){
  if(!collectionRequireLogin())return;
  try{
    const rows=parseCSV(text);
    if(rows.length<2)throw Error("CSV vacío: no se encontraron filas de datos.");
    const h=rows[0].map(normalizeCSVHeader);
    const aliases={
      card_id:["card_id","id","numero","number"],
      variant_id:["variant_id","version_id","variant","version"],
      variant_kind:["variant_kind","version_kind","kind"],
      print_set:["print_set","printing_set","reprint_set"],
      card_set:["card_set","cardset","card_set_name"],
      unit_price:["unit_price","price","precio"],
      name:["name","nombre"],
      set_code:["set_code","set"],
      set_name:["set_name","expansion"],
      rarity:["rarity","rareza"],
      quantity:["quantity","cantidad","qty","copias"]
    };
    const findIndex=names=>names.map(n=>h.indexOf(n)).find(i=>i>=0);
    const idx={};for(const [k,names] of Object.entries(aliases))idx[k]=findIndex(names);
    if(idx.card_id===undefined||idx.quantity===undefined)throw Error("El CSV debe contener las columnas card_id y quantity.");

    const imported=new Map(),unknown=[],created={},importMeta={},resolvedByPrintSet=[];
    for(const r of rows.slice(1)){
      const get=k=>idx[k]===undefined?"":String(r[idx[k]]??"").trim();
      const logicalId=get("card_id").toUpperCase();
      if(!logicalId)continue;
      const rawVariant=get("variant_id")||logicalId+"_base";
      const kind=(get("variant_kind")||(/_r\d+$/i.test(rawVariant)?"reprint":/_(?:p|c)\d+$/i.test(rawVariant)?"parallel":"base")).toLowerCase();
      const printSet=get("print_set")||get("card_set");
      const rawQty=get("quantity").replace(",",".");
      const n=Number(rawQty);
      const q=Number.isFinite(n)?Math.max(0,Math.min(99,Math.round(n))):NaN;
      if(!Number.isFinite(q)){unknown.push(logicalId+" (cantidad no válida)");continue}

      let match=resolveCSVPrint(logicalId,rawVariant,kind,printSet);
      if(match&&printSet&&norm(match.id)!==norm(rawVariant.replace(/_base$/i,"")))resolvedByPrintSet.push(logicalId+" → "+match.id);
      const unitPriceRaw=Number(get("unit_price").replace(",","."));
      const unitPrice=Number.isFinite(unitPriceRaw)&&unitPriceRaw>0?unitPriceRaw:null;
      if(!match){
        const row={name:get("name"),set_code:get("set_code"),set_name:get("set_name"),rarity:get("rarity"),unit_price:get("unit_price")};
        match=syntheticCSVCard(row,logicalId,rawVariant,kind,printSet);
        created[match.id]=match;
      }else if(unitPrice!==null){
        // Guardar el precio de la fila solo como respaldo. No modifica el
        // catálogo ni sustituye el precio dinámico cuando éste existe.
        importMeta[match.id]={
          id:match.id,
          importVariantId:rawVariant,
          importVariantKind:kind,
          importPrintSet:String(printSet||""),
          importUnitPrice:unitPrice,
          metadataOnly:true
        };
      }
      imported.set(match.id,(imported.get(match.id)||0)+q);
    }

    const sum=[...imported.values()].reduce((a,x)=>a+x,0);
    const logicalCount=new Set([...imported.keys()].map(baseId)).size;
    const createdCount=Object.keys(created).length;
    const oldOwned=state.owned||{};
    const additions=[...imported].filter(([id,q])=>q>0&&!oldOwned[id]).length;
    const updates=[...imported].filter(([id,q])=>q>0&&oldOwned[id]&&Number(oldOwned[id])!==q).length;
    const removals=Object.keys(oldOwned).filter(id=>Number(oldOwned[id])>0&&!(imported.get(id)>0)).length;
    const msg="Cambios respecto a tu colección: "+additions+" versiones añadidas, "+updates+" cantidades modificadas y "+removals+" versiones eliminadas.\\n"+"Filas: "+(rows.length-1)+
      " · versiones: "+imported.size+
      " · cartas: "+logicalCount+
      " · "+sum+" copias"+
      (createdCount?"\nVersiones añadidas desde el CSV: "+createdCount:"")+
      (resolvedByPrintSet.length?"\nVersiones resueltas por expansión de impresión: "+resolvedByPrintSet.length:"")+
      (unknown.length?"\nNo importables: "+unknown.slice(0,15).join(", ")+(unknown.length>15?" …":""):"")+
      "\n\nCada cantidad se guardará en su impresión exacta. No se sustituirá una reimpresión/paralela por la carta base.";
    if(confirm(msg+"\n\nAceptar = importar. Cancelar = no cambiar nada.")){
      const ok=await replaceCollectionFromCSV(imported);
      if(!ok)return;
      state.importedCards={...state.importedCards,...created,...importMeta};
      saveLocal();
      prepareCatalog(state.cards.filter(c=>!c.syntheticImport),state.packs);
      state.collection.page=1;
      renderShell();
      notify("Importadas en Supabase "+sum+" copias en "+imported.size+" versiones");
    }
  }catch(e){alert(e.message||"CSV no válido")}
}
const REMOTE_ALLSETS="https://raw.githubusercontent.com/hugoprudente/optcgjson/main/output/AllSets.json";
async function loadCatalogData(){
  // Prefer the repository's committed catalog. The GitHub Action keeps it current,
  // and this prevents a temporary upstream format/network change from blanking the app.
  try{
    const [localCards,localPacks]=await Promise.all([
      fetchJson(DATA+"cards.json",20000),
      fetchJson(DATA+"packs.json",20000)
    ]);
    const cards=(Array.isArray(localCards)?localCards:Object.values(localCards||{})).filter(c=>c?.id&&!isJapaneseCatalogCard(c));
    const packs=Array.isArray(localPacks)?localPacks:Object.values(localPacks||{});
    if(cards.length&&packs.length)return {cards,packs,remote:false};
  }catch(e){console.warn("local catalog",e)}
  // Last-resort upstream fallback.
  try{
    const remoteAllSets=await fetchJson(REMOTE_ALLSETS,30000);
    const cards=[];const packs=[];const seen=new Set();
    const normalizeSetCode=raw=>{const v=String(raw||"").trim().toUpperCase();if(v==="OP14")return "OP14-EB04";if(v==="OP15")return "OP15-EB04";const m=v.match(/^(OP|EB|ST|PRB)-?(\d{2})$/i);return m?m[1].toUpperCase()+"-"+m[2]:v};
    const root=remoteAllSets?.data&&typeof remoteAllSets.data==="object"&&!Array.isArray(remoteAllSets.data)?remoteAllSets.data:(remoteAllSets||{});
    for(const [key,payload] of Object.entries(root)){
      const d=payload?.data||payload;
      if(!d||!Array.isArray(d.cards))continue;
      const setCode=normalizeSetCode(d.code||key),setName=String(d.name||"").trim(),setCards=d.cards;
      packs.push({code:setCode,name:setName,cardCount:setCards.length});
      for(const c of setCards){
        const id=String(c?.id||"").trim();if(!id||seen.has(id))continue;
        if(Array.isArray(c.languages)&&c.languages.length&&!c.languages.some(x=>/^English$/i.test(String(x))))continue;
        seen.add(id);
        const m=id.toUpperCase().match(/^(OP|EB|ST|PRB)(\d{2})-/i),cardSet=m?normalizeSetCode(m[1]+m[2]):setCode;
        cards.push({id,set:cardSet,set_name:setName,name:String(c?.name||"").trim(),rarity:c?.rarity==="L"?"Leader":String(c?.rarity||"").trim(),category:c?.cardClass==="LEADER"?"Leader":c?.cardClass==="EVENT"?"Event":c?.cardClass==="STAGE"?"Stage":c?.cardClass==="DON"?"Don":"Character",colors:Array.isArray(c?.color)?c.color:[],cost:c?.cost==null?null:Number(c.cost),power:c?.power==null?null:Number(c.power),counter:c?.counter==null?null:Number(c.counter),block:c?.blockIcon==null?null:Number(c.blockIcon)||c.blockIcon,attributes:Array.isArray(c?.attribute)?c.attribute:[],types:Array.isArray(c?.feature)?c.feature:[],effect:c?.effect||"",trigger:c?.trigger||null,image:c?.imageUrl||"",isParallel:!!c?.isParallel});
      }
    }
    if(cards.length&&packs.length)return {cards,packs,remote:true};
  }catch(e){console.warn("remote catalog",e)}
  throw Error("No se pudo cargar el catálogo.");
}
async function boot(){
  const savedReloadView=readReloadView();
  reloadViewPending=!!(savedReloadView&&RELOAD_ALLOWED_TABS.has(savedReloadView.view?.tab));
  if(reloadViewPending)state.tab=savedReloadView.view.tab;
  window.addEventListener("pagehide",snapshotReloadView);
  window.addEventListener("beforeunload",snapshotReloadView);
  loadLocal();
  if(location.pathname==="/deck-completion")state.tab="deck-completion";
  loadCachedPrices();
  if(reloadViewPending)showReloadPlaceholder();
  else renderShell();
  try{
    // Load catalog and market data together. On a true first visit there is no
    // local price cache, so the first card grid must not render until prices are
    // available (or the market feed has actually failed).
    const catalogPromise=loadCatalogData();
    const marketPromise=loadMarketPrices().catch(e=>{console.warn("market prices",e);return null});
    const data=await catalogPromise;
    prepareCatalog(data.cards,data.packs);
    if(!Object.keys(state.prices||{}).length)await marketPromise;
    state.loading=false;
    if(!history.state?.mialbumView&&!history.state?.mialbumDetail)replaceAppHistory();
    renderShell();
    // If cached prices allowed an immediate paint, apply the fresh dataset as
    // soon as it arrives without blocking navigation.
    marketPromise.then(()=>{if(!state.detail)renderVisibleOnly()});
    await loadShared();
    renderShell();
  }catch(e){$("#app").innerHTML='<div class="wrap"><div class="hero"><div><h1>MiAlbumOnePiece</h1><p>No se pudo cargar el catálogo.</p></div></div><div class="section"><div class="notice">Error cargando datos: '+esc(e.message||"desconocido")+'</div><button class="primary btn" onclick="location.reload()">Reintentar</button></div></div>'}
  await initSupabase();
  reloadViewPending=false;
  if(savedReloadView)restoreReloadView(savedReloadView);
  else renderShell();
window.addEventListener("popstate",e=>{
  if(state.detail){
    detailHistoryActive=false;
    state.detail=null;
    renderShell();
    return;
  }
  if(restoreAppView(e.state?.mialbumView))return;
});
}boot();
