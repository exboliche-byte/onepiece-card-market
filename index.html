function filteredCards(mode){

    meta.eur,

  for(const raw of candidates){
    const n=Number(raw);

      :null)||matches.find(x=>Number(x?.eur)>0);
    const n=Number(match?.eur);
    if(Number.isFinite(n)&&n>0)return n;
  }

function parseDeckListLine(line){

  if(!idMatch)return null;
  const id=idMatch[1],before=raw.slice(0,idMatch.index),after=raw.slice((idMatch.index||0)+id.length);

function deckValidate(d){
  const total=Object.values(d.cards||{}).reduce((s,n)=>s+Number(n||0),0),messages=[],leader=card(d.leader);
  const banned=new Set(["OP06-047","OP03-040","OP06-086","ST10-001","OP06-116"]);
  const pairs=[["OP07-115","EB04-058"],["OP11-040","OP11-067"],["OP11-040","OP08-069"]];
  let illegal=0;if(!leader)messages.push("Líder no seleccionado");if(total!==50)messages.push(total+"/50 cartas no líder");
  const ids=Object.entries(d.cards||{}),baseCounts=new Map();
  for(const [id,n] of ids){const c=card(id);const base=baseId(id);baseCounts.set(base,(baseCounts.get(base)||0)+Number(n||0));if(!c){illegal++;continue}if(c.category==="Leader"){illegal++;continue}if(Number(n)>4){illegal++;messages.push(c.id+">4 copias")}if(banned.has(base)){illegal++;messages.push(base+" prohibida")}if(leader&&!(c.colors||[]).some(col=>(leader.colors||[]).includes(col))){illegal++;}}
  for(const [base,count] of baseCounts)if(count>4){illegal++;messages.push(base+">4 copias totales entre versiones")}
  for(const [a,b] of pairs){if(ids.some(([id,n])=>baseId(id)===a&&Number(n)>0)&&ids.some(([id,n])=>baseId(id)===b&&Number(n)>0)){illegal++;messages.push("pareja prohibida "+a+" + "+b)}}
  if(illegal)messages.push(illegal+" carta(s) ilegales");
  return {total,illegal,valid:!!leader&&total===50&&illegal===0,messages};
}

function changeQty(id,d){

async function clearCollection(){
  if(!confirm("¿Borrar TODA tu colección?\n\nSe eliminarán todas las cantidades guardadas en este dispositivo y, si tienes sesión iniciada, también de la nube.\n\nEsta acción no se puede deshacer."))return;
  state.owned={};
  saveLocal();
  if(state.user&&state.sb){
    try{
      const r=await state.sb.from("collection_items").delete().eq("user_id",state.user.id);
      if(r.error)throw r.error;
    }catch(e){
      notify("Colección local borrada, pero no se pudo borrar la nube");
      console.warn("clear collection cloud",e);
      renderShell();
      return;
    }
  }
  state.collection.page=1;
  renderShell();
  notify("Colección borrada");
}
function setQty(id,n){n=Math.max(0,Math.min(99,Number(n)||0));if(n===0)delete state.owned[id];else state.owned[id]=n;saveLocal();syncOne(id,n);renderVisibleOnly()}
function deckCardTotal(d){return Object.values(d?.cards||{}).reduce((s,n)=>s+Number(n||0),0)}
function changeDeckQty(id,delta){
  const d=state.decks.find(x=>x.id===state.deckId);if(!d)return;
  const cc=card(id);if(!cc||cc.category==="Leader")return;
  if(Number(delta)>0){
    const leader=card(d.leader);if(!leader)return notify("Elige primero un líder");
    if(!(cc.colors||[]).some(col=>(leader.colors||[]).includes(col)))return notify("Esa carta no coincide con el color del líder");
    if(deckCardTotal(d)>=50)return notify("El mazo ya tiene 50 cartas");
    const used=Object.entries(d.cards||{}).filter(([x])=>baseId(x)===baseId(id)).reduce((s,[,q])=>s+Number(q||0),0);
    if(used>=4)return notify("Máximo 4 copias de ese número de carta");
  }
  const next=Math.max(0,Math.min(4,Number(d.cards[id]||0)+Number(delta||0)));
  if(next===0)delete d.cards[id];else d.cards[id]=next;
  d.updatedAt=new Date().toISOString();saveLocal();syncDeck(d);renderShell();
}
function setLeader(id){
  const d=state.decks.find(x=>x.id===state.deckId),cc=card(id);if(!d||!cc||cc.category!=="Leader")return;
  d.leader=id;d.colors=cc.colors||[];d.updatedAt=new Date().toISOString();
  state.deckQuery="";state.deckPage=1;Object.assign(state.deckFilters,{category:"Todos",color:"Todos"});
  saveLocal();syncDeck(d);renderShell();notify("Líder seleccionado");
}
function removeLeader(){
  const d=state.decks.find(x=>x.id===state.deckId);if(!d)return;
  d.leader="";d.colors=[];d.updatedAt=new Date().toISOString();state.deckQuery="";state.deckPage=1;saveLocal();syncDeck(d);renderShell();notify("Líder quitado; las cartas del mazo se conservan");
}
function addToDeck(id){
  const d=state.decks.find(x=>x.id===state.deckId);if(!d)return;
  const cc=card(id);if(!cc)return;
  if(cc.category==="Leader"){setLeader(id);return}
  changeDeckQty(id,1);
}

function parseCSV(text){
  text=String(text??"").replace(/^(?:\uFEFF|ï»¿)/,"");
  const rows=[];let row=[],cell="",quote=false;
  const firstLine=(text.split(/\r?\n/,1)[0]||"").replace(/^(?:\uFEFF|ï»¿)/,"");
  const delim=firstLine.includes(",")?",":";";
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(ch==='"'&&quote&&nx==='"'){cell+='"';i++;continue}
    if(ch==='"'){quote=!quote;continue}
    if(ch===delim&&!quote){row.push(cell);cell="";continue}
    if((ch==="\n"||ch==="\r")&&!quote){
      if(ch==="\r"&&nx==="\n")i++;
      row.push(cell);rows.push(row);row=[];cell="";continue;
    }
    cell+=ch;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
function csvRarityToApp(value){

function internalSetCode(value){

function normalizeCSVHeader(value){

}
function printSetCodeFromText(value){
  const raw=String(value||"").trim();
  if(!raw)return "";
  const upper=raw.toUpperCase();
  const bracket=[...upper.matchAll(/\[((?:OP|EB|ST|PRB)-?\d{2})\]/g)];
  if(bracket.length)return normalizePrintSet(bracket[bracket.length-1][1]);
  const direct=upper.match(/\b(PRB|OP|EB|ST)[-_\s]?(\d{2})\b/);
  if(direct)return normalizePrintSet(direct[1]+direct[2]);
  if(/PROMOTION\s*CARD|\bPROMO(?:TION)?\b/.test(upper)||upper==="P")return "P";
  return "";
}
function csvSetNameKey(value){

}
function marketExpansionKey(value){

    .replace(/\b(?:op|eb|st|prb)\s*0*\d+\b/g," ")
    .replace(/\b(?:starter deck|ultra deck|ultimate deck|extra booster|booster pack|premium booster)\b/g," ")
    .replace(/\s+/g," ")

function marketCollectionMatchesSet(collection,wantedSet){
  const wanted=normalizePrintSet(wantedSet);
  if(!wanted)return false;
  if(normalizePrintSet(collection?.setCode)===wanted)return true;

  const target=marketExpansionKey(collection?.expansion);
  if(!target)return false;
  const names=state.packs
    .filter(p=>normalizePrintSet(p?.code)===wanted)
    .map(p=>marketExpansionKey(p?.name))
    .filter(Boolean);
  return names.some(name=>name===target||name.includes(target)||target.includes(name));
}
function exactMarketSetOf(c){
  const meta=directMarketMeta(c);
  const productId=Number(meta?.cardmarketId);
  if(!Number.isFinite(productId))return "";
  const exact=(meta?.collections||[]).find(x=>
    Number(x?.cardmarketId)===productId&&normalizePrintSet(x?.setCode)
  );
  return normalizePrintSet(exact?.setCode);
}
function catalogPrintSetOf(c){
  const imported=normalizePrintSet(c?.importPrintSet);
  if(imported)return imported;

  // "Promotion card" es más específico que el set lógico de la carta.
  const nameCode=printSetCodeFromText(c?.set_name);
  if(nameCode==="P")return "P";

  // Para casos como EB04 dentro de OP14, usar el set del MISMO producto
  // Cardmarket. No usar toda la lista collections: contiene otras reimpresiones.
  const exactMarketSet=exactMarketSetOf(c);
  if(exactMarketSet)return exactMarketSet;
  if(nameCode)return nameCode;

  const metaSet=normalizePrintSet(directMarketMeta(c)?.printSet);
  if(metaSet)return metaSet;
  return variantKindOf(c)==="base"
    ?(printSetCodeFromText(c?.set)||normalizePrintSet(c?.set))
    :"";

function csvPrintSetMatches(c,value){
  const raw=String(value||"").trim();
  if(!raw)return false;
  const wantedCode=printSetCodeFromText(raw)||normalizePrintSet(raw);
  const candidateCode=catalogPrintSetOf(c);
  if(wantedCode&&candidateCode&&wantedCode===candidateCode)return true;

  // Solo comparar la identidad propia de esta impresión. La lista histórica
  // collections nunca debe convertir otra versión de la carta en candidata.
  const wantedName=csvSetNameKey(raw),candidateName=csvSetNameKey(c?.set_name);
  return wantedName.length>=5&&candidateName.includes(wantedName);
}
function importMarketSource(logicalId,kind,printSet,rawVariant="",priceHint=null){
  const logical=String(logicalId||"").trim().toUpperCase();
  const wantedKind=String(kind||"").trim().toLowerCase()||"base";
  const wantedSet=String(printSet||"").trim();
  if(!logical||!wantedSet)return null;

  const candidates=state.cards.filter(c=>
    !c?.syntheticImport&&
    norm(baseId(c?.id))===norm(logical)&&
    variantKindOf(c)===wantedKind&&
    csvPrintSetMatches(c,wantedSet)
  );
  const normalizedVariant=String(rawVariant||"").trim().replace(/_base$/i,"");
  const exact=candidates.find(c=>norm(c.id)===norm(normalizedVariant));
  if(exact)return exact;

  // If the CSV variant suffix does not identify an exact catalog printing,
  // do not silently replace it with another printing just because the logical
  // card, kind and set look similar. Keep it synthetic and preserve variant_id.
  if(normalizedVariant)return null;
  if(candidates.length===1)return candidates[0];

  const hint=Number(priceHint);
  if(Number.isFinite(hint)&&hint>0&&candidates.length>1){
    const ranked=candidates.map(c=>({
      card:c,
      price:Number(state.prices?.[c.id]??state.prices?.[norm(c.id)])
    })).filter(x=>Number.isFinite(x.price)&&x.price>0)
      .map(x=>({...x,diff:Math.abs(Math.log(x.price/hint))}))
      .sort((a,b)=>a.diff-b.diff);
    if(ranked.length===1||(ranked.length>1&&ranked[1].diff-ranked[0].diff>0.08))return ranked[0].card;
  }
  return null;
}
function importedSourceCard(c){

  const wantedSet=String(c?.importPrintSet||"").trim();
  const explicit=String(c?.importResolvedCardId||"").trim();
  if(explicit){
    const source=state.cards.find(x=>!x?.syntheticImport&&norm(x.id)===norm(explicit));
    if(source&&(!wantedSet||csvPrintSetMatches(source,wantedSet)))return source;
  }
  return importMarketSource(
    baseId(c?.id||c?.importVariantId),
    c?.importVariantKind||"base",
    wantedSet,
    c?.importVariantId||"",
    c?.importUnitPrice
  );
}
function resolveCSVPrint(logicalId,rawVariant,kind,printSet){
  const logical=String(logicalId||"").trim().toUpperCase();
  const wantedKind=String(kind||"").trim().toLowerCase()||"base";
  const wantedSet=String(printSet||"").trim();
  const normalizedVariant=String(rawVariant||"").trim().replace(/_base$/i,"");
  const candidates=state.cards.filter(c=>norm(baseId(c.id))===norm(logical));
  const compatible=candidates.filter(c=>variantKindOf(c)===wantedKind);

  // variant_id is authoritative. If that exact catalog ID exists, import it.
  // print_set is useful metadata/disambiguation, but must never turn a supplied
  // variant_id into a synthetic/wrong card because catalog set metadata differs.
  const exact=compatible.find(c=>norm(c.id)===norm(normalizedVariant));
  if(exact)return exact;

  // Only when the CSV does not provide a usable variant suffix may print_set
  // disambiguate a single catalog printing.
  if(wantedSet&&!/_((?:p|r|c)\d+)$/i.test(String(rawVariant||""))){
    const bySet=compatible.filter(c=>csvPrintSetMatches(c,wantedSet));
    if(bySet.length===1)return bySet[0];
  }

  if(wantedKind==="base")return candidates.find(c=>norm(c.id)===norm(logical))||null;
  return null;
}
function syntheticCSVCard(row,logicalId,variantId,kind,printSet){

  const wantedSet=normalizePrintSet(printSet);

      const visual=marketSource||exactVisual;
      return String(visual?.image||visual?.imageUrl||"https://asia-en.onepiece-cardgame.com/images/cardlist/card/"+encodeURIComponent(visual?.id||visualId)+".png");
    })(),
    isParallel:kind==="parallel",
    syntheticImport:true,
    importVariantId:originalVariant,
    importPrintSet:String(printSet||""),
    importVariantKind:String(kind||"base"),
    importResolvedCardId:String(marketSource?.id||""),
    importUnitPrice:priceHint
  };
}
function previewImport(text){
  try{
    const rows=parseCSV(text);
    if(rows.length<2)throw Error("CSV vacío: no se encontraron filas de datos.");
    const h=rows[0].map(normalizeCSVHeader);
    const aliases={
      card_id:["card_id","id","numero","number"],
      variant_id:["variant_id","version_id","variant","version"],
      variant_kind:["variant_kind","version_kind","kind"],
      print_set:["print_set","printing_set","reprint_set"],
      card_set:["card_set","cardset","card_set_name"],
      unit_price:["unit_price","price","precio"],
      name:["name","nombre"],
      set_code:["set_code","set"],
      set_name:["set_name","expansion"],
      rarity:["rarity","rareza"],
      quantity:["quantity","cantidad","qty","copias"]
    };
    const findIndex=names=>names.map(n=>h.indexOf(n)).find(i=>i>=0);
    const idx={};for(const [k,names] of Object.entries(aliases))idx[k]=findIndex(names);
    if(idx.card_id===undefined||idx.quantity===undefined)throw Error("El CSV debe contener las columnas card_id y quantity.");

    const imported=new Map(),unknown=[],created={},importMeta={},resolvedByPrintSet=[];
    for(const r of rows.slice(1)){
      const get=k=>idx[k]===undefined?"":String(r[idx[k]]??"").trim();
      const logicalId=get("card_id").toUpperCase();
      if(!logicalId)continue;
      const rawVariant=get("variant_id")||logicalId+"_base";
      const kind=(get("variant_kind")||(/_r\d+$/i.test(rawVariant)?"reprint":/_(?:p|c)\d+$/i.test(rawVariant)?"parallel":"base")).toLowerCase();
      const printSet=get("print_set")||get("card_set");
      const rawQty=get("quantity").replace(",",".");
      const n=Number(rawQty);
      const q=Number.isFinite(n)?Math.max(0,Math.min(99,Math.round(n))):NaN;
      if(!Number.isFinite(q)){unknown.push(logicalId+" (cantidad no válida)");continue}

      let match=resolveCSVPrint(logicalId,rawVariant,kind,printSet);
      if(match&&printSet&&norm(match.id)!==norm(rawVariant.replace(/_base$/i,"")))resolvedByPrintSet.push(logicalId+" → "+match.id);
      const unitPriceRaw=Number(get("unit_price").replace(",","."));
      const unitPrice=Number.isFinite(unitPriceRaw)&&unitPriceRaw>0?unitPriceRaw:null;
      if(!match){
        const row={name:get("name"),set_code:get("set_code"),set_name:get("set_name"),rarity:get("rarity"),unit_price:get("unit_price")};
        match=syntheticCSVCard(row,logicalId,rawVariant,kind,printSet);
        created[match.id]=match;
      }else if(unitPrice!==null){
        // Guardar el precio de la fila solo como respaldo. No modifica el
        // catálogo ni sustituye el precio dinámico cuando éste existe.
        importMeta[match.id]={
          id:match.id,
          importVariantId:rawVariant,
          importVariantKind:kind,
          importPrintSet:String(printSet||""),
          importUnitPrice:unitPrice,
          metadataOnly:true
        };
      }
      imported.set(match.id,(imported.get(match.id)||0)+q);
    }

    const sum=[...imported.values()].reduce((a,x)=>a+x,0);
    const logicalCount=new Set([...imported.keys()].map(baseId)).size;
    const createdCount=Object.keys(created).length;
    const msg="Filas: "+(rows.length-1)+
      " · versiones: "+imported.size+
      " · cartas: "+logicalCount+
      " · "+sum+" copias"+
      (createdCount?"\nVersiones añadidas desde el CSV: "+createdCount:"")+
      (resolvedByPrintSet.length?"\nVersiones resueltas por expansión de impresión: "+resolvedByPrintSet.length:"")+
      (unknown.length?"\nNo importables: "+unknown.slice(0,15).join(", ")+(unknown.length>15?" …":""):"")+
      "\n\nCada cantidad se guardará en su impresión exacta. No se sustituirá una reimpresión/paralela por la carta base.";
    if(confirm(msg+"\n\nAceptar = importar. Cancelar = no cambiar nada.")){
      state.owned={};
      state.importedCards={...state.importedCards,...created,...importMeta};
      for(const [id,q] of imported)if(q>0)state.owned[id]=q;
      saveLocal();
      prepareCatalog(state.cards.filter(c=>!c.syntheticImport),state.packs);
      if(state.user)syncCloud();
      state.collection.page=1;
      renderShell();
      notify("Colección importada: "+sum+" copias en "+imported.size+" versiones");
    }
  }catch(e){alert(e.message||"CSV no válido")}
}
const REMOTE_ALLSETS="https://raw.githubusercontent.com/hugoprudente/optcgjson/main/output/AllSets.json";
async function loadCatalogData(){
  // Prefer the repository's committed catalog. The GitHub Action keeps it current,
  // and this prevents a temporary upstream format/network change from blanking the app.
  try{
    const [localCards,localPacks]=await Promise.all([
      fetchJson(DATA+"cards.json",20000),
      fetchJson(DATA+"packs.json",20000)
    ]);
    const cards=(Array.isArray(localCards)?localCards:Object.values(localCards||{})).filter(c=>c?.id&&!isJapaneseCatalogCard(c));
    const packs=Array.isArray(localPacks)?localPacks:Object.values(localPacks||{});
    if(cards.length&&packs.length)return {cards,packs,remote:false};
  }catch(e){console.warn("local catalog",e)}
  // Last-resort upstream fallback.
  try{
    const remoteAllSets=await fetchJson(REMOTE_ALLSETS,30000);
    const cards=[];const packs=[];const seen=new Set();
    const normalizeSetCode=raw=>{const v=String(raw||"").trim().toUpperCase();if(v==="OP14")return "OP14-EB04";if(v==="OP15")return "OP15-EB04";const m=v.match(/^(OP|EB|ST|PRB)-?(\d{2})$/i);return m?m[1].toUpperCase()+"-"+m[2]:v};
    const root=remoteAllSets?.data&&typeof remoteAllSets.data==="object"&&!Array.isArray(remoteAllSets.data)?remoteAllSets.data:(remoteAllSets||{});
    for(const [key,payload] of Object.entries(root)){
      const d=payload?.data||payload;
      if(!d||!Array.isArray(d.cards))continue;
      const setCode=normalizeSetCode(d.code||key),setName=String(d.name||"").trim(),setCards=d.cards;
      packs.push({code:setCode,name:setName,cardCount:setCards.length});
      for(const c of setCards){
        const id=String(c?.id||"").trim();if(!id||seen.has(id))continue;
        if(Array.isArray(c.languages)&&c.languages.length&&!c.languages.some(x=>/^English$/i.test(String(x))))continue;
        seen.add(id);
        const m=id.toUpperCase().match(/^(OP|EB|ST|PRB)(\d{2})-/i),cardSet=m?normalizeSetCode(m[1]+m[2]):setCode;
        cards.push({id,set:cardSet,set_name:setName,name:String(c?.name||"").trim(),rarity:c?.rarity==="L"?"Leader":String(c?.rarity||"").trim(),category:c?.cardClass==="LEADER"?"Leader":c?.cardClass==="EVENT"?"Event":c?.cardClass==="STAGE"?"Stage":c?.cardClass==="DON"?"Don":"Character",colors:Array.isArray(c?.color)?c.color:[],cost:c?.cost==null?null:Number(c.cost),power:c?.power==null?null:Number(c.power),counter:c?.counter==null?null:Number(c.counter),block:c?.blockIcon==null?null:Number(c.blockIcon)||c.blockIcon,attributes:Array.isArray(c?.attribute)?c.attribute:[],types:Array.isArray(c?.feature)?c.feature:[],effect:c?.effect||"",trigger:c?.trigger||null,image:c?.imageUrl||"",isParallel:!!c?.isParallel});
      }
    }
    if(cards.length&&packs.length)return {cards,packs,remote:true};
  }catch(e){console.warn("remote catalog",e)}
  throw Error("No se pudo cargar el catálogo.");
}
async function boot(){
  loadLocal();
  loadCachedPrices();
  renderShell();
  try{
    // Load catalog and market data together. On a true first visit there is no
    // local price cache, so the first card grid must not render until prices are
    // available (or the market feed has actually failed).
    const catalogPromise=loadCatalogData();
    const marketPromise=loadMarketPrices().catch(e=>{console.warn("market prices",e);return null});
    const data=await catalogPromise;
    prepareCatalog(data.cards,data.packs);
    if(!Object.keys(state.prices||{}).length)await marketPromise;
    state.loading=false;
    renderShell();
    // If cached prices allowed an immediate paint, apply the fresh dataset as
    // soon as it arrives without blocking navigation.
    marketPromise.then(()=>{if(!state.detail)renderVisibleOnly()});
    await loadShared();
    renderShell();
  }catch(e){$("#app").innerHTML='<div class="wrap"><div class="hero"><div><h1>MiAlbumOnePiece</h1><p>No se pudo cargar el catálogo.</p></div></div><div class="section"><div class="notice">Error cargando datos: '+esc(e.message||"desconocido")+'</div><button class="primary btn" onclick="location.reload()">Reintentar</button></div></div>'}
  initSupabase();
window.addEventListener("popstate",()=>{
  if(state.detail){
    detailHistoryActive=false;
    state.detail=null;
    renderShell();
  }
});
}boot();
</script>
