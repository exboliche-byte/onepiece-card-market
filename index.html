rsion-list{display:flex;gap:6px;overflow:auto;padding-bottom:4px}.version{min-width:74px}.version img{width:74px;aspect-ratio:.716;object-fit:cover;border-radius:6px;display:block}.version small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.leaderBadge{border:1px solid var(--accent);color:var(--accent);padding:3px 6px;border-radius:999px;font-size:9px}.filter-panel{background:#0d131e;border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}.filter-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.filter-heading h3{margin:0;font-size:15px}.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.control-label{display:grid;gap:5px;font-size:11px;font-weight:800;color:var(--muted)}.control-label .field{font-weight:600;color:var(--text)}.catalog-controls{display:grid;gap:8px;margin-bottom:10px}.sort-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}.filter-toggle{width:100%;text-align:left}.filter-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:11px}.active-filters-note{font-size:11px;color:var(--muted)}.fileinput{display:none}@media(max-width:800px){.toolbar{grid-template-columns:1fr 1fr}.toolbar3{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.deckbuilder{grid-template-columns:1fr}.detail{grid-template-columns:150px 1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.setgrid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.filter-grid{grid-template-columns:1fr}.sort-controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}.detail>div:first-child{max-width:260px;margin:auto}.nav{grid-template-columns:repeat(5,1fr)}}

<script>

const PAGE=60;
const state={
  cards:[],packs:[],groups:[],groupByKey:new Map(),prices:{},priceDate:null,
  collection:{},decks:[],wishlist:{},user:null,sb:null,
  tab:"catalog",set:"",query:"",detail:null,deckId:null,
  catalog:{set:"Todas",category:"Todos",color:"Todos",rarity:"Todos",type:"Todos",attribute:"Todos",ownership:"Todas",sort:"id",dir:"asc",page:1,grouped:true,minCost:"",maxCost:"",minPower:"",maxPower:"",query:"",filtersOpen:false},
  owned:{},collection:{query:"",set:"Todas",category:"Todos",color:"Todos",rarity:"Todos",type:"Todos",attribute:"Todos",quantity:"Todas",playset:"Todas",sort:"id",dir:"asc",page:1,filtersOpen:false},
  album:{set:"",query:"",ownership:"Todas",sort:"id",dir:"asc",page:1},
  deckQuery:"",deckPage:1,deckFilters:{category:"Todos",color:"Todos",rarity:"Todos",filtersOpen:false},auth:false,toast:"",loading:true
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const money=n=>Number.isFinite(Number(n))?Number(n).toLocaleString("es-ES",{style:"currency",currency:"EUR"}):"—";
const safeId=id=>String(id||"");
const imagePreloadCache=new Map();
const officialImageUrl=c=>"https://en.onepiece-cardgame.com/images/cardlist/card/"+encodeURIComponent(c?.id||"")+".png";
const imageUrl=c=>officialImageUrl(c);
function preloadCardImage(c){const u=officialImageUrl(c);if(!u||imagePreloadCache.has(u))return;const im=new Image();im.src=u;imagePreloadCache.set(u,im)}
function cardImg(c,cls="cardimg"){
  const u=imageUrl(c),official=officialImageUrl(c),proxy="https://images.weserv.nl/?url="+encodeURIComponent(u.replace(/^https?:\/\//,""));
  return '<img class="'+cls+'" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="'+esc(u)+'" alt="'+esc(c.name||c.id)+'" onerror="if(!this.dataset.fallback){this.dataset.fallback=1;this.src=\''+esc(proxy)+'\';}else if(!this.dataset.official){this.dataset.official=1;this.src=\''+esc(official)+'\';}">';
}
function qty(id){return Number(state.owned[id]||0)}
function card(id){return state.cards.find(c=>c.id===id)}
function baseId(id){return safeId(id).replace(/_(?:p\\d+|r\\d+)$/i,"")}
function groupKey(c){
  return norm([c.name,c.category,c.cost,c.power,c.counter,(c.colors||[]).join(","),(c.types||[]).join(","),c.effect,c.trigger].join("|"));
}
function uniqueSorted(arr){return [...new Set(arr.filter(v=>v!==null&&v!==undefined&&String(v)!==""))].sort((a,b)=>String(a).localeCompare(String(b),"es"))}
function setName(code){return state.packs.find(p=>p.code===code)?.name||code}
function packLabel(p){return String(p?.code||"")}
function prepareCatalog(raw,packs){
  state.packs=Array.isArray(packs)?packs:Object.values(packs);
  state.cards=(Array.isArray(raw)?raw:Object.values(raw)).map(c=>({...c,id:String(c.id||"").trim(),set:String(c.set||"").trim(),set_name:c.set_name||setName(c.set||"")})).filter(c=>c.id);
  const map=new Map();
  for(const c of state.cards){c.search=norm([c.id,c.name,c.set,c.set_name,c.category,c.rarity,...(c.colors||[]),...(c.types||[]),...(c.attributes||[]),c.effect,c.trigger].join(" "));const k=groupKey(c);if(!map.has(k))map.set(k,{key:k,card:c,ids:[],sets:new Set()});const g=map.get(k);g.ids.push(c.id);g.sets.add(c.set)}
  state.groups=[...map.values()].map(g=>({...g,sets:[...g.sets].sort(),versions:g.ids.map(id=>card(id))}));
  state.groupByKey=map;
  if(!state.album.set)state.album.set="";
}
async function fetchJson(url,timeout=15000){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),timeout);
  try{const r=await fetch(url,{cache:"no-store",signal:ac.signal});if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}finally{clearTimeout(t)}
}
function saveLocal(){localStorage.setItem("mialbumonepiece_collection",JSON.stringify(state.owned));localStorage.setItem("mialbumonepiece_decks",JSON.stringify(state.decks));localStorage.setItem("mialbumonepiece_wishlist",JSON.stringify(state.wishlist))}
function loadLocal(){try{state.owned=JSON.parse(localStorage.getItem("mialbumonepiece_collection")||"{}")}catch{}try{state.decks=JSON.parse(localStorage.getItem("mialbumonepiece_decks")||"[]")}catch{}try{state.wishlist=JSON.parse(localStorage.getItem("mialbumonepiece_wishlist")||"{}")}catch{}}
function notify(msg){state.toast=msg;renderToast();setTimeout(()=>{if(state.toast===msg){state.toast="";renderToast()}},1800)}
function renderToast(){const old=$(".toast");if(old)old.remove();if(state.toast){const d=document.createElement("div");d.className="toast";d.textContent=state.toast;document.body.appendChild(d)}}
function collectionStats(){
  const distinct=Object.values(state.owned).filter(q=>Number(q)>0).length;
  const copies=Object.values(state.owned).reduce((a,b)=>a+Number(b||0),0);
  const playsets=state.cards.filter(c=>qty(c.id)>=4).length;
  const incomplete=state.cards.filter(c=>qty(c.id)>0&&qty(c.id)<4).length;
  const distinctTotal=state.cards.length;
  const completePct=distinctTotal?distinct/distinctTotal*100:0;
  let value=0;
  for(const c of state.cards)value+=qty(c.id)*Number(state.prices[c.id]||0);
  return {distinct,copies,playsets,incomplete,distinctTotal,completePct,value};
}
function option(values,current){return values.map(v=>'<option value="'+esc(v)+'" '+(String(v)===String(current)?"selected":"")+'>'+esc(v)+'</option>').join("")}
function values(key,from=state.cards){return uniqueSorted(from.flatMap(c=>Array.isArray(c[key])?c[key]:[c[key]]))}
function filteredCards(mode){
  const f=state[mode];
  let list=mode==="collection"
    ? state.cards.filter(c=>qty(c.id)>0)
    : mode==="album" && f.set ? state.cards.filter(c=>c.set===f.set) : state.cards;
  const q=norm(f.query||state.query||"");
  if(q)list=list.filter(c=>c.search.includes(q));
  if(mode==="catalog"&&f.set&&f.set!=="Todas")list=list.filter(c=>c.set===f.set);
  if(f.category&&f.category!=="Todos")list=list.filter(c=>c.category===f.category);
  if(f.color&&f.color!=="Todos")list=list.filter(c=>(c.colors||[]).includes(f.color));
  if(f.rarity&&f.rarity!=="Todos")list=list.filter(c=>c.rarity===f.rarity);
  if(f.type&&f.type!=="Todos")list=list.filter(c=>(c.types||[]).includes(f.type));
  if(f.attribute&&f.attribute!=="Todos")list=list.filter(c=>(c.attributes||[]).includes(f.attribute));
  if(mode==="catalog"){
    if(f.minCost!=="")list=list.filter(card=>Number(card.cost??-1)>=Number(f.minCost));
    if(f.maxCost!=="")list=list.filter(card=>Number(card.cost??9999)<=Number(f.maxCost));
    if(f.minPower!=="")list=list.filter(card=>Number(card.power??-1)>=Number(f.minPower));
    if(f.maxPower!=="")list=list.filter(card=>Number(card.power??-1)<=Number(f.maxPower));
  }
  if(mode==="catalog"){
    if(f.ownership==="Tengo")list=list.filter(c=>qty(c.id)>0);
    if(f.ownership==="Me faltan")list=list.filter(c=>qty(c.id)<PLAYSET);
  }
  if(mode==="collection"){
    if(f.set&&f.set!=="Todas")list=list.filter(c=>c.set===f.set);
    if(f.quantity==="1")list=list.filter(c=>qty(c.id)===1);
    if(f.quantity==="2")list=list.filter(c=>qty(c.id)===2);
    if(f.quantity==="3")list=list.filter(c=>qty(c.id)===3);
    if(f.quantity==="4+")list=list.filter(c=>qty(c.id)>=4);
    if(f.playset==="Completo")list=list.filter(c=>qty(c.id)>=4);
    if(f.playset==="Incompleto")list=list.filter(c=>qty(c.id)>0&&qty(c.id)<4);
  }
  if(mode==="album")list=list.filter(c=>qty(c.id)>0);
  if(mode==="album"&&f.ownership==="Me faltan")list=list.filter(c=>qty(c.id)<PLAYSET);
  const dir=f.dir==="desc"?-1:1;
  const p=c=>Number(state.prices[c.id]||0);
  list.sort((a,b)=>{
    let av,bv;
    switch(f.sort){case"name":av=norm(a.name);bv=norm(b.name);break;case"set":av=a.set;bv=b.set;break;case"rarity":av=norm(a.rarity);bv=norm(b.rarity);break;case"quantity":av=qty(a.id);bv=qty(b.id);break;case"price":av=p(a);bv=p(b);break;case"power":av=Number(a.power||0);bv=Number(b.power||0);break;case"cost":av=Number(a.cost||0);bv=Number(b.cost||0);break;default:av=a.id;bv=b.id}
    if(av<bv)return -1*dir;if(av>bv)return 1*dir;return a.id.localeCompare(b.id)*dir;
  });
  return list;
}
function groupFiltered(){
  const arr=filteredCards("catalog");
  state.catalog.grouped=true;
  if(!state.catalog.grouped)return arr.map(c=>({key:c.id,card:c,versions:[c],sets:[c.set]}));
  const by=new Map();
  for(const c of arr){const k=groupKey(c);if(!by.has(k))by.set(k,{key:k,card:c,versions:[],sets:[]});const g=by.get(k);g.versions.push(c);if(!g.sets.includes(c.set))g.sets.push(c.set)}
  return [...by.values()];
}
async function ensurePrices(ids){
  const wanted=[...new Set(ids.filter(id=>state.prices[id]===undefined))];
  if(!wanted.length)return;
  for(let i=0;i<wanted.length;i+=80){
    const chunk=wanted.slice(i,i+80);
    try{const d=await fetchJson("/api/cardmarket?ids="+encodeURIComponent(chunk.join(",")),12000);Object.assign(state.prices,d.prices||{});state.priceDate=d.updatedAt||state.priceDate;localStorage.setItem("mialbumonepiece_prices",JSON.stringify({prices:state.prices,updatedAt:state.priceDate}));}catch{}
  }
  // Evita desmontar y volver a cargar las imágenes cuando llegan los precios.
}
function loadCachedPrices(){try{const d=JSON.parse(localStorage.getItem("mialbumonepiece_prices")||"null");if(d?.prices)state.prices=d.prices;state.priceDate=d?.updatedAt||null}catch{}}
function cardTile(c,extra=""){

  return '<article class="card">'+(q?'<span class="tag">×'+q+'</span>':'<span class="tag missing">0/4</span>')+

    '<div class="cardbody"><div class="name">'+esc(c.name)+'</div><div class="small">'+esc(c.id)+' · '+esc(c.set)+' · '+esc(c.rarity||"—")+'</div>'+
    '<div class="chips">'+(c.colors||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+'</div>'+
    '<div class="row"><span>'+ (p!==undefined?money(p):"Precio —")+'</span><span class="small">'+q+'/4</span></div>'+
    '<div class="quick"><button class="secondary" data-qty="'+esc(c.id)+'" data-d="-1">−</button><div class="qty">'+q+'</div><button class="primary" data-qty="'+esc(c.id)+'" data-d="1">+</button></div>'+
    extra+'</div></article>';
}
function groupedTile(g){
  const c=g.card,q=g.versions.reduce((s,x)=>s+qty(x.id),0);
  const bestPrice=g.versions.map(x=>Number(state.prices[x.id])).filter(Number.isFinite).sort((a,b)=>a-b)[0];
  return '<article class="card">'+(q?'<span class="tag">×'+q+' total</span>':'<span class="tag missing">Falta</span>')+
    '<button class="linkbtn" data-detail="'+esc(c.id)+'" style="display:block;width:100%;padding:0">'+cardImg(c)+'</button>'+
    '<div class="cardbody"><div class="name">'+esc(c.name)+'</div><div class="small">'+esc(c.category||"")+' · '+g.versions.length+' versión(es)</div>'+
    '<div class="chips">'+g.sets.slice(0,5).map(x=>'<span class="chip">'+esc(x)+'</span>').join("")+(g.sets.length>5?'<span class="chip">+'+(g.sets.length-5)+'</span>':"")+'</div>'+
    '<div class="row"><span>'+(Number.isFinite(bestPrice)?money(bestPrice):"Precio —")+'</span><span class="small">'+q+' copias</span></div>'+
    '<div class="quick"><button class="secondary" data-qty="'+esc(c.id)+'" data-d="-1">−</button><div class="qty">'+q+'</div><button class="primary" data-qty="'+esc(c.id)+'" data-d="1">+</button></div><button class="secondary btn" style="width:100%;margin-top:8px" data-group="'+esc(c.id)+'">Ver versiones</button></div></article>';

function pagination(total,page,key){
  const pages=Math.max(1,Math.ceil(total/PAGE));page=Math.min(page,pages);
  if(pages<=1)return "";
  return '<div class="pager"><button class="secondary btn" data-page="'+key+'" data-p="-1">‹</button><span>'+page+' / '+pages+' · '+total.toLocaleString("es-ES")+'</span><button class="secondary btn" data-page="'+key+'" data-p="1">›</button></div>';
}
function catalogActiveFilterCount(){
  const f=state.catalog;let n=0;

  let illegal=0;if(!leader)messages.push("Líder no seleccionado");if(total!==50)messages.push(total+"/50 cartas no líder");
  const ids=Object.entries(d.cards||{}),baseCounts=new Map();
  for(const [id,n] of ids){const c=card(id);const base=baseId(id);baseCounts.set(base,(baseCounts.get(base)||0)+Number(n||0));if(!c){illegal++;continue}if(c.category==="Leader"){illegal++;continue}if(Number(n)>4){illegal++;messages.push(c.id+">4 copias")}if(banned.has(base)){illegal++;messages.push(base+" prohibida")}if(leader&&!(c.colors||[]).some(col=>(leader.colors||[]).includes(col))){illegal++;}}
  for(const [base,count] of baseCounts)if(count>4){illegal++;messages.push(base+">4 copias totales entre versiones")}
  for(const [a,b] of pairs){if(ids.some(([id,n])=>baseId(id)===a&&Number(n)>0)&&ids.some(([id,n])=>baseId(id)===b&&Number(n)>0)){illegal++;messages.push("pareja prohibida "+a+" + "+b)}}
  if(illegal)messages.push(illegal+" carta(s) ilegales");
  return {total,illegal,valid:!!leader&&total===50&&illegal===0,messages};
}

function changeDeckQty(id,d){

  let n=Math.max(0,Math.min(4,Number(deck.cards[id]||0)+Number(d||0)));

    const ci=await state.sb.from("collection_items").select("card_id,quantity,updated_at").eq("user_id",state.user.id);
    for(const r of ci.data||[])state.owned[r.card_id]=Math.max(qty(r.card_id),Number(r.quantity||0));

    const cardsBy=new Map();for(const r of dc.data||[]){if(!cardsBy.has(r.deck_id))cardsBy.set(r.deck_id,{});cardsBy.get(r.deck_id)[r.card_id]=Number(r.quantity||0)}
    for(const d of ds.data||[]){const local=state.decks.find(x=>x.id===d.id);if(local){local.name=d.name;local.description=d.description||"";local.leader=local.leader||d.leader_card_id||"";local.cards={...(cardsBy.get(d.id)||{}),...(local.cards||{})}}else state.decks.push({id:d.id,name:d.name,description:d.description||"",leader:d.leader_card_id||"",cards:cardsBy.get(d.id)||{},colors:d.colors||[]})}
    saveLocal();
  }catch(e){console.warn("cloud sync",e)}

function renderShareModal(){
  const old=$(".sharemodal");if(old)old.remove();
  const d=state.detail;const m=document.createElement("div");m.className="modalback sharemodal";m.innerHTML='<div class="modal"><div class="sectionhead"><h2>Compartir mazo</h2><button class="close" data-shareclose>×</button></div><p class="muted">Enlace público / compartible:</p><input class="field" id="shareUrl" readonly value="'+esc(d.shareUrl)+'"><div class="inline-actions" style="margin-top:9px"><button class="primary btn" id="copyShare">Copiar enlace</button><button class="secondary btn" id="makeQr">Generar QR</button></div><div id="qrBox" class="center" style="margin-top:12px"></div></div></div>';document.body.appendChild(m);
  $("#copyShare").onclick=async()=>{await navigator.clipboard?.writeText(d.shareUrl);notify("Enlace copiado")};
  $("#makeQr").onclick=async()=>{const box=$("#qrBox");try{if(!window.QRCode){const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js";await new Promise((res,rej)=>{s.onload=res;s.onerror=rej;document.head.appendChild(s)})}const can=document.createElement("canvas");await QRCode.toCanvas(can,d.shareUrl,{width:240,margin:2});box.innerHTML="";box.appendChild(can)}catch{box.textContent="No se pudo generar el QR"}};
  $("[data-shareclose]").onclick=()=>m.remove();
}
async function loadShared(){
  const slug=location.pathname.match(/^\/deck\/([^/]+)$/)?.[1]||new URLSearchParams(location.search).get("deckshare");if(!slug)return;
  try{
    let p;
    if(location.pathname.startsWith("/deck/")){const r=await fetch(SUPABASE_URL+"/rest/v1/deck_shares?select=payload&share_slug=eq."+encodeURIComponent(slug)+"&limit=1",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});const rows=await r.json();p=rows[0]?.payload}
    else{let b=slug.replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";p=JSON.parse(decodeURIComponent(escape(atob(b))))}
    if(p){const fake={id:"shared",name:p.name,leader:p.leader,cards:p.cards,description:p.description};state.tab="decks";state.decks=[fake];state.deckId="shared";state.shared=true}
  }catch{}
}
function sharedDeckView(){
  const d=state.decks.find(x=>x.id==="shared"),v=deckValidate(d||{});if(!d)return "";
  return '<div class="wrap"><div class="hero"><div><h1>Mazo compartido</h1><p>'+esc(d.name)+'</p></div></div><div class="section"><div class="stats"><div class="stat"><b>'+v.total+'/50</b><span>Cartas</span></div><div class="stat"><b>'+esc(d.leader||"—")+'</b><span>Líder</span></div><div class="stat"><b>'+money(deckMissingCost(d))+'</b><span>Faltantes</span></div><div class="stat"><b>'+ (v.valid?"✓":"⚠")+'</b><span>Legalidad</span></div></div><div class="list">'+deckRows(d)+'</div></div></div>';
}
function csvEscape(v){const s=String(v??"");return /[;"\\n\\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCollectionCSV(){
  const rows=[["card_id","name","set","set_name","rarity","category","colors","types","quantity","playset"]];
  for(const c of state.cards){const q=qty(c.id);if(q)rows.push([c.id,c.name,c.set,c.set_name||setName(c.set),c.rarity,c.category,(c.colors||[]).join("|"),(c.types||[]).join("|"),q,Math.min(q,4)+"/4"])}
  const csv="\\ufeff"+rows.map(r=>r.map(csvEscape).join(";")).join("\\r\\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="mialbumonepiece-collection-"+new Date().toISOString().slice(0,10)+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify("CSV exportado");
}
function parseCSV(text){
  const rows=[];let row=[],cell="",quote=false,delim=(text.split(/\\r?\\n/,1)[0]||"").includes(";")?";":",";
  for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(ch==='"'&&quote&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){quote=!quote;continue}if(ch===delim&&!quote){row.push(cell);cell="";continue}if((ch==="\\n"||ch==="\\r")&&!quote){if(ch==="\\r"&&nx==="\\n")i++;row.push(cell);rows.push(row);row=[];cell="";continue}cell+=ch}if(cell.length||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
function previewImport(text){
  try{const rows=parseCSV(text);if(rows.length<2)throw Error("CSV vacío");const h=rows[0].map(x=>norm(x).replace(/\\s+/g,"_"));const idI=Math.max(h.indexOf("card_id"),h.indexOf("id"),h.indexOf("numero"),h.indexOf("number"));const qI=Math.max(h.indexOf("quantity"),h.indexOf("cantidad"),h.indexOf("qty"),h.indexOf("copias"));if(idI<0||qI<0)throw Error("Faltan card_id/id y quantity/cantidad");const unknown=[],valid=[];for(const r of rows.slice(1)){const id=String(r[idI]||"").trim().toUpperCase(),q=Math.max(0,Math.min(99,Number(r[qI]||0)));if(card(id))valid.push([id,q]);else unknown.push(id)}const sum=valid.reduce((a,x)=>a+x[1],0);const msg="Filas: "+(rows.length-1)+" · reconocidas: "+valid.length+" · desconocidas: "+unknown.length+" · copias: "+sum+(unknown.length?"\\nIDs no encontrados: "+unknown.slice(0,20).join(", "):"");if(confirm(msg+"\\n\\nAceptar = sumar cantidades. Cancelar = no importar.")){for(const [id,q] of valid){state.owned[id]=qty(id)+q;if(state.owned[id]>99)state.owned[id]=99}saveLocal();if(state.user)syncCloud();renderVisibleOnly();notify("Colección importada")}}catch(e){alert(e.message||"CSV no válido")}
}
const REMOTE_CARDS="https://raw.githubusercontent.com/michalkiral/optcg-data/main/data/index/cards_by_id.json";
const REMOTE_PACKS="https://raw.githubusercontent.com/michalkiral/optcg-data/main/data/packs.json";
const REMOTE_OP17="https://raw.githubusercontent.com/hugoprudente/optcgjson/main/output/OP17.json";
async function loadCatalogData(){
  try{
    const [remoteCards,remotePacks,op17]=await Promise.all([fetchJson(REMOTE_CARDS,30000),fetchJson(REMOTE_PACKS,20000),fetchJson(REMOTE_OP17,30000)]);
    let cards=Array.isArray(remoteCards)?remoteCards:Object.values(remoteCards||{});
    const o17=op17?.data?.cards||[];
    const normalized17=o17.map(c=>({id:c.id,set:"OP-17",name:c.name,rarity:c.rarity==="L"?"Leader":c.rarity,category:c.cardClass==="LEADER"?"Leader":(c.cardClass==="EVENT"?"Event":(c.cardClass==="STAGE"?"Stage":"Character")),colors:c.color||[],cost:c.cost===null?null:Number(c.cost),power:c.power===null?null:Number(c.power),counter:c.counter===null?null:Number(c.counter),attributes:c.attribute||[],types:c.feature||[],effect:c.effect||"",trigger:c.trigger||null,image:c.imageUrl||"",isParallel:!!c.isParallel}));
    const ids=new Set(normalized17.map(c=>c.id));
    cards=cards.filter(c=>!ids.has(c.id)).concat(normalized17);
    let packs=Array.isArray(remotePacks)?remotePacks:[];
    if(!packs.some(p=>p.code==="OP-17"))packs=packs.concat([{code:"OP-17",name:"THE WORLD'S STRONGEST WARRIORS",cardCount:normalized17.length}]);
    if(!cards.length||!packs.length)throw Error("Fuente remota vacía");
    return {cards,packs,remote:true};
  }catch(e){
    const [localCards,localPacks]=await Promise.all([fetchJson(DATA+"cards.json"),fetchJson(DATA+"packs.json")]);
    return {cards:Array.isArray(localCards)?localCards:Object.values(localCards||{}),packs:localPacks,remote:false};
  }
}
async function boot(){
  loadLocal();loadCachedPrices();renderShell();
  try{const data=await loadCatalogData();prepareCatalog(data.cards,data.packs);state.loading=false;renderShell();await loadShared();if(state.shared)renderShell();if(state.tab==="catalog")ensurePrices(groupFiltered().slice(0,PAGE).flatMap(g=>(g.versions||[g.card]).map(c=>c.id)));}catch(e){$("#app").innerHTML='<div class="wrap"><div class="hero"><div><h1>MiAlbumOnePiece</h1><p>No se pudo cargar el catálogo.</p></div></div><div class="section"><div class="notice">Error cargando datos: '+esc(e.message||"desconocido")+'</div><button class="primary btn" onclick="location.reload()">Reintentar</button></div></div>'}
  initSupabase();
}boot();
