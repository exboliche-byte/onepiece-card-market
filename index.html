const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function safeJSON(v,f){
  try{return JSON.parse(v||"")}catch(e){return f}
}

function qty(id){return Math.max(0,Number(collection[id]||0))}
function price(id){return Number(prices.get(id)||0)}
function euro(n){return Number.isFinite(Number(n))?Number(n).toFixed(2).replace(".",",")+" €":"—"}
function cardById(id){return cards.find(c=>c.id===id)}
function baseCardId(id){return String(id||"").replace(/_(?:p|r)\d+$/i,"")}
function setLabel(code){return packMap.get(code)||code}
function setOptions(){
  return ["Todos"].concat(packs.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code))).map(p=>p.code));
}
function rarityOptions(){
  return ["Todos"].concat(Array.from(new Set(cards.map(c=>c.rarity).filter(Boolean))).sort());
}
function colorOptions(){
  return ["Todos"].concat(Array.from(new Set(cards.flatMap(c=>c.colors||[]))).sort());
}
function categoryOptions(){return ["Todos","Leader","Character","Event","Stage","Don"]}

function imageTags(c,cls){
  const id=encodeURIComponent(c.id);
  const base=encodeURIComponent(baseCardId(c.id));
  const first=c.image||OFFICIAL_IMAGE(c.id);
  return '<img class="'+(cls||"")+'" loading="lazy" decoding="async" data-card-image="'+id+'" data-f1="'+esc(IMAGE_PROXY(c.id))+'" data-f2="'+esc(OFFICIAL_IMAGE(c.id))+'" data-f3="'+esc(IMAGE_PROXY(baseCardId(c.id)))+'" data-f4="'+esc(OFFICIAL_IMAGE(baseCardId(c.id)))+'" data-fallback="0" src="'+esc(first)+'" alt="'+esc(c.name)+'">';
}
function wireImages(){
  document.querySelectorAll("img[data-card-image]").forEach(img=>{
    if(img.dataset.bound)return;
    img.dataset.bound="1";
    img.onerror=function(){
      let n=Number(this.dataset.fallback||0)+1;
      this.dataset.fallback=String(n);
      const next=this.dataset["f"+n];
      if(next && this.src!==next)this.src=next;
      else this.classList.add("broken");
    };
  });
}

function selectHtml(id,vals,val){
  return '<select data-filter="'+id+'">'+vals.map(x=>'<option value="'+esc(x)+'" '+(String(x)===String(val)?"selected":"")+'>'+esc(x)+"</option>").join("")+"</select>";
}
function sortCards(arr,sort,dir){
  const mul=dir==="desc"?-1:1;
  return arr.slice().sort((a,b)=>{
    let av,bv;
    if(sort==="name"){av=norm(a.name);bv=norm(b.name)}
    else if(sort==="price"){av=price(a.id);bv=price(b.id)}
    else if(sort==="qty"){av=qty(a.id);bv=qty(b.id)}
    else if(sort==="value"){av=price(a.id)*qty(a.id);bv=price(b.id)*qty(b.id)}
    else {av=norm(a.id);bv=norm(b.id)}
    if(av<bv)return -1*mul;
    if(av>bv)return 1*mul;
    return 0;
  });
}

function filteredCatalog(){
  let arr=cards.filter(c=>{
    if(filters.cat!=="Todos" && String(c.category||"")!==filters.cat)return false;
    if(filters.color!=="Todos" && !(c.colors||[]).some(x=>norm(x)===norm(filters.color)))return false;
    if(filters.rarity!=="Todos" && c.rarity!==filters.rarity)return false;
    if(filters.set!=="Todos" && c.set!==filters.set)return false;
    if(filters.own==="owned" && qty(c.id)===0)return false;
    if(filters.own==="missing" && qty(c.id)>0)return false;
    if(q && !norm([c.id,c.name,c.rarity,c.set,(c.colors||[]).join(" "),(c.types||[]).join(" ")].join(" ")).includes(norm(q)))return false;
    return true;
  });
  return sortCards(arr,filters.sort,filters.dir);
}

function cardHtml(c,mode){
  const owned=qty(c.id);
  const p=price(c.id);
  const controls=mode==="collection"
    ? '<div class="qtyctrl"><button class="secondary mini" data-remove="'+esc(c.id)+'">−</button><b>'+owned+"</b><button class=\"primary mini\" data-add=\""+esc(c.id)+'">+</button></div>'
    : '<div class="actions"><button class="secondary btn" data-detail="'+esc(c.id)+'">Ver</button><button class="primary btn" data-add="'+esc(c.id)+'">Añadir</button></div>';
  return '<article class="card">'+imageTags(c)+"<div class=\"body\"><div class=\"name\">"+esc(c.name)+"</div><div class=\"muted\">"+esc(c.id)+" · "+esc(c.rarity||"—")+' · '+esc(c.set||"—")+"</div><div class=\"pills\">"+(c.colors||[]).map(x=>'<span class="pill">'+esc(x)+"</span>").join("")+"</div><div class=\"row\"><b>"+(p?euro(p):"Precio ref. —")+'</b><span class="muted">'+(owned?"Tienes ×"+owned:"No la tienes")+"</span></div>"+controls+"</div></article>";
}

function catalog(){
  const all=filteredCatalog();
  const shown=all.slice(0,page*60);
  const more=shown.length<all.length;
  return '<div class="wrap"><div class="hero"><div><h1>Catálogo</h1><p>'+cards.length.toLocaleString("es-ES")+' cartas disponibles · mostrando '+shown.length+" de "+all.length+" filtradas.</p></div><div class=\"statsmini\"><b>"+cards.length+"</b><span>cartas</span></div></div>"+
    '<div class="search"><input id="catalogQ" value="'+esc(q)+'" placeholder="Busca nombre, ID, personaje, colección..."><button class="primary btn" id="catalogSearch">Buscar</button></div>'+
    '<div class="filters">'+selectHtml("cat",categoryOptions(),filters.cat)+selectHtml("color",colorOptions(),filters.color)+selectHtml("rarity",rarityOptions(),filters.rarity)+selectHtml("set",setOptions(),filters.set)+'</div>'+
    '<div class="filters">'+selectHtml("own",["all","owned","missing"],filters.own||"all")+selectHtml("sort",["id","name","qty","price"],filters.sort)+selectHtml("dir",["asc","desc"],filters.dir)+'</div>'+
    '<div class="subbar"><span>Modo: todas las cartas</span><button class="secondary btn" id="clearCatalog">Limpiar filtros</button></div>'+
    '<div class="grid">'+(shown.length?shown.map(c=>cardHtml(c,"catalog")).join(""):'<div class="empty">No hay cartas con estos filtros.</div>')+"</div>"+
    (more?'<div class="loadmore"><button class="primary btn" id="loadMore">Cargar más cartas</button></div>':"")+"</div>";

function collectionFiltered(){
  let arr=cards.filter(c=>{
    if(qty(c.id)<=0)return false;
    if(collectionFilters.set!=="Todos" && c.set!==collectionFilters.set)return false;
    if(collectionFilters.cat!=="Todos" && c.category!==collectionFilters.cat)return false;
    if(collectionFilters.color!=="Todos" && !(c.colors||[]).some(x=>norm(x)===norm(collectionFilters.color)))return false;
    if(collectionFilters.rarity!=="Todos" && c.rarity!==collectionFilters.rarity)return false;
    if(collectionFilters.q && !norm([c.id,c.name,c.set,(c.colors||[]).join(" "),(c.types||[]).join(" ")].join(" ")).includes(norm(collectionFilters.q)))return false;
    return true;
  });
  return sortCards(arr,collectionFilters.sort,collectionFilters.dir);
}
function collectionStats(){
  const owned=cards.filter(c=>qty(c.id)>0);
  const copies=owned.reduce((s,c)=>s+qty(c.id),0);
  const missingPlayset=cards.reduce((s,c)=>s+Math.max(0,4-qty(c.id)),0);
  const playsets=cards.filter(c=>qty(c.id)>=4).length;
  return {distinct:owned.length,copies,missingPlayset,playsets,total:cards.length};
}
function expansionStats(){
  return packs.slice().sort((a,b)=>String(a.code).localeCompare(String(b.code))).map(p=>{
    const cs=cards.filter(c=>c.set===p.code);
    const owned=cs.filter(c=>qty(c.id)>0).length;
    const copies=cs.reduce((s,c)=>s+qty(c.id),0);
    const missing=cs.length-owned;
    const playset=cs.reduce((s,c)=>s+Math.max(0,4-qty(c.id)),0);
    return {code:p.code,name:p.name,total:cs.length,owned,copies,missing,playset,completion:cs.length?Math.round(owned*100/cs.length):0}
  });
}
function collectionView(){
  const st=collectionStats();

  return '<div class="wrap"><div class="hero"><div><h1>Mi colección</h1><p>'+st.distinct+" cartas distintas · "+st.copies+" copias · "+st.playsets+" playsets completos.</p></div><div class=\"statsmini\"><b>"+st.missingPlayset+"</b><span>copias para playset</span></div></div>"+

    '<div class="section"><div class="sectiontitle"><h2>Filtros y orden</h2><button class="secondary btn" id="csvExport">Exportar CSV</button></div>'+
    '<div class="search"><input id="collectionQ" value="'+esc(collectionFilters.q)+'" placeholder="Buscar en mi colección..."></div>'+
    '<div class="filters">'+selectHtml("collectionSet",setOptions(),collectionFilters.set)+selectHtml("collectionCat",categoryOptions(),collectionFilters.cat)+selectHtml("collectionColor",colorOptions(),collectionFilters.color)+selectHtml("collectionRarity",rarityOptions(),collectionFilters.rarity)+'</div>'+
    '<div class="filters">'+selectHtml("collectionSort",["name","id","qty","price","value"],collectionFilters.sort)+selectHtml("collectionDir",["asc","desc"],collectionFilters.dir)+'</div>'+
    '<div class="subbar"><span>'+arr.length+" cartas encontradas</span><div class=\"csvbuttons\"><button class=\"secondary btn\" id=\"csvImportBtn\">Importar CSV</button><input id=\"csvFile\" type=\"file\" accept=\".csv,text/csv\" hidden></div></div></div>"+
    '<div class="section"><div class="sectiontitle"><h2>Progreso por expansión</h2><span class="muted">Incluye todas las variantes publicadas en cada expansión.</span></div><div class="expgrid">'+ex.map(s=>'<button class="exp" data-exp="'+esc(s.code)+'"><div><b>'+esc(s.code)+" · "+esc(s.name)+"</b><div class=\"muted\">"+s.owned+"/"+s.total+" cartas · "+s.missing+" faltan · "+s.playset+" copias para playsets</div></div><strong>"+s.completion+"%</strong><small>"+s.copies+" copias</small></button>").join("")+"</div></div>"+
    '<div class="grid">'+(arr.length?arr.map(c=>cardHtml(c,"collection")).join(""):'<div class="empty">No tienes cartas que coincidan.</div>')+"</div></div>";
}

function deckStats(d){
  const total=Object.values(d.cards||{}).reduce((s,n)=>s+Number(n||0),0);
  let missing=0,missingValue=0;
  if(d.leader){
    const lm=Math.max(0,1-qty(d.leader)); missing+=lm; missingValue+=lm*price(d.leader);
  }
  for(const [id,n] of Object.entries(d.cards||{})){
    const m=Math.max(0,Number(n)-qty(id)); missing+=m; missingValue+=m*price(id);
  }
  return {total,missing,missingValue,leaderOwned:d.leader?qty(d.leader):0};
}
function deckCardRows(d){
  const entries=Object.entries(d.cards||{}).filter(([,n])=>Number(n)>0).sort((a,b)=>a[0].localeCompare(b[0]));
  return entries.map(([id,n])=>{
    const c=cardById(id); if(!c)return "";
    const have=qty(id), missing=Math.max(0,Number(n)-have), p=price(id);
    return '<div class="listrow deckrow">'+imageTags(c,"thumb")+'<div class="deckinfo"><b>'+esc(c.id)+"</b><div>"+esc(c.name)+'</div><div class="muted">Necesitas '+n+" · Tienes "+have+" · Faltan "+missing+(p?' · '+euro(p)+" / ud.":"")+(missing&&p?" · "+euro(missing*p)+" por comprar":"")+"</div></div><button class=\"secondary mini\" data-minusdeck=\""+esc(id)+'">−</button><b>'+n+'</b><button class="primary mini" data-plusdeck="'+esc(id)+'">+</button></div>';
  }).join("");
}
function deckEditor(d){
  const st=deckStats(d);
  const leader=cardById(d.leader);
  const leaders=cards.filter(c=>c.category==="Leader").sort((a,b)=>a.id.localeCompare(b.id));
  const sq=norm(deckSearch);
  const results=sq?cards.filter(c=>c.category!=="Don"&&norm([c.id,c.name,(c.types||[]).join(" "),(c.colors||[]).join(" ")].join(" ")).includes(sq)).slice(0,12):[];
  return '<div class="section"><div class="sectiontitle"><div><h2>'+esc(d.name)+'</h2><span class="muted">Líder + 50 cartas · máximo 4 copias por carta.</span></div><div class="rowBtns"><button class="secondary btn" id="shareDeck">Compartir</button><button class="secondary btn" id="deleteDeck">Eliminar</button></div></div>'+

function importShared(){
  if(!sharedDeck)return;
  const d={id:crypto.randomUUID(),name:(sharedDeck.name||"Mazo compartido")+" (copia)",leader:sharedDeck.leader||"",cards:{}};
  for(const [id,n] of Object.entries(sharedDeck.cards||{})){

  }

    for(const [id,n] of Object.entries(d.cards)){if(used>=50)break;const take=Math.min(Number(n),50-used);if(take){kept[id]=take;used+=take}}
    d.cards=kept;
  }
  decks.unshift(d);activeDeck=d.id;sharedDeck=null;saveLocal();syncDeck(d);history.replaceState({},document.title,location.pathname);render();notice("Mazo importado");
}

function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'&&q&&next==='"'){cell+='"';i++;continue}
    if(ch==='"'){q=!q;continue}
    if(!q&&(ch===";"||ch===",")){row.push(cell);cell="";continue}
    if(!q&&(ch==="\n"||ch==="\r")){if(ch==="\r"&&next==="\n")i++;row.push(cell);if(row.some(x=>x!==""))rows.push(row);row=[];cell="";continue}
    cell+=ch;
  }
  if(cell!==""||row.length){row.push(cell);if(row.some(x=>x!==""))rows.push(row)}
  return rows;
}
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error("CSV vacío");
  const head=rows[0].map(norm);
  const idIndex=head.findIndex(x=>x==="id"||x==="card_id"||x==="codigo");
  const qtyIndex=head.findIndex(x=>x==="quantity"||x==="cantidad"||x==="qty");
  if(idIndex<0||qtyIndex<0)throw new Error("El CSV necesita columnas id y quantity/cantidad");
  let imported=0;
  const next={};
  for(const row of rows.slice(1)){
    const id=String(row[idIndex]||"").trim(),n=Math.max(0,Math.min(99,parseInt(String(row[qtyIndex]||"0").replace(",","."))||0));
    if(cardById(id)){if(n)next[id]=n;imported++}
  }
  collection=next;saveLocal();syncCollection();render();notice(imported+" cartas importadas");
}

async function loadCardmarketPrices(){
  try{
    const results=await Promise.allSettled([fetchJson(CARDMARKET_PRODUCTS,25000),fetchJson(CARDMARKET_PRICES,25000)]);
    if(results[0].status!=="fulfilled"||results[1].status!=="fulfilled")return;
    const products=Array.isArray(results[0].value)?results[0].value:Object.values(results[0].value||{});
    const guide=Array.isArray(results[1].value)?results[1].value:Object.values(results[1].value||{});
    const byProduct=new Map();
    guide.forEach(r=>{const id=r?.idProduct??r?.productId??r?.id;if(id!=null)byProduct.set(String(id),r)});
    const codeMap=new Map();
    const nameSetMap=new Map();
    cards.forEach(c=>{
      codeMap.set(norm(c.id),c.id);
      codeMap.set(norm(baseCardId(c.id)),c.id);
      nameSetMap.set(norm(c.name)+"|"+norm(c.set),c.id);
      nameSetMap.set(norm(c.name)+"|"+norm(setLabel(c.set)),c.id);
    });
    const getNum=row=>{
      if(!row)return 0;
      const entries=Object.entries(row);
      const low={};entries.forEach(([k,v])=>low[norm(k)]=v);
      const keys=["pricetrend","trend","avg30","priceaverage","average","priceavg","lowprice","price"];
      for(const k of keys){const raw=low[k];const n=Number(String(raw??"").replace(",", "."));if(Number.isFinite(n)&&n>0)return n}
      return 0;
    };
    const codeRe=/\b[A-Z]{1,6}\d{0,3}-\d{3}(?:_[A-Z0-9]+\d*)?\b|\bP-\d{3}(?:_[A-Z0-9]+\d*)?\b/gi;
    for(const p of products){
      const productId=p?.idProduct??p?.productId??p?.id;
      const row=productId!=null?byProduct.get(String(productId)):null;
      const value=getNum(row); if(!value)continue;
      const text=[p?.name,p?.enName,p?.number,p?.cardNumber,p?.cardId,p?.code].filter(Boolean).join(" ");
      const codes=text.match(codeRe)||[];
      let matched=null;
      for(const code of codes){matched=codeMap.get(norm(code));if(matched)break}
      if(!matched && p?.name){
        const nm=norm(String(p.name).replace(codeRe," "));
        const exp=norm(String(p.expansion??p.expansionName??""));
        for(const c of cards){
          if(norm(c.name)===nm || norm(c.name)===norm(String(p.name).split("(")[0].trim())){
            if(!exp||exp.includes(norm(setLabel(c.set))||"")||norm(setLabel(c.set)).includes(exp)){matched=c.id;break}
          }
        }
      }
      if(matched)prices.set(matched,value);
    }
    render();
  }catch(e){console.warn("Cardmarket price feed unavailable",e)}
}

function boot(){
  const qp=new URLSearchParams(location.search);
  if(qp.get("deck")){try{sharedDeck=JSON.parse(ub64u(qp.get("deck")))}catch(e){console.warn("Shared deck invalid",e)}}
  render();
  load();
  initSB();
}
async function load(){
  try{
    const raw=await fetchJson("./data/cards.json",20000);
    const obj=Array.isArray(raw)?raw.reduce((m,c)=>(m[c.id]=c,m),{}):raw;
    cards=Object.values(obj||{}).filter(c=>c&&c.id).map(c=>({...c,id:String(c.id),set:String(c.set||""),colors:Array.isArray(c.colors)?c.colors:[],types:Array.isArray(c.types)?c.types:[]}));
    const p=await fetchJson("./data/packs.json",15000);
    packs=Array.isArray(p)?p:Object.values(p||{});
    packMap=new Map(packs.map(x=>[String(x.code),String(x.name||x.code)]));
    if(!cards.length)throw new Error("Catálogo vacío");
    bootDone=true;render();
    setTimeout(loadCardmarketPrices,600);
  }catch(e){
    console.error("Catalog load failed",e);
    document.querySelector("#app").innerHTML='<div class="empty"><h2>No se pudo cargar el catálogo</h2><p>La base de datos de cartas no está disponible.</p><button class="primary btn" onclick="location.reload()">Reintentar</button></div>';
  }
}
boot();
window.addEventListener("load",()=>{if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})});
</script></body></html>
